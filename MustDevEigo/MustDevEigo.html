<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MustDevEigo — エンジニア必須英単語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* === Primitive Colors === */
  --az-color-white: #FFFFFF;
  --az-color-black: #0D0D0D;
  --az-color-off-white: #F5F1EB;
  --az-color-cream: #F9F8F0;
  --az-color-warm-gray-50: #FAF9F7;
  --az-color-warm-gray-100: #F0EEEA;
  --az-color-warm-gray-200: #E6E8EA;
  --az-color-warm-gray-300: #D0C2B9;
  --az-color-warm-gray-400: #B7B3B3;
  --az-color-gray-500: #7D8281;
  --az-color-charcoal-700: #545A59;
  --az-color-charcoal-900: #252721;
  --az-color-coral-500: #EB6D55;
  --az-color-coral-600: #D95C47;
  --az-color-lime-500: #AACE38;
  --az-color-lime-600: #8FB82E;
  --az-color-amber-500: #F5B300;
  --az-color-amber-600: #D99A00;
  --az-color-navy-900: #1E2836;
  --az-color-blue-gray-200: #B5CAE3;

  /* === Semantic Colors === */
  --az-color-bg-page: var(--az-color-off-white);
  --az-color-bg-surface: var(--az-color-white);
  --az-color-bg-soft: var(--az-color-warm-gray-50);
  --az-color-bg-azraku: var(--az-color-cream);
  --az-color-border-default: var(--az-color-warm-gray-200);
  --az-color-border-strong: var(--az-color-warm-gray-300);
  --az-color-text-primary: var(--az-color-charcoal-900);
  --az-color-text-body: var(--az-color-charcoal-700);
  --az-color-text-subtle: var(--az-color-gray-500);
  --az-color-text-inverse: var(--az-color-white);
  --az-color-action-primary: var(--az-color-coral-500);
  --az-color-action-primary-hover: var(--az-color-coral-600);
  --az-color-action-secondary: var(--az-color-lime-500);
  --az-color-action-secondary-hover: var(--az-color-lime-600);
  --az-color-attention: var(--az-color-amber-500);
  --az-color-focus-ring: rgba(235, 109, 85, 0.32);

  /* === Typography === */
  --az-font-family-sans: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --az-font-family-en: Inter, Arial, sans-serif;

  /* === Radius === */
  --az-radius-sm: 8px;
  --az-radius-md: 12px;
  --az-radius-lg: 16px;
  --az-radius-xl: 20px;
  --az-radius-full: 9999px;
}

:root[data-theme="dark"] {
  --az-color-bg-page: #1A1814;
  --az-color-bg-surface: #252721;
  --az-color-bg-soft: #2D2D26;
  --az-color-bg-azraku: #2A2620;
  --az-color-border-default: #3D3D33;
  --az-color-border-strong: #5A5345;
  --az-color-text-primary: #F5F1EB;
  --az-color-text-body: #D0C2B9;
  --az-color-text-subtle: #9D9080;
  --az-color-text-inverse: #FFFFFF; /* coral/limeなど色付き面に置く文字。両モードで白を維持 */
}

/* === ダークモード用のコンポーネント補正 ===
   light primitive (warm-gray-50/100) を直接使っている場所を、暗背景で潰れないように上書きする */
:root[data-theme="dark"] .quiz-progress {
  background: #3D3D33;
}
:root[data-theme="dark"] .choice-num {
  background: #3D3D33;
  color: var(--az-color-text-body);
}
:root[data-theme="dark"] .cat-row.selected {
  background: rgba(255, 255, 255, 0.06);
}
:root[data-theme="dark"] .feedback {
  background: var(--az-color-bg-soft);
  border-color: var(--az-color-border-default);
}
:root[data-theme="dark"] .feedback.correct {
  background: rgba(170, 206, 56, 0.18);
}
:root[data-theme="dark"] .feedback.incorrect {
  background: rgba(235, 109, 85, 0.18);
}
:root[data-theme="dark"] .choice.correct {
  background: rgba(170, 206, 56, 0.16);
}
:root[data-theme="dark"] .choice.incorrect {
  background: rgba(235, 109, 85, 0.16);
}
:root[data-theme="dark"] .wb-toolbar input[type="search"]::placeholder {
  color: #6E665A;
}
:root[data-theme="dark"] .kbd {
  background: var(--az-color-bg-soft);
  color: var(--az-color-text-body);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--az-font-family-sans);
  font-size: 14px;
  line-height: 1.55;
  background: var(--az-color-bg-page);
  color: var(--az-color-text-body);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 16px 16px;
}

/* ヘッダー */
.app-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 10px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--az-color-border-default);
}
.brand {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  color: var(--az-color-text-primary);
  line-height: 1.3;
  white-space: nowrap;
}
.brand em {
  font-style: normal;
  color: var(--az-color-text-subtle);
  font-weight: 400;
  font-size: 11px;
  margin-left: 6px;
}
.app-actions { display: inline-flex; gap: 12px; align-items: baseline; }
.link-btn {
  background: transparent;
  border: 0;
  color: var(--az-color-text-subtle);
  font-family: inherit;
  font-size: 12px;
  padding: 2px 0;
  cursor: pointer;
  font-weight: 500;
  white-space: nowrap;
}
.link-btn:hover { color: var(--az-color-action-primary); }
.link-btn.active { color: var(--az-color-text-primary); font-weight: 700; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 6px;
  color: var(--az-color-text-subtle);
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
}
.icon-btn:hover { color: var(--az-color-action-primary); background: var(--az-color-bg-soft); }
.icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--az-color-focus-ring); }
.theme-icon { display: inline-flex; align-items: center; justify-content: center; }
.theme-icon svg { display: block; }

/* ブロック */
.block {
  background: var(--az-color-bg-surface);
  border: 1px solid var(--az-color-border-default);
  border-radius: var(--az-radius-md);
  padding: 12px 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  margin-bottom: 10px;
}

.section-title {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--az-color-text-subtle);
  letter-spacing: 0.04em;
}
.muted { color: var(--az-color-text-subtle); font-size: 12px; margin: 0; }

/* CTA */
.cta {
  background: var(--az-color-bg-azraku);
  border: 1px solid var(--az-color-border-default);
  border-radius: var(--az-radius-lg);
  padding: 14px 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.cta-info { flex: 1 1 auto; min-width: 0; }
.cta-eyebrow {
  font-size: 11px;
  color: var(--az-color-text-subtle);
  margin: 0;
  letter-spacing: 0.04em;
  font-weight: 500;
}
.cta-summary {
  margin: 1px 0 0;
  font-size: 16px;
  font-weight: 700;
  color: var(--az-color-text-primary);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cta-summary .sep { color: var(--az-color-text-subtle); font-weight: 400; margin: 0 6px; }

/* ボタン */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  padding: 0 16px;
  border: 1px solid var(--az-color-action-primary);
  border-radius: var(--az-radius-sm);
  background: var(--az-color-bg-surface);
  color: var(--az-color-action-primary);
  font-family: var(--az-font-family-sans);
  font-size: 14px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--az-color-bg-soft); }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--az-color-focus-ring); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:disabled:hover { background: var(--az-color-bg-surface); }
.btn-primary {
  background: var(--az-color-action-primary);
  color: var(--az-color-text-inverse);
  border-color: var(--az-color-action-primary);
}
.btn-primary:hover {
  background: var(--az-color-action-primary-hover);
  border-color: var(--az-color-action-primary-hover);
  color: var(--az-color-text-inverse);
}
.btn-large { min-height: 40px; padding: 0 20px; font-size: 14px; }
.btn-link {
  background: transparent;
  border: 0;
  color: var(--az-color-action-primary);
  font-size: 12px;
  font-weight: 500;
  padding: 2px 6px;
  cursor: pointer;
  font-family: inherit;
  border-radius: 4px;
  min-height: auto;
}
.btn-link:hover { color: var(--az-color-action-primary-hover); background: rgba(235, 109, 85, 0.08); }
.btn-link:disabled { color: var(--az-color-text-subtle); cursor: not-allowed; opacity: 0.6; }
.btn-link:disabled:hover { background: transparent; }

/* カテゴリーリスト */
.cat-list { margin: 0; }
.cat-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 6px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.12s;
}
.cat-row:hover { background: var(--az-color-bg-soft); }
.cat-row.selected { background: var(--az-color-warm-gray-100); }
.cat-mark {
  width: 14px;
  text-align: center;
  color: var(--az-color-action-primary);
  font-weight: 700;
  font-size: 11px;
  flex-shrink: 0;
}
.cat-row.selected .cat-mark::before { content: "●"; }
.cat-name {
  flex: 1;
  min-width: 0;
  font-weight: 700;
  font-size: 14px;
  color: var(--az-color-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cat-name .desc {
  color: var(--az-color-text-subtle);
  font-size: 11px;
  font-weight: 400;
  margin-left: 6px;
}
.cat-count {
  color: var(--az-color-text-subtle);
  font-family: var(--az-font-family-en);
  font-size: 12px;
  font-variant-numeric: tabular-nums lining-nums;
  white-space: nowrap;
  flex-shrink: 0;
}

/* オプション行 */
.options-row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--az-color-border-default);
  font-size: 13px;
}
.options-row label { color: var(--az-color-text-body); display: inline-flex; align-items: center; gap: 6px; }
.options-row select {
  background: var(--az-color-bg-surface);
  color: var(--az-color-text-body);
  border: 1px solid var(--az-color-border-default);
  border-radius: 6px;
  padding: 3px 8px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
}
.options-row select:focus { outline: none; border-color: var(--az-color-action-primary); box-shadow: 0 0 0 3px var(--az-color-focus-ring); }
.options-row input[type="checkbox"] { accent-color: var(--az-color-action-primary); width: 14px; height: 14px; }

/* 履歴 */
.history-list { margin: 0; }
.history-row {
  display: flex;
  gap: 10px;
  padding: 4px 0;
  border-top: 1px solid var(--az-color-border-default);
  align-items: baseline;
  font-size: 13px;
}
.history-row:first-child { border-top: 0; padding-top: 0; }
.history-date {
  width: 86px;
  flex-shrink: 0;
  color: var(--az-color-text-subtle);
  font-family: var(--az-font-family-en);
  font-variant-numeric: tabular-nums lining-nums;
  font-size: 12px;
}
.history-cat {
  flex: 1;
  min-width: 0;
  color: var(--az-color-text-primary);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.history-stat {
  color: var(--az-color-action-primary);
  font-weight: 700;
  font-family: var(--az-font-family-en);
  font-variant-numeric: tabular-nums lining-nums;
  white-space: nowrap;
  flex-shrink: 0;
  font-size: 12px;
}
.history-empty { color: var(--az-color-text-subtle); font-size: 13px; padding: 2px 0; }

.data-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

.foot-link { text-align: center; margin-top: 8px; }

/* 出題画面 */
.quiz-progress {
  height: 3px;
  background: var(--az-color-warm-gray-100);
  border-radius: var(--az-radius-full);
  overflow: hidden;
  margin-bottom: 8px;
}
.quiz-progress > .fill {
  height: 100%;
  background: var(--az-color-action-primary);
  border-radius: var(--az-radius-full);
  transition: width 0.3s;
}
.quiz-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  color: var(--az-color-text-subtle);
  margin-bottom: 8px;
  font-family: var(--az-font-family-en);
  font-variant-numeric: tabular-nums lining-nums;
}
.quiz-meta .score { color: var(--az-color-text-body); font-weight: 500; }
.headword {
  font-family: var(--az-font-family-en);
  text-align: center;
  font-size: 32px;
  font-weight: 700;
  margin: 8px 0 2px;
  letter-spacing: -0.005em;
  word-break: break-word;
  line-height: 1.15;
  color: var(--az-color-text-primary);
}
.headword-prompt {
  text-align: center;
  color: var(--az-color-text-subtle);
  font-size: 12px;
  margin: 0 0 10px;
}

.choices { display: flex; flex-direction: column; gap: 6px; }
.choice {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--az-color-bg-surface);
  border: 1px solid var(--az-color-border-default);
  border-radius: var(--az-radius-sm);
  padding: 8px 12px;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  color: var(--az-color-text-primary);
  text-align: left;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  width: 100%;
}
.choice:hover:not(:disabled) {
  background: var(--az-color-bg-soft);
  border-color: var(--az-color-action-primary);
}
.choice:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--az-color-focus-ring); }
.choice:disabled { cursor: not-allowed; }
.choice-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: var(--az-radius-full);
  background: var(--az-color-warm-gray-100);
  color: var(--az-color-text-subtle);
  font-family: var(--az-font-family-en);
  font-weight: 700;
  font-size: 11px;
  flex-shrink: 0;
}
.choice-text { flex: 1; min-width: 0; line-height: 1.4; }
.choice.correct {
  background: rgba(170, 206, 56, 0.18);
  border-color: var(--az-color-action-secondary);
  border-width: 2px;
  padding: 7px 11px; /* compensate for 2px border */
}
.choice.correct .choice-num {
  background: var(--az-color-action-secondary);
  color: var(--az-color-white);
}
.choice.incorrect {
  background: rgba(235, 109, 85, 0.14);
  border-color: var(--az-color-action-primary);
  border-width: 2px;
  padding: 7px 11px;
  color: var(--az-color-text-primary);
}
.choice.incorrect .choice-num {
  background: var(--az-color-action-primary);
  color: var(--az-color-white);
}

.feedback {
  display: none;
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 13px;
  background: var(--az-color-warm-gray-50);
  border: 1px solid var(--az-color-border-default);
}
.feedback.show { display: block; }
.feedback.correct {
  background: rgba(170, 206, 56, 0.16);
  border-color: var(--az-color-action-secondary);
  color: var(--az-color-text-primary);
}
.feedback.correct strong { color: var(--az-color-action-secondary-hover); }
.feedback.incorrect {
  background: rgba(235, 109, 85, 0.12);
  border-color: var(--az-color-action-primary);
  color: var(--az-color-text-primary);
}
.feedback.incorrect strong { color: var(--az-color-action-primary-hover); }
.feedback strong { font-weight: 700; margin-right: 6px; }

.quiz-actions {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
}
.kb-hint {
  text-align: center;
  font-size: 11px;
  color: var(--az-color-text-subtle);
  margin-top: 6px;
}
.kbd {
  display: inline-block;
  padding: 0 5px;
  border: 1px solid var(--az-color-border-strong);
  border-radius: 3px;
  font-family: var(--az-font-family-en);
  font-size: 11px;
  font-weight: 500;
  color: var(--az-color-text-body);
  background: var(--az-color-bg-surface);
  margin: 0 2px;
  line-height: 1.4;
}

/* 結果画面 */
.result-headline {
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  color: var(--az-color-text-subtle);
  margin: 0 0 4px;
  letter-spacing: 0.04em;
}
.result-rate {
  text-align: center;
  font-family: var(--az-font-family-en);
  font-size: 40px;
  font-weight: 700;
  color: var(--az-color-action-primary);
  margin: 0;
  font-variant-numeric: tabular-nums lining-nums;
  line-height: 1;
  letter-spacing: -0.02em;
}
.result-correct {
  text-align: center;
  font-size: 12px;
  color: var(--az-color-text-body);
  margin: 4px 0 0;
  font-family: var(--az-font-family-en);
  font-variant-numeric: tabular-nums lining-nums;
}
.review-list { margin: 0; }
.review-row {
  display: flex;
  gap: 8px;
  padding: 4px 0;
  border-top: 1px solid var(--az-color-border-default);
  font-size: 13px;
  align-items: baseline;
}
.review-row:first-child { border-top: 0; padding-top: 0; }
.review-mark {
  width: 18px;
  flex-shrink: 0;
  font-weight: 700;
  text-align: center;
  color: var(--az-color-action-secondary);
}
.review-mark.ng { color: var(--az-color-action-primary); }
.review-row > .review-body { flex: 1; min-width: 0; }
.review-headword {
  font-family: var(--az-font-family-en);
  font-weight: 700;
  margin-right: 6px;
  color: var(--az-color-text-primary);
}
.review-meaning { color: var(--az-color-text-body); }
.review-picked {
  display: block;
  margin-top: 0;
  font-size: 11px;
  color: var(--az-color-text-subtle);
}
.review-picked::before { content: "選んだ: "; }

.result-actions {
  display: flex;
  gap: 8px;
  justify-content: space-between;
  margin-top: 12px;
  flex-wrap: wrap;
}
.sub-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 8px;
  flex-wrap: wrap;
}

/* 単語帳 */
.wb-toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 13px;
}
.wb-toolbar select {
  background: var(--az-color-bg-surface);
  color: var(--az-color-text-body);
  border: 1px solid var(--az-color-border-default);
  border-radius: 6px;
  padding: 4px 8px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
}
.wb-toolbar input[type="search"] {
  background: var(--az-color-bg-surface);
  color: var(--az-color-text-body);
  border: 1px solid var(--az-color-border-default);
  border-radius: 6px;
  padding: 0 10px;
  height: 32px;
  font-family: inherit;
  font-size: 13px;
  flex: 1;
  min-width: 160px;
}
.wb-toolbar input[type="search"]::placeholder { color: var(--az-color-warm-gray-400); }
.wb-toolbar input[type="search"]:focus,
.wb-toolbar select:focus {
  outline: none;
  border-color: var(--az-color-action-primary);
  box-shadow: 0 0 0 3px var(--az-color-focus-ring);
}

.wb-summary {
  font-size: 11px;
  color: var(--az-color-text-subtle);
  margin: 0 0 6px;

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n, exclude) {
  const pool = arr.filter(item => !exclude.includes(item));
  return shuffleArray(pool).slice(0, n);
}

function getCategorySource(catId) {
  if (catId === "all") {
    return [
      ...DATA.prereq.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.basic.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.advanced.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.abbr.map(x => ({ ...x, _kind: "abbr" })),
      ...DATA.acronym.map(x => ({ ...x, _kind: "acronym" })),
    ];
  }
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat) return [];
  return DATA[cat.source].map(x => ({ ...x, _kind: cat.type }));
}

// items: クイズ対象の語のリスト
// fullPool: 同一の_kindの全語（誤答抽出用）
function buildQuestion(item, fullPool) {
  const kind = item._kind;
  let prompt, answer, distractorPool;

  if (kind === "meaning") {
    prompt = "次の単語の意味として最も適切なものは？";
    answer = item.meaning;
    distractorPool = fullPool
      .filter(x => x._kind === "meaning" && x.meaning !== item.meaning)
      .map(x => x.meaning);
  } else if (kind === "abbr") {
    prompt = "次の略語の元の英単語として最も適切なものは？";
    answer = item.full;
    distractorPool = fullPool
      .filter(x => x._kind === "abbr" && x.full !== item.full)
      .map(x => x.full);
  } else if (kind === "acronym") {
    prompt = "次の頭字語の正式名称として最も適切なものは？";
    answer = item.full;
    distractorPool = fullPool
      .filter(x => x._kind === "acronym" && x.full !== item.full)
      .map(x => x.full);
  }

  const uniquePool = Array.from(new Set(distractorPool));
  const distractors = pickRandom(uniquePool, 3, [answer]);
  while (distractors.length < 3) {
    distractors.push("（候補不足）");
  }
  const choices = shuffleArray([answer, ...distractors]);
  const correctIndex = choices.indexOf(answer);

  return {
    word: item.word,
    prompt,
    choices,
    correctIndex,
    answer,
    kind,
  };
}

// ============================================================
// IndexedDB ラッパー（外部ライブラリ不使用）
// ============================================================
function openDB() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") {
      reject(new Error("IndexedDB is unavailable"));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "key" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGet(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
    req.onerror = () => reject(req.error);
  }));
}

function idbSet(key, value) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).put({ key, value });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function idbDelete(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function idbClear() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

// 旧 localStorage 形式が残っている場合の一度きりの引き継ぎ
async function migrateFromLocalStorage() {
  try {
    const raw = localStorage.getItem(LEGACY_LS_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object") {
      if (parsed.theme) await idbSet("theme", parsed.theme);
      if (Array.isArray(parsed.history)) await idbSet("history", parsed.history);
    }
    localStorage.removeItem(LEGACY_LS_KEY);
  } catch (e) {
    console.warn("Legacy migration skipped:", e);
  }
}

async function loadAllFromIDB() {
  try {
    const theme = await idbGet("theme");
    const history = await idbGet("history");
    const selection = await idbGet("selection");
    dataCache.theme = theme || null;
    dataCache.history = Array.isArray(history) ? history : [];
    dataCache.lastSelection = (selection && typeof selection === "object") ? selection : null;
  } catch (e) {
    console.warn("IndexedDB load failed; running without persistence:", e);
    dataCache.theme = null;
    dataCache.history = [];
    dataCache.lastSelection = null;
  }
}

async function recordHistorySession(session) {
  dataCache.history.unshift(session);
  if (dataCache.history.length > 30) dataCache.history.length = 30;
  try {
    await idbSet("history", dataCache.history);
  } catch (e) {
    console.warn("Failed to persist history:", e);
  }
}

async function clearHistoryData() {
  dataCache.history = [];
  try {
    await idbDelete("history");
  } catch (e) {
    console.warn("Failed to clear history:", e);
  }
}

async function clearAllData() {
  dataCache.theme = null;
  dataCache.history = [];
  try {
    await idbClear();
  } catch (e) {
    console.warn("Failed to clear all data:", e);
  }
}

// DOM ヘルパー
// ============================================================
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "style" && typeof v === "object") {
        for (const s in v) e.style[s] = v[s];
      } else if (k === "dataset") {
        for (const d in v) e.dataset[d] = v[d];
      } else if (v === true) e.setAttribute(k, "");
      else if (v === false || v == null) { /* skip */ }
      else e.setAttribute(k, v);
    }
  }
  appendChildren(e, children);
  return e;
}
function appendChildren(parent, children) {
  if (children == null) return;
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null || c === false) return;
    if (typeof c === "string" || typeof c === "number") {
      parent.appendChild(document.createTextNode(String(c)));
    } else parent.appendChild(c);
  });
}

// 日付の整形 (例: 2026-05-01)
function fmtDate(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// ============================================================
// CSV エクスポート
// ============================================================
function csvEscape(v) {
  const s = String(v == null ? "" : v);
  if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function csvFromRows(rows) {
  // BOM 付きで Excel が UTF-8 を正しく扱えるようにする
  return "﻿" + rows.map(row => row.map(csvEscape).join(",")).join("\r\n");
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: (mime || "text/plain") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtFileStamp(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
}
function kindLabel(kind) {
  if (kind === "abbr") return "略語";
  if (kind === "acronym") return "頭字語";
  return "意味";
}

// 演習1セッションをCSVで保存
function exportSessionCSV() {
  if (!state.answers.length) return;
  const cat = getCategoryById(state.selectedCategory);
  const total = state.answers.length;
  const correct = state.correctCount;
  const rate = Math.round(correct / total * 100);
  const ts = Date.now();
  const rows = [
    ["MustDevEigo セッション結果"],
    ["日時", fmtDateTime(ts)],
    ["分野", cat.label],
    ["問題数", String(total)],
    ["正解数", String(correct)],
    ["正答率", rate + "%"],
    [],
    ["問題番号", "単語", "種別", "正解", "選択した答え", "結果"],
  ];
  state.answers.forEach((a, i) => {
    const q = state.questions[i];
    rows.push([
      i + 1,
      a.word,
      kindLabel(q && q.kind),
      a.answer,
      a.choices[a.picked] || "",
      a.isCorrect ? "○" : "×",
    ]);
  });
  const filename = `MustDevEigo_${cat.id}_${fmtFileStamp(ts)}.csv`;
  downloadFile(filename, csvFromRows(rows), "text/csv");
}

// 全履歴をCSVで保存
function exportHistoryCSV() {
  if (!dataCache.history.length) return;
  const rows = [
    ["MustDevEigo 学習履歴"],
    ["出力日時", fmtDateTime(Date.now())],
    ["セッション数", String(dataCache.history.length)],
    [],
    ["日時", "分野", "問題数", "正解数", "正答率"],
  ];
  // 古い順に並べる
  dataCache.history.slice().sort((a, b) => a.timestamp - b.timestamp).forEach(s => {
    const rate = Math.round(s.correct / s.total * 100);
    rows.push([
      fmtDateTime(s.timestamp),
      s.categoryLabel,
      String(s.total),
      String(s.correct),
      rate + "%",
    ]);
  });
  const filename = `MustDevEigo_history_${fmtFileStamp(Date.now())}.csv`;
  downloadFile(filename, csvFromRows(rows), "text/csv");
}

function getCategoryById(id) {
  return CATEGORIES.find(c => c.id === id) || CATEGORIES.find(c => c.id === "basic");
}

// 直近選択
function getLastSelection() {
  if (dataCache.lastSelection) return dataCache.lastSelection;
  return { catId: "basic", count: "20", shuffle: true };
}
function saveLastSelection(sel) {
  dataCache.lastSelection = sel;
  idbSet("selection", sel).catch(e => console.warn("Failed to persist selection:", e));
}

function showScreen(name) {
  ["screen-home", "screen-wordbook", "screen-quiz", "screen-result"].forEach(id => {
    document.getElementById(id).classList.toggle("hidden", id !== "screen-" + name);
  });
  document.getElementById("nav-home").classList.toggle("active", name === "home" || name === "quiz" || name === "result");

  if (name === "home") renderHome();
  if (name === "wordbook") renderWordbook();
}

    el("option", { value: "20" }, "20問"),

function renderWordbookList() {
  const listEl = document.getElementById("wb-list");
  const sumEl = document.getElementById("wb-summary");
  if (!listEl || !sumEl) return;
  listEl.innerHTML = "";

  const source = getCategorySource(wbState.catId);
  // 表示用の (word, displayMeaning) を作る
  const rows = source.map(item => {
    let display;
    if (item._kind === "abbr") display = item.full + "（の略）";
    else if (item._kind === "acronym") display = item.full;
    else display = item.meaning;
    return { word: item.word, display };
  });

  // 検索フィルタ
  const q = wbState.search.trim().toLowerCase();
  const filtered = q ? rows.filter(r =>
    r.word.toLowerCase().includes(q) || r.display.toLowerCase().includes(q)
  ) : rows;

  // 単語アルファベット順にソート
  filtered.sort((a, b) => a.word.localeCompare(b.word));

  sumEl.innerHTML = "";
  sumEl.appendChild(document.createTextNode("表示中: "));
  sumEl.appendChild(el("strong", null, String(filtered.length)));
  sumEl.appendChild(document.createTextNode(" / 全 "));
  sumEl.appendChild(el("strong", null, String(rows.length)));
  sumEl.appendChild(document.createTextNode(" 語"));

  if (filtered.length === 0) {
    listEl.appendChild(el("div", { class: "wb-empty" }, "該当する単語が見つかりません。"));
    return;
  }

  filtered.forEach(r => {
    listEl.appendChild(el("div", { class: "wb-row" }, [
      el("div", { class: "wb-word" }, r.word),
      el("div", { class: "wb-meaning" }, r.display),
    ]));
  });
}

// ============================================================
// 演習開始
// ============================================================
function startQuiz(override) {
  const sel = override || getLastSelection();
  const source = getCategorySource(sel.catId);
  if (source.length === 0) {
    alert("出題できる語がありません。");
    return;
  }
  const ordered = sel.shuffle ? shuffleArray(source) : source.slice();
  const limit = sel.count === "all" ? ordered.length : Math.min(parseInt(sel.count, 10), ordered.length);
  const items = ordered.slice(0, limit);

  state.questions = items.map(item => buildQuestion(item, source));
  state.currentIdx = 0;
  state.correctCount = 0;
  state.answers = [];
  state.awaitingNext = false;
  state.selectedCategory = sel.catId;
  saveLastSelection({ catId: sel.catId, count: sel.count, shuffle: sel.shuffle });

  showScreen("quiz");
  renderQuestion();
}

// ============================================================
// 出題
// ============================================================
function renderQuestion() {
  const q = state.questions[state.currentIdx];
  const root = document.getElementById("quiz-content");
  root.innerHTML = "";
  state.awaitingNext = false;

  const pct = (state.currentIdx / state.questions.length) * 100;
  const card = el("div", { class: "block" }, [
    el("div", { class: "quiz-progress" }, [
      el("div", { class: "fill", style: { width: pct + "%" } }),
    ]),
    el("div", { class: "quiz-meta" }, [
      el("span", null, `第 ${state.currentIdx + 1} 問 / 全 ${state.questions.length} 問`),
      el("span", { class: "score" }, `正解 ${state.correctCount} / ${state.answers.length}`),
    ]),
    el("div", { class: "headword" }, q.word),
    el("p", { class: "headword-prompt" }, q.prompt),
    (() => {
      const choices = el("div", { class: "choices" });
      q.choices.forEach((c, i) => {
        const btn = el("button", { class: "choice", type: "button", dataset: { idx: String(i) } }, [
          el("span", { class: "choice-num" }, String(i + 1)),
          el("span", { class: "choice-text" }, c),
        ]);
        btn.addEventListener("click", () => handleChoice(i));
        choices.appendChild(btn);
      });
      return choices;
    })(),
    el("div", { class: "feedback", id: "feedback" }),
    el("div", { class: "quiz-actions" }, [
      (() => {
        const b = el("button", { class: "btn", id: "quit-btn", type: "button" }, "中断");
        b.addEventListener("click", () => {
          if (state.answers.length === 0 || confirm("演習を中断してホームに戻りますか？")) {
            showScreen("home");
          }
        });
        return b;
      })(),
      (() => {
        const b = el("button", { class: "btn btn-primary", id: "next-btn", type: "button", disabled: true }, "次の問へ →");
        b.addEventListener("click", goNext);
        return b;
      })(),
    ]),
    el("p", { class: "kb-hint" }, [
      el("span", { class: "kbd" }, "1"),
      "〜",
      el("span", { class: "kbd" }, "4"),
      "で選択 / ",
      el("span", { class: "kbd" }, "Enter"),
      "で次へ",
    ]),
  ]);
  root.appendChild(card);
}

// ============================================================
// 解答処理
// ============================================================
function handleChoice(idx) {
  if (state.awaitingNext) return;
  const q = state.questions[state.currentIdx];
  const isCorrect = idx === q.correctIndex;
  if (isCorrect) state.correctCount++;
  state.answers.push({ word: q.word, picked: idx, correct: q.correctIndex, isCorrect, answer: q.answer, choices: q.choices });
  state.awaitingNext = true;

  document.querySelectorAll("#quiz-content .choice").forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correctIndex) btn.classList.add("correct");
    else if (i === idx) btn.classList.add("incorrect");
  });

  const fb = document.getElementById("feedback");
  if (fb) {
    fb.innerHTML = "";
    fb.classList.add("show", isCorrect ? "correct" : "incorrect");
    fb.appendChild(el("strong", null, isCorrect ? "正解" : "不正解"));
    fb.appendChild(document.createTextNode("  "));
    fb.appendChild(document.createTextNode(q.word + " ＝ " + q.answer));
  }

  const meta = document.querySelector("#quiz-content .quiz-meta .score");
  if (meta) meta.textContent = `正解 ${state.correctCount} / ${state.answers.length}`;

  const nextBtn = document.getElementById("next-btn");
  if (nextBtn) { nextBtn.disabled = false; nextBtn.focus(); }
}

// ============================================================
// 次へ / 終了
// ============================================================
function goNext() {
  if (!state.awaitingNext) return;
  state.currentIdx++;
  if (state.currentIdx >= state.questions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

async function finishQuiz() {
  const total = state.answers.length;
  const correct = state.correctCount;
  const rate = total > 0 ? Math.round(correct / total * 100) : 0;
  const cat = getCategoryById(state.selectedCategory);

  await recordHistorySession({
    timestamp: Date.now(),
    categoryId: state.selectedCategory,
    categoryLabel: cat.label,
    total,
    correct,
  });

  lastFinishedInfo = { total, correct, rate, cat };
  renderResult();
}

function renderResult() {
  const root = document.getElementById("result-content");
  root.innerHTML = "";
  const info = lastFinishedInfo;

  const summary = el("div", { class: "block" }, [
    el("p", { class: "result-headline" }, info.cat.label + " の結果"),
    el("p", { class: "result-rate" }, info.rate + "%"),
    el("p", { class: "result-correct" }, `${info.correct} / ${info.total} 問 正解`),
  ]);
  root.appendChild(summary);

  const reviewCard = el("div", { class: "block" }, [
    el("p", { class: "section-title" }, "振り返り"),
  ]);
  const list = el("div", { class: "review-list" });
  state.answers.forEach(a => {
    list.appendChild(el("div", { class: "review-row" }, [
      el("span", { class: "review-mark " + (a.isCorrect ? "ok" : "ng") }, a.isCorrect ? "○" : "×"),
      el("span", { class: "review-body" }, [
        el("span", { class: "review-headword" }, a.word),
        el("span", { class: "review-meaning" }, "＝ " + a.answer),
        a.isCorrect ? null : el("span", { class: "review-picked" }, a.choices[a.picked] || "—"),
      ]),
    ]));
  });
  reviewCard.appendChild(list);
  root.appendChild(reviewCard);

  const actions = el("div", { class: "result-actions" }, [
    (() => {
      const b = el("button", { class: "btn", type: "button" }, "← ホームに戻る");
      b.addEventListener("click", () => showScreen("home"));
      return b;
    })(),
    (() => {
      const b = el("button", { class: "btn btn-primary", type: "button" }, "もう一度 →");
      b.addEventListener("click", () => startQuiz());
      return b;
    })(),
  ]);
  root.appendChild(actions);

  // 補助リンク
  const subActions = el("div", { class: "sub-actions" }, [
    (() => {
      const b = el("button", { class: "btn-link", type: "button" }, "結果をCSVで保存");
      b.addEventListener("click", exportSessionCSV);
      return b;
    })(),
    (() => {
      const b = el("button", { class: "btn-link", type: "button" }, "単語帳で確認");
      b.addEventListener("click", () => {
        wbState.catId = state.selectedCategory;
        wbState.search = "";
        showScreen("wordbook");
      });
      return b;
    })(),
  ]);
  root.appendChild(subActions);

  showScreen("result");
}

// ============================================================
// テーマ
// ============================================================
// サン / ムーンの SVG アイコン。クリックで切り替わる先を視覚化する:
// - 現在 light → 月アイコン（クリックで dark に切り替え）
// - 現在 dark  → 太陽アイコン（クリックで light に切り替え）
const SUN_ICON_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>';
const MOON_ICON_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

function applyThemeUI(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const icon = document.getElementById("theme-icon");
  if (icon) icon.innerHTML = theme === "dark" ? SUN_ICON_SVG : MOON_ICON_SVG;
  const btn = document.getElementById("theme-toggle");
  if (btn) {
    const next = theme === "dark" ? "ライトモード" : "ダークモード";
    btn.setAttribute("title", next + "に切り替え");
    btn.setAttribute("aria-label", next + "に切り替え");
  }
}

function applyTheme(theme) {
  applyThemeUI(theme);
  dataCache.theme = theme;
  idbSet("theme", theme).catch(e => console.warn("Failed to persist theme:", e));
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(current === "dark" ? "light" : "dark");
}

// ============================================================
// 初期化
// ============================================================
async function init() {
  const sysTheme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  applyThemeUI(sysTheme);

  await migrateFromLocalStorage();
  await loadAllFromIDB();

  applyThemeUI(dataCache.theme || sysTheme);

  showScreen("home");

  document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  document.getElementById("nav-home").addEventListener("click", () => showScreen("home"));
  document.getElementById("nav-wordbook").addEventListener("click", () => showScreen("wordbook"));

  document.addEventListener("keydown", (e) => {
    const quizVisible = !document.getElementById("screen-quiz").classList.contains("hidden");
    if (!quizVisible) return;
    if (e.key >= "1" && e.key <= "4") {
      const idx = parseInt(e.key, 10) - 1;
      if (state.awaitingNext) return;
      const btns = document.querySelectorAll("#quiz-content .choice");
      if (btns[idx]) btns[idx].click();
    } else if (e.key === "Enter" && state.awaitingNext) {
      e.preventDefault();
      goNext();
    }
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
