<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MustDevEigo — エンジニア必須英単語</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23EB6D55%22%2F%3E%3Cpath%20d%3D%22M7%2023.5V8.5h3.4l4.6%208.6%204.6-8.6h3.4v15h-2.9V13.4l-3.6%206.7h-2.9l-3.6-6.7v10.1z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
 * Design System v1.5.0 – Tokens
 * 3層: L1 Primitive → L2 Semantic → L3 Component
 * 暖色寄り・丸み優先・余白優先・静かさ優先
 * ============================================================ */
:root {
  /* === L1: Primitive Colors === */
  /* Teal（主軸・見出し・主操作） Base #2D8FB5 */
  --color-teal-50:  #EAF5FA;
  --color-teal-100: #D2EAF3;
  --color-teal-200: #A5D5E7;
  --color-teal-300: #78BFDB;
  --color-teal-400: #4BA9CF;
  --color-teal-500: #2D8FB5;
  --color-teal-600: #247495;
  --color-teal-700: #1B5A75;
  --color-teal-800: #134155;
  --color-teal-900: #0B2A38;

  /* Peach（CTA・アクセント） Base #F87B57 */
  --color-peach-50:  #FEF1ED;
  --color-peach-100: #FDDFD3;
  --color-peach-200: #FBBFA8;
  --color-peach-300: #FA9F7C;
  --color-peach-400: #F98F69;
  --color-peach-500: #F87B57;
  --color-peach-600: #E16645;
  --color-peach-700: #BA5238;
  --color-peach-800: #8C3E2A;
  --color-peach-900: #5E2A1C;

  /* Sunshine（装飾・ハイライト） Base #FFCB47 */
  --color-sunshine-50:  #FFF7E0;
  --color-sunshine-100: #FFEDB8;
  --color-sunshine-300: #FFDA7C;
  --color-sunshine-500: #FFCB47;
  --color-sunshine-700: #C99A2C;

  /* Warm Gray（背景・テキスト・罫線） */
  --color-warm-0:   #FFFFFF;
  --color-warm-50:  #FBF9F7;
  --color-warm-100: #F4F1ED;
  --color-warm-200: #E8E3DC;
  --color-warm-300: #D5CEC4;
  --color-warm-400: #B6ADA1;
  --color-warm-500: #8E847A;
  --color-warm-600: #6B6560;
  --color-warm-700: #4D4944;
  --color-warm-800: #2E2C29;
  --color-warm-900: #1F1C1A; /* 純黒の代わり */

  /* Status */
  --color-success-50:  #E6F4EA;
  --color-success-500: #5DBB7E;
  --color-success-700: #3E8C5C;
  --color-success-900: #1F4F33;
  --color-warning-50:  #FDF1DC;
  --color-warning-500: #F0A933;
  --color-warning-700: #B17A1F;
  --color-warning-900: #5F3F0F;
  --color-error-50:  #FBE6E6;
  --color-error-500: #E36363;
  --color-error-700: #B14040;
  --color-error-900: #5F1F1F;

  /* === L2: Semantic === */
  --bg-canvas:        var(--color-warm-0);
  --bg-muted:         var(--color-warm-50);
  --bg-emphasized:    var(--color-warm-100);
  --bg-inverse:       var(--color-warm-900);

  --text-primary:     var(--color-warm-800);
  --text-secondary:   var(--color-warm-600);
  --text-tertiary:    var(--color-warm-400);
  --text-disabled:    var(--color-warm-300);
  --text-inverse:     var(--color-warm-0);
  --text-brand:       var(--color-teal-700);

  --border-default:   var(--color-warm-200);
  --border-emphasized: var(--color-warm-300);

  --action-primary:        var(--color-teal-500);
  --action-primary-hover:  var(--color-teal-600);
  --action-cta:            var(--color-peach-500);
  --action-cta-hover:      var(--color-peach-600);
  --accent-decor:          var(--color-sunshine-500);

  --focus-ring:       0 0 0 3px rgba(45, 143, 181, 0.32);

  /* === L3: Component === */
  --btn-cta-bg:           var(--action-cta);
  --btn-cta-bg-hover:     var(--action-cta-hover);
  --btn-cta-text:         var(--text-inverse);

  --btn-primary-bg:       var(--action-primary);
  --btn-primary-bg-hover: var(--action-primary-hover);
  --btn-primary-text:     var(--text-inverse);

  --btn-outline-bg:       transparent;
  --btn-outline-text:     var(--action-primary);
  --btn-outline-border:   var(--action-primary);

  --card-bg:              var(--bg-canvas);
  --card-border:          var(--border-default);

  --modal-bg:             var(--bg-canvas);

  --input-bg:             var(--bg-canvas);
  --input-border:         var(--border-default);
  --input-border-focus:   var(--action-primary);

  /* === Radius === */
  --radius-xs:   4px;
  --radius-sm:   6px;
  --radius-md:  12px;  /* form input */
  --radius-lg:  20px;  /* small card */
  --radius-xl:  28px;  /* standard card ★ */
  --radius-2xl: 40px;
  --radius-pill: 9999px; /* button mandatory ★ */

  /* === Shadow === */
  --shadow-xs:  0 1px 2px rgba(31, 28, 26, 0.04);
  --shadow-sm:  0 2px 6px rgba(31, 28, 26, 0.06);
  --shadow-md:  0 6px 16px rgba(31, 28, 26, 0.08);
  --shadow-lg:  0 12px 28px rgba(31, 28, 26, 0.10);
  --shadow-xl:  0 20px 40px rgba(31, 28, 26, 0.14);
  --shadow-2xl: 0 28px 56px rgba(31, 28, 26, 0.18);
  --shadow-glow: 0 8px 24px rgba(248, 123, 87, 0.30);
  --shadow-inset: inset 0 2px 4px rgba(31, 28, 26, 0.06);

  /* === Motion === */
  --dur-fast:  180ms;
  --dur-base:  280ms;
  --dur-slow:  480ms;
  --dur-slower: 640ms;
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* === Spacing (4px grid) === */
  --space-1:  4px;
  --space-2:  8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;
  --space-24: 96px;
  --space-32: 128px;

  /* === Typography === */
  --font-display: "Zen Maru Gothic", "Noto Sans JP", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --font-body:    "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --font-en:      "DM Sans", Arial, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* === 旧 --az-color-* との互換エイリアス（既存規則を壊さないため） === */
  --az-color-white:           var(--color-warm-0);
  --az-color-black:           var(--color-warm-900);
  --az-color-off-white:       var(--bg-canvas);
  --az-color-cream:           var(--color-sunshine-50);
  --az-color-warm-gray-50:    var(--color-warm-50);
  --az-color-warm-gray-100:   var(--color-warm-100);
  --az-color-warm-gray-200:   var(--color-warm-200);
  --az-color-warm-gray-300:   var(--color-warm-300);
  --az-color-warm-gray-400:   var(--color-warm-400);
  --az-color-gray-500:        var(--color-warm-500);
  --az-color-charcoal-700:    var(--color-warm-700);
  --az-color-charcoal-900:    var(--color-warm-800);
  --az-color-coral-500:       #EB6D55; /* 不正解専用なのでリテラル */
  --az-color-coral-600:       #D95C47;
  --az-color-lime-500:        #AACE38; /* 正解専用なのでリテラル */
  --az-color-lime-600:        #8FB82E;
  --az-color-bg-page:         var(--bg-canvas);
  --az-color-bg-surface:      var(--card-bg);
  --az-color-bg-soft:         var(--bg-muted);
  --az-color-bg-azraku:       var(--color-sunshine-50);
  --az-color-border-default:  var(--border-default);
  --az-color-border-strong:   var(--border-emphasized);
  --az-color-text-primary:    var(--text-primary);
  --az-color-text-body:       var(--text-secondary);
  --az-color-text-subtle:     var(--text-tertiary);
  --az-color-text-inverse:    var(--text-inverse);
  /* 「アクション=peach(CTA)」の見た目になるよう旧トークンを peach に振り分け（互換目的） */
  --az-color-action-primary:       var(--action-cta);
  --az-color-action-primary-hover: var(--action-cta-hover);
  --az-color-action-secondary:     var(--action-primary); /* 旧secondaryをteal主操作へ */
  --az-color-action-secondary-hover: var(--action-primary-hover);
  --az-color-focus-ring:           rgba(45, 143, 181, 0.32);
  --az-font-family-sans: var(--font-body);
  --az-font-family-en:   var(--font-en);
  --az-radius-sm: var(--radius-sm);
  --az-radius-md: var(--radius-md);
  --az-radius-lg: var(--radius-lg);
  --az-radius-xl: var(--radius-xl);
  --az-radius-full: var(--radius-pill);
}

/* === Dark theme === */
:root[data-theme="dark"] {
  --bg-canvas:      #1F1C1A;
  --bg-muted:       #2A2624;
  --bg-emphasized:  #34302D;
  --bg-inverse:     var(--color-warm-50);

  --text-primary:   #F1ECE5;
  --text-secondary: #C9C0B5;
  --text-tertiary:  #8E847A;
  --text-disabled:  #5A524C;
  --text-inverse:   #1F1C1A;
  --text-brand:    var(--color-teal-300);

  --border-default:    #3A3431;
  --border-emphasized: #524A45;

  --action-primary:        var(--color-teal-400);
  --action-primary-hover:  var(--color-teal-300);
  --action-cta:            var(--color-peach-400);
  --action-cta-hover:      var(--color-peach-300);

  --focus-ring: 0 0 0 3px rgba(120, 191, 219, 0.40);

  --shadow-xs:  0 1px 2px rgba(0, 0, 0, 0.30);
  --shadow-sm:  0 2px 6px rgba(0, 0, 0, 0.35);
  --shadow-md:  0 6px 16px rgba(0, 0, 0, 0.40);
  --shadow-lg:  0 12px 28px rgba(0, 0, 0, 0.45);
  --shadow-xl:  0 20px 40px rgba(0, 0, 0, 0.50);
  --shadow-glow: 0 8px 24px rgba(248, 123, 87, 0.40);

  /* テキスト inverse は CTA(peach)上で白を維持したいので明示固定 */
  --btn-cta-text:     #FFFFFF;
  --btn-primary-text: #FFFFFF;
}

/* Reduced motion 対応 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0ms !important;
    scroll-behavior: auto !important;
  }
}

/* === ダークモード用のコンポーネント補正 ===
   light primitive (warm-gray-50/100) を直接使っている場所を、暗背景で潰れないように上書きする */
:root[data-theme="dark"] .quiz-progress {
  background: #3D3D33;
}
:root[data-theme="dark"] .choice-num {
  background: #3D3D33;
  color: var(--az-color-text-body);
}
:root[data-theme="dark"] .cat-row.selected {
  background: rgba(255, 255, 255, 0.06);
}
:root[data-theme="dark"] .feedback {
  background: var(--bg-muted);
  border-color: var(--border-default);
}
/* 正解/不正解の弁別性は意図的にリテラル固定（暗モード） */
:root[data-theme="dark"] .feedback.correct {
  background: rgba(170, 206, 56, 0.18);
  border-color: #AACE38;
}
:root[data-theme="dark"] .feedback.correct strong { color: #C8E060; }
:root[data-theme="dark"] .feedback.incorrect {
  background: rgba(235, 109, 85, 0.18);
  border-color: #EB6D55;
}
:root[data-theme="dark"] .feedback.incorrect strong { color: #F58A75; }
:root[data-theme="dark"] .choice.correct {
  background: rgba(170, 206, 56, 0.16);
  border-color: #AACE38;
}
:root[data-theme="dark"] .choice.incorrect {
  background: rgba(235, 109, 85, 0.16);
  border-color: #EB6D55;
}
:root[data-theme="dark"] .review-mark { color: #C8E060; }
:root[data-theme="dark"] .review-mark.ng { color: #F58A75; }

/* CTA は明色の peach/sunshine 階調を使うため、暗背景では地色を半透明オーバーレイに置き換える */
:root[data-theme="dark"] .cta {
  background: linear-gradient(135deg, rgba(248, 123, 87, 0.22), rgba(255, 203, 71, 0.10));
  border-color: rgba(248, 123, 87, 0.45);
}
:root[data-theme="dark"] .cta .cta-eyebrow { color: #FFC4A6; }
:root[data-theme="dark"] .cta .cta-summary { color: #F8EFE6; }
:root[data-theme="dark"] .cta .cta-summary .sep { color: #C9C0B5; }
:root[data-theme="dark"] .review-cta {
  background: rgba(235, 109, 85, 0.14);
  border-color: rgba(235, 109, 85, 0.55);
}
:root[data-theme="dark"] .review-cta .cta-eyebrow { color: #F58A75; }

:root[data-theme="dark"] .wb-toolbar input[type="search"]::placeholder {
  color: #6E665A;
}
:root[data-theme="dark"] .kbd {
  background: var(--az-color-bg-soft);
  color: var(--az-color-text-body);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--az-font-family-sans);
  font-size: 14px;
  line-height: 1.55;
  background: var(--az-color-bg-page);
  color: var(--az-color-text-body);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 16px 16px;
}

/* ヘッダー */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 10px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--az-color-border-default);
}
.brand {
  font-family: var(--font-display);
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-brand);
  line-height: 1.3;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.brand em {
  font-family: var(--font-body);
  font-style: normal;
  color: var(--text-tertiary);
  font-weight: 400;
  font-size: 11px;
  margin-left: 6px;
}
.app-actions { display: inline-flex; gap: 4px; align-items: center; }
.link-btn {
  display: inline-flex;
  align-items: center;
  height: 32px;
  background: transparent;
  border: 0;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 12px;
  padding: 0 12px;
  cursor: pointer;
  font-weight: 500;
  white-space: nowrap;
  border-radius: var(--radius-pill);
  line-height: 1;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.link-btn:hover { color: var(--text-brand); background: var(--bg-muted); }
.link-btn.active { color: var(--az-color-text-primary); font-weight: 700; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: var(--radius-pill);
  color: var(--text-secondary);
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
  flex-shrink: 0;
}
.icon-btn:hover { color: var(--az-color-action-primary); background: var(--az-color-bg-soft); }
.icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--az-color-focus-ring); }
.theme-icon { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
.theme-icon svg { display: block; }

/* ユーザー名ボタン（ヘッダー内） */
.user-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 10px;
  background: transparent;
  border: 1px solid var(--az-color-border-default);
  border-radius: 14px;
  color: var(--az-color-text-body);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.user-btn:hover { background: var(--az-color-bg-soft); border-color: var(--az-color-border-strong); color: var(--az-color-text-primary); }
.user-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--az-color-focus-ring); }

/* モーダル */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 20, 20, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
:root[data-theme="dark"] .modal-backdrop { background: rgba(0, 0, 0, 0.6); }
.modal {
  background: var(--modal-bg);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  padding: var(--space-6) var(--space-6);
  width: 100%;
  max-width: 440px;
  box-shadow: var(--shadow-xl);
}
.modal-title {
  font-family: var(--font-display);
  margin: 0 0 var(--space-2);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.3;
}
.modal-desc {
  margin: 0 0 var(--space-4);
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.7;
}
.modal-input {
  width: 100%;
  height: 48px;
  padding: 0 var(--space-4);
  border: 1px solid var(--input-border);
  border-radius: var(--radius-md);
  background: var(--input-bg);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 16px;
  margin-bottom: var(--space-5);
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.modal-input:focus {
  outline: none;
  border-color: var(--input-border-focus);
  box-shadow: var(--focus-ring);
}
.modal-input::placeholder { color: var(--text-tertiary); }
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.modal-actions .btn { min-height: 44px; padding: 0 22px; }
.modal-actions .btn[hidden] { display: none; }
/* 解説モーダル: 幅広版 */
.modal-wide { max-width: 640px; }
#explain-modal-body { max-height: 60vh; overflow-y: auto; margin-bottom: var(--space-4); }
#explain-modal-meaning { font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-3); }

/* explain-pane の compact 版 (Wordbook 内に収める時) */
.explain-pane.compact { padding: var(--space-3); margin-top: var(--space-2); }

/* Wordbook の details/summary 展開 */
.wb-row {
  background: var(--bg-canvas);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  margin-bottom: 6px;
  overflow: hidden;
}
.wb-row[open] { border-color: var(--border-emphasized); }
.wb-row > summary {
  list-style: none;
  cursor: pointer;
  padding: 10px 14px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: var(--space-3);
  align-items: center;
}
.wb-row > summary::-webkit-details-marker { display: none; }
.wb-row > summary:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-md); }
.wb-row > summary:hover { background: var(--bg-muted); }
.wb-explain-mark {
  font-size: 11px;
  font-weight: 700;
  color: var(--color-teal-700);
  background: var(--color-teal-50);
  border: 1px solid var(--color-teal-200);
  border-radius: var(--radius-pill);
  padding: 2px 8px;
  letter-spacing: 0.04em;
}
:root[data-theme="dark"] .wb-explain-mark {
  color: var(--color-teal-200);
  background: rgba(120, 191, 219, 0.18);
  border-color: var(--color-teal-400);
}
.wb-row-detail {
  padding: 0 14px 14px;
  border-top: 1px solid var(--border-default);
}
.wb-row-detail-empty {
  padding: 12px 14px;
  font-size: 12px;
  color: var(--text-tertiary);
  font-style: italic;
}

/* 類語識別モード（confusable quiz） */
.headword-confusable {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: var(--space-3) 0;
}
.confusable-badge {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  color: var(--color-peach-700);
  background: var(--color-peach-50);
  border: 1px solid var(--color-peach-200);
  border-radius: var(--radius-pill);
  padding: 4px 14px;
  letter-spacing: 0.06em;
}
:root[data-theme="dark"] .confusable-badge {
  color: var(--color-peach-200);
  background: rgba(248, 123, 87, 0.18);
  border-color: var(--color-peach-400);
}
.confusable-context {
  margin: var(--space-2) 0 var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--bg-muted);
  border-left: 3px solid var(--color-peach-300);
  border-radius: var(--radius-md);
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-primary);
}

/* 結果画面 解説リンク */
.review-explain-btn {
  background: transparent;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-pill);
  font-size: 11px;
  color: var(--text-secondary);
  padding: 2px 10px;
  margin-left: 8px;
  cursor: pointer;
  font-family: var(--font-body);
}
.review-explain-btn:hover { background: var(--bg-emphasized); color: var(--text-primary); }
.review-explain-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* 発音ボタン（TTS） */
.speak-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  padding: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--az-radius-full);
  color: var(--az-color-text-subtle);
  cursor: pointer;
  vertical-align: middle;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
}
.speak-btn:hover { color: var(--az-color-action-primary); background: var(--az-color-bg-soft); }
.speak-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--az-color-focus-ring); }
.speak-btn svg { display: block; }
.speak-btn-lg { width: 32px; height: 32px; }
.speak-btn-lg svg { width: 18px; height: 18px; }
.headword-row { display: inline-flex; align-items: center; gap: 10px; }

/* ブロック（標準カード: radius 28px / shadow-sm） */
.block {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-xl);
  padding: var(--space-5) var(--space-6);
  box-shadow: var(--shadow-sm);
  margin-bottom: var(--space-3);
}

.section-title {
  font-family: var(--font-display);
  margin: 0 0 var(--space-2);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 0.04em;
}
.muted { color: var(--text-tertiary); font-size: 12px; margin: 0; }

/* CTA（peach の温かさ・glow で目立たせる） */
.cta {
  background: linear-gradient(135deg, var(--color-peach-50), var(--color-sunshine-50));
  border: 1px solid var(--color-peach-200);
  border-radius: var(--radius-xl);
  padding: var(--space-5) var(--space-6);
  box-shadow: var(--shadow-md);
  margin-bottom: var(--space-3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
}
.cta-info { flex: 1 1 auto; min-width: 0; }
.cta-eyebrow {
  font-size: 11px;
  color: var(--az-color-text-subtle);
  margin: 0;
  letter-spacing: 0.04em;
  font-weight: 500;
}
.cta-summary {
  margin: 1px 0 0;
  font-size: 16px;
  font-weight: 700;
  color: var(--az-color-text-primary);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cta-summary .sep { color: var(--az-color-text-subtle); font-weight: 400; margin: 0 6px; }
.cta-summary .tk-mistake { color: var(--az-color-action-primary); }

/* 苦手復習 CTA: コーラルのアウトラインで注意喚起 */
.review-cta {
  background: rgba(235, 109, 85, 0.06);
  border: 1px solid var(--az-color-action-primary);
  border-radius: var(--az-radius-md);
  padding: 12px 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.review-cta .cta-info { flex: 1 1 auto; min-width: 0; }
.review-cta .cta-eyebrow { color: var(--az-color-action-primary); }

/* 結果画面の補足メッセージ */
.result-note {
  text-align: center;
  font-size: 12px;
  color: var(--az-color-text-subtle);
  margin: 6px 0 0;
}

/* ボタン（pill 必須・min 44px タッチターゲット） */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 22px;
  border: 1px solid var(--btn-outline-border);
  border-radius: var(--radius-pill);
  background: var(--btn-outline-bg);
  color: var(--btn-outline-text);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  white-space: nowrap;
}
.btn:hover { background: var(--bg-muted); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:disabled:hover { background: var(--btn-outline-bg); }
.btn-primary {
  background: var(--btn-cta-bg);
  color: var(--btn-cta-text);
  border-color: var(--btn-cta-bg);
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover {
  background: var(--btn-cta-bg-hover);
  border-color: var(--btn-cta-bg-hover);
  color: var(--btn-cta-text);
  box-shadow: var(--shadow-glow);
}
.btn-large { min-height: 48px; padding: 0 28px; font-size: 15px; }
.btn-link {
  background: transparent;
  border: 0;
  color: var(--text-brand);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 10px;
  cursor: pointer;
  font-family: inherit;
  border-radius: var(--radius-pill);
  min-height: auto;
}
.btn-link:hover { color: var(--action-primary-hover); background: var(--color-teal-50); }
.btn-link:disabled { color: var(--text-disabled); cursor: not-allowed; opacity: 0.6; }
.btn-link:disabled:hover { background: transparent; }

/* カテゴリーリスト */
.cat-list { margin: 0; }
.cat-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out);
}
.cat-row:hover { background: var(--az-color-bg-soft); }
.cat-row.selected { background: var(--az-color-warm-gray-100); }
.cat-mark {
  width: 14px;
  text-align: center;
  color: var(--az-color-action-primary);
  font-weight: 700;
  font-size: 11px;
  flex-shrink: 0;
}
.cat-row.selected .cat-mark::before { content: "●"; }
.cat-name {
  flex: 1;
  min-width: 0;
  font-weight: 700;
  font-size: 14px;
  color: var(--az-color-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cat-name .desc {
  color: var(--az-color-text-subtle);
  font-size: 11px;
  font-weight: 400;
  margin-left: 6px;
}
.cat-count {
  color: var(--az-color-text-subtle);
  font-family: var(--az-font-family-en);
  font-size: 12px;
  font-variant-numeric: tabular-nums lining-nums;
  white-space: nowrap;
  flex-shrink: 0;
}

/* オプション行 */
.options-row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--az-color-border-default);
  font-size: 13px;
}
.options-row label { color: var(--az-color-text-body); display: inline-flex; align-items: center; gap: 6px; }
/* セレクトボックス共通: ネイティブの矢印を消して自前のシェブロンを置く */
.options-row select,
.wb-toolbar select {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-color: var(--input-bg);
  color: var(--text-primary);
  border: 1px solid var(--input-border);
  border-radius: var(--radius-md);
  padding: 6px 36px 6px 14px; /* 右側に矢印用の余白 */
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%236B6560' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><polyline points='2,2 6,6 10,2'/></svg>");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 12px 8px;
}
:root[data-theme="dark"] .options-row select,
:root[data-theme="dark"] .wb-toolbar select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%23C9C0B5' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><polyline points='2,2 6,6 10,2'/></svg>");
}
.options-row select:focus,
.wb-toolbar select:focus {
  outline: none;
  border-color: var(--input-border-focus);
  box-shadow: var(--focus-ring);
}
.options-row input[type="checkbox"] { accent-color: var(--az-color-action-primary); width: 14px; height: 14px; }

/* 履歴 */
.history-list { margin: 0; }
.history-row {
  display: flex;
  gap: 10px;
  padding: 4px 0;
  border-top: 1px solid var(--az-color-border-default);
  align-items: baseline;
  font-size: 13px;
}
.history-row:first-child { border-top: 0; padding-top: 0; }
.history-date {
  width: 86px;
  flex-shrink: 0;
  color: var(--az-color-text-subtle);
  font-family: var(--az-font-family-en);
  font-variant-numeric: tabular-nums lining-nums;
  font-size: 12px;
}
.history-cat {
  flex: 1;
  min-width: 0;
  color: var(--az-color-text-primary);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.history-stat {
  color: var(--az-color-action-primary);
  font-weight: 700;
  font-family: var(--az-font-family-en);
  font-variant-numeric: tabular-nums lining-nums;
  white-space: nowrap;
  flex-shrink: 0;
  font-size: 12px;
}
.history-empty { color: var(--az-color-text-subtle); font-size: 13px; padding: 2px 0; }

.data-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }


/* 出題画面 */
.quiz-progress {
  height: 3px;
  background: var(--az-color-warm-gray-100);
  border-radius: var(--az-radius-full);
  overflow: hidden;
  margin-bottom: 8px;
}
.quiz-progress > .fill {
  height: 100%;
  background: var(--az-color-action-primary);
  border-radius: var(--az-radius-full);
  transition: width 0.3s;
}
.quiz-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  color: var(--az-color-text-subtle);
  margin-bottom: 8px;
  font-family: var(--az-font-family-en);
  font-variant-numeric: tabular-nums lining-nums;
}
.quiz-meta .score { color: var(--az-color-text-body); font-weight: 500; }
.headword {
  font-family: var(--font-en);
  text-align: center;
  font-size: 36px;
  font-weight: 700;
  margin: var(--space-3) 0 var(--space-1);
  letter-spacing: -0.01em;
  word-break: break-word;
  line-height: 1.15;
  color: var(--text-primary);
}
.headword-prompt {
  text-align: center;
  color: var(--text-tertiary);
  font-size: 13px;
  margin: 0 0 var(--space-3);
}

.choices { display: flex; flex-direction: column; gap: 6px; }
.choice {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--az-color-bg-surface);
  border: 1px solid var(--az-color-border-default);
  border-radius: var(--az-radius-sm);
  padding: 8px 12px;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  color: var(--az-color-text-primary);
  text-align: left;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  width: 100%;
}
.choice:hover:not(:disabled) {
  background: var(--az-color-bg-soft);
  border-color: var(--az-color-action-primary);
}
.choice:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--az-color-focus-ring); }
.choice:disabled { cursor: not-allowed; }
.choice-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: var(--az-radius-full);
  background: var(--az-color-warm-gray-100);
  color: var(--az-color-text-subtle);
  font-family: var(--az-font-family-en);
  font-weight: 700;
  font-size: 11px;
  flex-shrink: 0;
}
.choice-text { flex: 1; min-width: 0; line-height: 1.4; }
/* === 正解/不正解の弁別性は意図的にリテラル固定（デザインシステムから独立） === */
.choice.correct {
  background: rgba(170, 206, 56, 0.18);
  border-color: #AACE38;
  border-width: 2px;
  padding: 7px 11px;
}
.choice.correct .choice-num {
  background: #AACE38;
  color: #FFFFFF;
}
.choice.incorrect {
  background: rgba(235, 109, 85, 0.14);
  border-color: #EB6D55;
  border-width: 2px;
  padding: 7px 11px;
  color: var(--text-primary);
}
.choice.incorrect .choice-num {
  background: #EB6D55;
  color: #FFFFFF;
}

.feedback {
  display: none;
  margin-top: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  font-size: 13px;
  background: var(--bg-muted);
  border: 1px solid var(--az-color-border-default);
}
.feedback.show { display: block; }
.feedback.correct {
  background: rgba(170, 206, 56, 0.16);
  border-color: #AACE38;
  color: var(--text-primary);
}
.feedback.correct strong { color: #8FB82E; }
.feedback.incorrect {
  background: rgba(235, 109, 85, 0.12);
  border-color: #EB6D55;
  color: var(--text-primary);
}
.feedback.incorrect strong { color: #D95C47; }
.feedback strong { font-weight: 700; margin-right: 6px; }

/* ============================================================
 * Explain pane (v2 解説ペイン)
 * 解答後に「使用シーン / コード例 / 混同しやすい類語」を表示。
 * 既存テーマトークンのみ使用、新色は追加しない。
 * ============================================================ */
.explain-pane {
  margin-top: var(--space-3);
  padding: var(--space-4) var(--space-4);
  background: var(--bg-muted);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
}
.explain-section-title {
  font-family: var(--font-display);
  margin: 0 0 var(--space-2);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.explain-section-title svg {
  width: 14px;
  height: 14px;
  color: var(--color-sunshine-700);
}
.explain-usecase {
  margin: 0;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-primary);
}

/* コード例 */
.code-block-wrap { margin: var(--space-4) 0 var(--space-2); }
.code-block-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: 6px;
}
.code-lang-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  padding: 2px 10px;
  background: var(--bg-emphasized);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-pill);
}
.code-copy-btn {
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--text-secondary);
  background: transparent;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-pill);
  padding: 3px 12px;
  cursor: pointer;
  min-height: 28px;
}
.code-copy-btn:hover {
  background: var(--bg-emphasized);
  color: var(--text-primary);
}
.code-copy-btn:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.code-copy-btn.copied { color: var(--color-teal-600); border-color: var(--color-teal-300); }
.code-block {
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.65;
  background: var(--bg-canvas);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  margin: 0;
  overflow-x: auto;
  color: var(--text-primary);
  white-space: pre;
}
.code-block code { font-family: inherit; background: transparent; padding: 0; }
.code-caption {
  margin: 6px 0 0;
  font-size: 12px;
  color: var(--text-secondary);
  font-style: italic;
}
/* シンタックスハイライト・トークン色 */
.tok-kw  { color: var(--color-teal-700); font-weight: 600; }
.tok-str { color: var(--color-peach-600); }
.tok-cmt { color: var(--color-warm-500); font-style: italic; }
.tok-num { color: var(--color-sunshine-700); }
.tok-ty  { color: var(--color-teal-600); }
.tok-bi  { color: var(--color-peach-700); }
:root[data-theme="dark"] .tok-kw  { color: var(--color-teal-300); }
:root[data-theme="dark"] .tok-str { color: var(--color-peach-300); }
:root[data-theme="dark"] .tok-cmt { color: var(--color-warm-400); }
:root[data-theme="dark"] .tok-num { color: var(--color-sunshine-300); }
:root[data-theme="dark"] .tok-ty  { color: var(--color-teal-200); }
:root[data-theme="dark"] .tok-bi  { color: var(--color-peach-200); }

/* 類語カード */
.confusable-list { display: flex; flex-direction: column; gap: var(--space-2); }
.confusable-card {
  background: var(--bg-canvas);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  cursor: pointer;
  transition: border-color 150ms ease, background 150ms ease;
}
.confusable-card:hover {
  border-color: var(--border-emphasized);
  background: var(--bg-muted);
}
.confusable-card:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.confusable-card-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--space-2);
  margin-bottom: 4px;
}
.confusable-word {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 14px;
  color: var(--text-brand);
}
.confusable-diff {
  margin: 0;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-secondary);
}
.confusable-actions { margin-top: 8px; }
.confusable-link {
  background: transparent;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-pill);
  padding: 3px 12px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  min-height: 28px;
  font-family: var(--font-body);
}
.confusable-link:hover { background: var(--bg-emphasized); color: var(--text-primary); }
.confusable-link:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* トースト（非モーダル通知） */
.toast-host {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--bg-inverse);
  color: var(--text-inverse);
  padding: 10px 18px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  box-shadow: var(--shadow-lg);
  pointer-events: auto;
  max-width: min(86vw, 480px);
  text-align: center;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 200ms ease, transform 200ms ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

.quiz-actions {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
}
.kb-hint {
  text-align: center;
  font-size: 11px;
  color: var(--az-color-text-subtle);
  margin-top: 6px;
}
.kbd {
  display: inline-block;
  padding: 1px 7px;
  border: 1px solid var(--border-emphasized);
  border-radius: var(--radius-xs);
  font-family: var(--font-mono), var(--font-en);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-muted);

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n, exclude) {
  const pool = arr.filter(item => !exclude.includes(item));
  return shuffleArray(pool).slice(0, n);
}

function getCategorySource(catId) {
  if (catId === "all") {
    return [
      ...DATA.prereq.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.basic.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.advanced.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.abbr.map(x => ({ ...x, _kind: "abbr" })),
      ...DATA.acronym.map(x => ({ ...x, _kind: "acronym" })),
    ];
  }
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat) return [];
  return DATA[cat.source].map(x => ({ ...x, _kind: cat.type }));
}

// items: クイズ対象の語のリスト
// fullPool: 同一の_kindの全語（誤答抽出用）
function buildQuestion(item, fullPool) {
  const kind = item._kind;
  let prompt, answer, distractorPool;

  if (kind === "meaning") {
    prompt = "次の単語の意味として最も適切なものは？";
    answer = item.meaning;
    distractorPool = fullPool
      .filter(x => x._kind === "meaning" && x.meaning !== item.meaning)
      .map(x => x.meaning);
  } else if (kind === "abbr") {
    prompt = "次の略語の元の英単語として最も適切なものは？";
    answer = item.full;
    distractorPool = fullPool
      .filter(x => x._kind === "abbr" && x.full !== item.full)
      .map(x => x.full);
  } else if (kind === "acronym") {
    prompt = "次の頭字語の正式名称として最も適切なものは？";
    answer = item.full;
    distractorPool = fullPool
      .filter(x => x._kind === "acronym" && x.full !== item.full)
      .map(x => x.full);
  }

  const uniquePool = Array.from(new Set(distractorPool));
  const distractors = pickRandom(uniquePool, 3, [answer]);
  while (distractors.length < 3) {
    distractors.push("（候補不足）");
  }
  const choices = shuffleArray([answer, ...distractors]);
  const correctIndex = choices.indexOf(answer);

  return {
    word: item.word,
    prompt,
    choices,
    correctIndex,
    answer,
    kind,
    _source: item, // v2: 解説ペイン (Explain) で元データを参照する
  };
}

// 言語別の語彙集（Set で照合）。SQL は大文字小文字を無視するため別経路で扱う。
const SYNTAX_LEXERS = (() => {
  const js = {
    master: /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|(\b[a-zA-Z_$][\w$]*\b)/g,
    kw: new Set("function const let var return if else for while do switch case default break continue class extends new this super import export from as async await try catch throw finally typeof instanceof in of true false null undefined yield static void".split(" ")),
    ty: new Set("Array Object String Number Boolean Promise Map Set Date JSON Math RegExp Error".split(" ")),
    bi: new Set("console document window globalThis".split(" ")),
  };
  return {
    js,
    ts: js,
    py: {
      master: /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|(\b[a-zA-Z_]\w*\b)/g,
      kw: new Set("def class return if elif else for while in not and or is None True False import from as with try except finally raise pass break continue lambda yield global nonlocal".split(" ")),
      ty: new Set("int float str list dict set tuple bool bytes".split(" ")),
      bi: new Set("print len range type isinstance".split(" ")),
    },
    java: {
      master: /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*")|(\b\d+(?:\.\d+)?[fLdD]?\b)|(\b[a-zA-Z_$][\w$]*\b)/g,
      kw: new Set("public private protected static final void abstract class interface extends implements new this super return if else for while do switch case default break continue try catch throw throws finally synchronized package import enum true false null instanceof".split(" ")),
      ty: new Set("int long short byte float double boolean char String Object Integer Long Float Double Boolean".split(" ")),
      bi: new Set("System out println".split(" ")),
    },
    go: {
      master: /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`[^`]*`|"(?:\\.|[^"\\\n])*")|(\b\d+(?:\.\d+)?\b)|(\b[a-zA-Z_]\w*\b)/g,
      kw: new Set("func var const type struct interface package import return if else for switch case default break continue go defer chan map range select fallthrough true false nil".split(" ")),
      ty: new Set("int int32 int64 uint uint32 uint64 float32 float64 bool string byte rune error".split(" ")),
      bi: new Set("fmt make len cap append new println".split(" ")),
    },
    rb: {
      master: /(#[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|(\b[a-zA-Z_]\w*\b)/g,
      kw: new Set("def end class module if elsif else unless then while until do return yield begin rescue ensure raise true false nil self super require require_relative attr_reader attr_writer attr_accessor".split(" ")),
      ty: new Set("Integer Float String Array Hash Symbol".split(" ")),
      bi: new Set("puts print p".split(" ")),
    },
    sh: {
      master: /(#[^\n]*)|("(?:\\.|[^"\\])*"|'[^']*')|(\b\d+\b)|(\b[a-zA-Z_][\w-]*\b)/g,
      kw: new Set("if then else elif fi for in do done while until case esac function return export local readonly source".split(" ")),
      ty: new Set(),
      bi: new Set("echo printf cd ls cp mv rm mkdir cat grep sed awk find xargs sudo".split(" ")),
    },
    sql: {
      master: /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:''|[^'])*')|(\b\d+\b)|(\b[a-zA-Z_]\w*\b)/g,
      // SQL は大文字小文字を区別しないため、突合は uppercase 化して行う
      _ci: true,
      kw: new Set("SELECT FROM WHERE INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE DROP ALTER ADD COLUMN PRIMARY KEY FOREIGN REFERENCES INDEX VIEW JOIN INNER LEFT RIGHT OUTER ON AS AND OR NOT NULL TRUE FALSE GROUP BY ORDER LIMIT OFFSET HAVING DISTINCT UNION ALL EXISTS IN BETWEEN LIKE IS CASE WHEN THEN END".split(" ")),
      ty: new Set("INT INTEGER VARCHAR CHAR TEXT DATE TIMESTAMP BOOLEAN BOOL NUMERIC DECIMAL FLOAT DOUBLE BLOB".split(" ")),
      bi: new Set(),
    },
  };
})();

// HTML 専用ハイライト（タグ名・属性名・属性値・コメントを色付け）
function highlightHtml(code) {
  const escaped = htmlEscape(code);
  // 衝突しないようプレースホルダ経由で順番に処理する
  let out = escaped.replace(/&lt;!--[\s\S]*?--&gt;/g, m => `\x00CMT${m}\x00`);
  out = out.replace(/&quot;[^&]*?&quot;|&#39;[^&]*?&#39;/g, m => `\x00STR${m}\x00`);
  out = out.replace(/(&lt;\/?)([a-zA-Z][\w-]*)/g, "$1\x00KW$2\x00");
  out = out.replace(/\b([a-zA-Z][\w-]*)(?=\s*=)/g, "\x00TY$1\x00");
  out = out.replace(/\x00CMT([\s\S]*?)\x00/g, '<span class="tok-cmt">$1</span>');
  out = out.replace(/\x00STR([\s\S]*?)\x00/g, '<span class="tok-str">$1</span>');
  out = out.replace(/\x00KW([\s\S]*?)\x00/g, '<span class="tok-kw">$1</span>');
  out = out.replace(/\x00TY([\s\S]*?)\x00/g, '<span class="tok-ty">$1</span>');
  return out;
}

// 主要言語のハイライト（未知言語は等幅でプレーン表示）
function highlightCode(code, lang) {
  if (lang === "html") return highlightHtml(code);
  const lex = SYNTAX_LEXERS[lang];
  if (!lex) return htmlEscape(code);

  let out = "";
  let last = 0;
  let m;
  lex.master.lastIndex = 0;
  while ((m = lex.master.exec(code)) !== null) {
    out += htmlEscape(code.slice(last, m.index));
    if (m[1] !== undefined)      out += `<span class="tok-cmt">${htmlEscape(m[1])}</span>`;
    else if (m[2] !== undefined) out += `<span class="tok-str">${htmlEscape(m[2])}</span>`;
    else if (m[3] !== undefined) out += `<span class="tok-num">${htmlEscape(m[3])}</span>`;
    else if (m[4] !== undefined) {
      const id = m[4];
      const key = lex._ci ? id.toUpperCase() : id;
      if (lex.kw.has(key))      out += `<span class="tok-kw">${id}</span>`;
      else if (lex.ty.has(key)) out += `<span class="tok-ty">${id}</span>`;
      else if (lex.bi.has(key)) out += `<span class="tok-bi">${id}</span>`;
      else out += htmlEscape(id);
    }
    last = lex.master.lastIndex;
  }
  out += htmlEscape(code.slice(last));
  return out;
}

// クリップボードへコピー（失敗時は textarea フォールバック）
function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => false);
  }
  return new Promise(resolve => {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      resolve(ok);
    } catch (e) { resolve(false); }
  });
}

function renderCodeExample(ex) {
  if (!ex || typeof ex.code !== "string" || !ex.code.trim()) return null;
  const lang = (ex.lang || "").toLowerCase();

  const copyBtn = el("button", { class: "code-copy-btn", type: "button" }, "コピー");
  copyBtn.addEventListener("click", async () => {

    copyBtn.textContent = ok ? "コピー済み" : "失敗";
    copyBtn.classList.toggle("copied", ok);

      copyBtn.textContent = "コピー";

  bar.appendChild(copyBtn);

  if (typeof ex.caption === "string" && ex.caption.trim()) {

  }
  return wrap;
}

// 任意の語を全カテゴリから検索（confusables 解決などに利用）
function findWordItem(word) {
  if (typeof word !== "string") return null;
  const meaningCats = ["prereq", "basic", "advanced"];
  for (const cat of meaningCats) {
    if (!Array.isArray(DATA[cat])) continue;
    const found = DATA[cat].find(x => x.word === word);
    if (found) return { item: found, kind: "meaning" };
  }
  if (Array.isArray(DATA.abbr)) {
    const found = DATA.abbr.find(x => x.word === word);
    if (found) return { item: found, kind: "abbr" };
  }
  if (Array.isArray(DATA.acronym)) {
    const found = DATA.acronym.find(x => x.word === word);
    if (found) return { item: found, kind: "acronym" };
  }
  return null;
}

function meaningOfFound(found) {
  if (!found) return "";
  if (found.kind === "meaning") return found.item.meaning || "";
  if (found.kind === "abbr" || found.kind === "acronym") return found.item.full || "";
  return "";
}

// 非モーダルなトースト通知（confusables のタップ表示などで使用）
function showToast(message) {
  let host = document.getElementById("toast-host");
  if (!host) {
    host = el("div", { id: "toast-host", class: "toast-host" });
    document.body.appendChild(host);
  }
  const t = el("div", { class: "toast" }, message);
  host.appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => {
    t.classList.remove("show");
    setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 240);
  }, 2400);
}

function renderConfusables(list) {
  if (!Array.isArray(list) || list.length === 0) return null;
  const wrap = el("div", { class: "confusable-list" });
  list.forEach(c => {
    if (!c || typeof c.word !== "string") return;
    const found = findWordItem(c.word);
    const card = el("div", { class: "confusable-card", role: "button", tabindex: "0" });

    card.appendChild(el("div", { class: "confusable-card-head" }, [
      el("span", { class: "confusable-word" }, c.word),
    ]));
    card.appendChild(el("p", { class: "confusable-diff" }, c.diff || ""));

    const linkBtn = el("button", { class: "confusable-link", type: "button" }, "単語帳で見る");
    linkBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      wbState.catId = "all";
      wbState.search = c.word;
      showScreen("wordbook");
    });
    card.appendChild(el("div", { class: "confusable-actions" }, [linkBtn]));

    const showMeaning = () => {
      const m = meaningOfFound(found);
      if (m) showToast(c.word + " ＝ " + m);
      else showToast(c.word + " はデータ未収録です");
    };
    card.addEventListener("click", showMeaning);
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        showMeaning();
      }
    });

    wrap.appendChild(card);
  });
  return wrap;
}

function hasExplanation(item) {
  if (!item) return false;
  return !!(
    (typeof item.useCase === "string" && item.useCase.trim()) ||
    (item.codeExample && typeof item.codeExample.code === "string" && item.codeExample.code.trim()) ||
    (Array.isArray(item.confusables) && item.confusables.length > 0)
  );
}

function renderExplanation(item, opts) {
  if (!item) return null;
  const compact = !!(opts && opts.compact);
  const hasUseCase = typeof item.useCase === "string" && item.useCase.trim();
  const codeNode = renderCodeExample(item.codeExample);
  const confNode = renderConfusables(item.confusables);
  if (!hasUseCase && !codeNode && !confNode) return null;

  const pane = el("div", { class: "explain-pane" + (compact ? " compact" : "") });

  if (hasUseCase) {
    pane.appendChild(el("p", {
      class: "explain-section-title",
      html: LIGHTBULB_ICON_SVG + "<span>使用シーン</span>",
    }));
    pane.appendChild(el("p", { class: "explain-usecase" }, item.useCase));
  }

  if (codeNode) {
    pane.appendChild(el("p", {
      class: "explain-section-title",
      html: LIGHTBULB_ICON_SVG + "<span>コード例</span>",
    }));
    pane.appendChild(codeNode);
  }

  if (confNode) {
    pane.appendChild(el("p", {
      class: "explain-section-title",
      html: LIGHTBULB_ICON_SVG + "<span>混同しやすい類語</span>",
    }));
    pane.appendChild(confNode);
  }

  return pane;
}

// ============================================================
// IndexedDB ラッパー（外部ライブラリ不使用）
// ============================================================
function openDB() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") {
      reject(new Error("IndexedDB is unavailable"));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (event) => {
      const db = req.result;
      const oldVersion = (event && event.oldVersion) || 0;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "key" });
      }
      // v1 → v2: 版マーカーのみ書き込む。
      // 既存の history / wordStats / userName は保持（実体スキーマは未変更）。
      if (oldVersion < 2) {
        const tx = req.transaction;
        if (tx) {
          try { tx.objectStore(STORE_NAME).put({ key: "appSchemaVersion", value: 2 }); } catch (e) {}
        }
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGet(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
    req.onerror = () => reject(req.error);
  }));
}

function idbSet(key, value) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).put({ key, value });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function idbDelete(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function idbClear() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

// 旧 localStorage 形式が残っている場合の一度きりの引き継ぎ
async function migrateFromLocalStorage() {
  try {
    const raw = localStorage.getItem(LEGACY_LS_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object") {
      if (parsed.theme) await idbSet("theme", parsed.theme);
      if (Array.isArray(parsed.history)) await idbSet("history", parsed.history);
    }
    localStorage.removeItem(LEGACY_LS_KEY);
  } catch (e) {
    console.warn("Legacy migration skipped:", e);
  }
}

async function loadAllFromIDB() {
  try {
    const lastActivityAt = await idbGet("lastActivityAt");
    // 2週間経過していたらユーザー名以外を破棄
    if (typeof lastActivityAt === "number" && Date.now() - lastActivityAt > IDB_TTL_MS) {
      console.info("[MustDevEigo] data older than 14 days; auto-clearing (userName preserved)");
      const preservedUserName = await idbGet("userName");
      try {
        await idbDelete("theme");
        await idbDelete("history");
        await idbDelete("selection");
        await idbDelete("wordStats");
        await idbDelete("lastActivityAt");
      } catch (e) {}
      dataCache.theme = null;
      dataCache.history = [];
      dataCache.lastSelection = null;
      dataCache.wordStats = {};
      dataCache.userName = (typeof preservedUserName === "string" && preservedUserName.trim()) ? preservedUserName : null;
      dataCache.lastActivityAt = null;
      return;
    }
    const theme = await idbGet("theme");
    const history = await idbGet("history");
    const selection = await idbGet("selection");
    const wordStats = await idbGet("wordStats");
    const userName = await idbGet("userName");
    dataCache.theme = theme || null;
    dataCache.history = Array.isArray(history) ? history : [];
    dataCache.lastSelection = (selection && typeof selection === "object") ? selection : null;
    dataCache.wordStats = (wordStats && typeof wordStats === "object" && !Array.isArray(wordStats)) ? wordStats : {};
    dataCache.userName = (typeof userName === "string" && userName.trim()) ? userName : null;
    dataCache.lastActivityAt = (typeof lastActivityAt === "number") ? lastActivityAt : null;
  } catch (e) {
    console.warn("IndexedDB load failed; running without persistence:", e);
    dataCache.theme = null;
    dataCache.history = [];
    dataCache.lastSelection = null;
    dataCache.wordStats = {};
    dataCache.userName = null;
    dataCache.lastActivityAt = null;
  }
}

// ============================================================
// 苦手復習: 単語ごとの正誤統計
// ============================================================
function statKey(word, kind) {
  return (kind || "meaning") + ":" + word;
}
function recordAnswerStat(word, kind, isCorrect) {
  const key = statKey(word, kind);
  const stats = dataCache.wordStats || (dataCache.wordStats = {});
  const cur = stats[key] || { wrong: 0, right: 0, lastResult: null };
  if (isCorrect) {
    cur.right++;
    cur.lastResult = "correct";
  } else {
    cur.wrong++;
    cur.lastResult = "incorrect";
  }
  cur.lastTs = Date.now();
  stats[key] = cur;
  // fire-and-forget
  persistWordStats();
}
// 「直近で間違えた、または過去に間違えたことがあって今は正解している語の中でも継続フォロー中」
// シンプル版: lastResult === "incorrect" の語を「苦手」として扱う
function getMistakeItems() {
  const stats = dataCache.wordStats || {};
  const all = getCategorySource("all");
  return all.filter(item => {
    const key = statKey(item.word, item._kind);
    const s = stats[key];
    return s && s.lastResult === "incorrect";
  });
}

// DOM ヘルパー
// ============================================================
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "style" && typeof v === "object") {
        for (const s in v) e.style[s] = v[s];
      } else if (k === "dataset") {
        for (const d in v) e.dataset[d] = v[d];
      } else if (v === true) e.setAttribute(k, "");
      else if (v === false || v == null) { /* skip */ }
      else e.setAttribute(k, v);
    }
  }
  appendChildren(e, children);
  return e;
}
function appendChildren(parent, children) {
  if (children == null) return;
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null || c === false) return;
    if (typeof c === "string" || typeof c === "number") {
      parent.appendChild(document.createTextNode(String(c)));
    } else parent.appendChild(c);
  });
}

// 日付の整形 (例: 2026-05-01)
function fmtDate(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// ============================================================
// HTML エクスポート（印刷・閲覧・共有が容易な形式）
// ============================================================
function htmlEscape(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: (mime || "text/plain") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtFileStamp(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
}
function kindLabel(kind) {
  if (kind === "abbr") return "略語";
  if (kind === "acronym") return "頭字語";
  return "意味";
}

    if (!confirm("学習履歴をすべて削除します。よろしいですか？")) return;
    await clearHistoryData();
    renderHome();
  });
  const delAll = el("button", { class: "btn-link", type: "button" }, "すべての保存データを削除");
  delAll.disabled = !(dataCache.history.length || dataCache.theme || dataCache.lastSelection || Object.keys(dataCache.wordStats || {}).length);
  delAll.addEventListener("click", async () => {
    if (!confirm("テーマ・履歴・苦手記録・直近の選択を含む保存データを削除します。\n（お名前は引き続き保持されます）\nよろしいですか？")) return;
    await clearAllData();
    applyThemeUI("light");
    renderHome();
  });
  histCard.appendChild(el("div", { class: "data-actions" }, [exportHist, delHistory, delAll]));
  root.appendChild(histCard);

}

      })(),

        b.addEventListener("click", () => {
          const sel = getLastSelection();
          const targetId = wbState.catId === "all" ? "all" : wbState.catId;
          saveLastSelection({ catId: targetId, count: sel.count, shuffle: sel.shuffle });
