<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MustDevEigo — エンジニア必須英単語</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23EB6D55%22%2F%3E%3Cpath%20d%3D%22M7%2023.5V8.5h3.4l4.6%208.6%204.6-8.6h3.4v15h-2.9V13.4l-3.6%206.7h-2.9l-3.6-6.7v10.1z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
 * Design System v1.5.0 – Tokens
 * 3層: L1 Primitive → L2 Semantic → L3 Component
 * 暖色寄り・丸み優先・余白優先・静かさ優先
 * ============================================================ */
:root {
  /* === L1: Primitive Colors === */
  /* Teal（主軸・見出し・主操作） Base #2D8FB5 */
  --color-teal-50:  #EAF5FA;
  --color-teal-100: #D2EAF3;
  --color-teal-200: #A5D5E7;
  --color-teal-300: #78BFDB;
  --color-teal-400: #4BA9CF;
  --color-teal-500: #2D8FB5;
  --color-teal-600: #247495;
  --color-teal-700: #1B5A75;
  --color-teal-800: #134155;
  --color-teal-900: #0B2A38;

  /* Peach（CTA・アクセント） Base #F87B57 */
  --color-peach-50:  #FEF1ED;
  --color-peach-100: #FDDFD3;
  --color-peach-200: #FBBFA8;
  --color-peach-300: #FA9F7C;
  --color-peach-400: #F98F69;
  --color-peach-500: #F87B57;
  --color-peach-600: #E16645;
  --color-peach-700: #BA5238;
  --color-peach-800: #8C3E2A;
  --color-peach-900: #5E2A1C;

  /* Sunshine（装飾・ハイライト） Base #FFCB47 */
  --color-sunshine-50:  #FFF7E0;
  --color-sunshine-100: #FFEDB8;
  --color-sunshine-300: #FFDA7C;
  --color-sunshine-500: #FFCB47;
  --color-sunshine-700: #C99A2C;

  /* Warm Gray（背景・テキスト・罫線） */
  --color-warm-0:   #FFFFFF;
  --color-warm-50:  #FBF9F7;
  --color-warm-100: #F4F1ED;
  --color-warm-200: #E8E3DC;
  --color-warm-300: #D5CEC4;
  --color-warm-400: #B6ADA1;
  --color-warm-500: #8E847A;
  --color-warm-600: #6B6560;
  --color-warm-700: #4D4944;
  --color-warm-800: #2E2C29;
  --color-warm-900: #1F1C1A; /* 純黒の代わり */

  /* Status */
  --color-success-50:  #E6F4EA;
  --color-success-500: #5DBB7E;
  --color-success-700: #3E8C5C;
  --color-success-900: #1F4F33;
  --color-warning-50:  #FDF1DC;
  --color-warning-500: #F0A933;
  --color-warning-700: #B17A1F;
  --color-warning-900: #5F3F0F;
  --color-error-50:  #FBE6E6;
  --color-error-500: #E36363;
  --color-error-700: #B14040;
  --color-error-900: #5F1F1F;

  /* === L2: Semantic === */
  --bg-canvas:        var(--color-warm-0);
  --bg-muted:         var(--color-warm-50);
  --bg-emphasized:    var(--color-warm-100);
  --bg-inverse:       var(--color-warm-900);

  --text-primary:     var(--color-warm-800);
  --text-secondary:   var(--color-warm-600);
  --text-tertiary:    var(--color-warm-400);
  --text-disabled:    var(--color-warm-300);
  --text-inverse:     var(--color-warm-0);
  --text-brand:       var(--color-teal-700);

  --border-default:   var(--color-warm-200);
  --border-emphasized: var(--color-warm-300);

  --action-primary:        var(--color-teal-500);
  --action-primary-hover:  var(--color-teal-600);
  --action-cta:            var(--color-peach-500);
  --action-cta-hover:      var(--color-peach-600);
  --accent-decor:          var(--color-sunshine-500);

  --focus-ring:       0 0 0 3px rgba(45, 143, 181, 0.32);

  /* === L3: Component === */
  --btn-cta-bg:           var(--action-cta);
  --btn-cta-bg-hover:     var(--action-cta-hover);
  --btn-cta-text:         var(--text-inverse);

  --btn-primary-bg:       var(--action-primary);
  --btn-primary-bg-hover: var(--action-primary-hover);
  --btn-primary-text:     var(--text-inverse);

  --btn-outline-bg:       transparent;
  --btn-outline-text:     var(--action-primary);
  --btn-outline-border:   var(--action-primary);

  --card-bg:              var(--bg-canvas);
  --card-border:          var(--border-default);

  --modal-bg:             var(--bg-canvas);

  --input-bg:             var(--bg-canvas);
  --input-border:         var(--border-default);
  --input-border-focus:   var(--action-primary);

  /* === Radius === */
  --radius-xs:   4px;
  --radius-sm:   6px;
  --radius-md:  12px;  /* form input */
  --radius-lg:  20px;  /* small card */
  --radius-xl:  28px;  /* standard card ★ */
  --radius-2xl: 40px;
  --radius-pill: 9999px; /* button mandatory ★ */

  /* === Shadow === */
  --shadow-xs:  0 1px 2px rgba(31, 28, 26, 0.04);
  --shadow-sm:  0 2px 6px rgba(31, 28, 26, 0.06);
  --shadow-md:  0 6px 16px rgba(31, 28, 26, 0.08);
  --shadow-lg:  0 12px 28px rgba(31, 28, 26, 0.10);
  --shadow-xl:  0 20px 40px rgba(31, 28, 26, 0.14);
  --shadow-2xl: 0 28px 56px rgba(31, 28, 26, 0.18);
  --shadow-glow: 0 8px 24px rgba(248, 123, 87, 0.30);
  --shadow-inset: inset 0 2px 4px rgba(31, 28, 26, 0.06);

  /* === Motion === */
  --dur-fast:  180ms;
  --dur-base:  280ms;
  --dur-slow:  480ms;
  --dur-slower: 640ms;
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* === Spacing (4px grid) === */
  --space-1:  4px;
  --space-2:  8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;
  --space-24: 96px;
  --space-32: 128px;

  /* === Typography === */
  --font-display: "Zen Maru Gothic", "Noto Sans JP", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --font-body:    "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --font-en:      "DM Sans", Arial, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* === 旧 --az-color-* との互換エイリアス（既存規則を壊さないため） === */
  --az-color-white:           var(--color-warm-0);
  --az-color-black:           var(--color-warm-900);
  --az-color-off-white:       var(--bg-canvas);
  --az-color-cream:           var(--color-sunshine-50);
  --az-color-warm-gray-50:    var(--color-warm-50);
  --az-color-warm-gray-100:   var(--color-warm-100);
  --az-color-warm-gray-200:   var(--color-warm-200);
  --az-color-warm-gray-300:   var(--color-warm-300);
  --az-color-warm-gray-400:   var(--color-warm-400);
  --az-color-gray-500:        var(--color-warm-500);
  --az-color-charcoal-700:    var(--color-warm-700);
  --az-color-charcoal-900:    var(--color-warm-800);
  --az-color-coral-500:       #EB6D55; /* 不正解専用なのでリテラル */
  --az-color-coral-600:       #D95C47;
  --az-color-lime-500:        #AACE38; /* 正解専用なのでリテラル */
  --az-color-lime-600:        #8FB82E;
  --az-color-bg-page:         var(--bg-canvas);
  --az-color-bg-surface:      var(--card-bg);
  --az-color-bg-soft:         var(--bg-muted);
  --az-color-bg-azraku:       var(--color-sunshine-50);
  --az-color-border-default:  var(--border-default);
  --az-color-border-strong:   var(--border-emphasized);
  --az-color-text-primary:    var(--text-primary);
  --az-color-text-body:       var(--text-secondary);
  --az-color-text-subtle:     var(--text-tertiary);
  --az-color-text-inverse:    var(--text-inverse);
  /* 「アクション=peach(CTA)」の見た目になるよう旧トークンを peach に振り分け（互換目的） */
  --az-color-action-primary:       var(--action-cta);
  --az-color-action-primary-hover: var(--action-cta-hover);
  --az-color-action-secondary:     var(--action-primary); /* 旧secondaryをteal主操作へ */
  --az-color-action-secondary-hover: var(--action-primary-hover);
  --az-color-focus-ring:           rgba(45, 143, 181, 0.32);
  --az-font-family-sans: var(--font-body);
  --az-font-family-en:   var(--font-en);
  --az-radius-sm: var(--radius-sm);
  --az-radius-md: var(--radius-md);
  --az-radius-lg: var(--radius-lg);
  --az-radius-xl: var(--radius-xl);
  --az-radius-full: var(--radius-pill);
}

/* === Dark theme === */
:root[data-theme="dark"] {
  --bg-canvas:      #1F1C1A;
  --bg-muted:       #2A2624;
  --bg-emphasized:  #34302D;
  --bg-inverse:     var(--color-warm-50);

  --text-primary:   #F1ECE5;
  --text-secondary: #C9C0B5;
  --text-tertiary:  #8E847A;
  --text-disabled:  #5A524C;
  --text-inverse:   #1F1C1A;
  --text-brand:    var(--color-teal-300);

  --border-default:    #3A3431;
  --border-emphasized: #524A45;

  --action-primary:        var(--color-teal-400);
  --action-primary-hover:  var(--color-teal-300);
  --action-cta:            var(--color-peach-400);
  --action-cta-hover:      var(--color-peach-300);

  --focus-ring: 0 0 0 3px rgba(120, 191, 219, 0.40);

  --shadow-xs:  0 1px 2px rgba(0, 0, 0, 0.30);
  --shadow-sm:  0 2px 6px rgba(0, 0, 0, 0.35);
  --shadow-md:  0 6px 16px rgba(0, 0, 0, 0.40);
  --shadow-lg:  0 12px 28px rgba(0, 0, 0, 0.45);
  --shadow-xl:  0 20px 40px rgba(0, 0, 0, 0.50);
  --shadow-glow: 0 8px 24px rgba(248, 123, 87, 0.40);

  /* テキスト inverse は CTA(peach)上で白を維持したいので明示固定 */
  --btn-cta-text:     #FFFFFF;
  --btn-primary-text: #FFFFFF;
}

/* Reduced motion 対応 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0ms !important;
    scroll-behavior: auto !important;
  }
}

/* === ダークモード用のコンポーネント補正 ===
   light primitive (warm-gray-50/100) を直接使っている場所を、暗背景で潰れないように上書きする */
:root[data-theme="dark"] .quiz-progress {
  background: #3D3D33;
}
:root[data-theme="dark"] .choice-num {
  background: #3D3D33;
  color: var(--az-color-text-body);
}
:root[data-theme="dark"] .cat-row.selected {
  background: rgba(255, 255, 255, 0.06);
}
:root[data-theme="dark"] .feedback {
  background: var(--az-color-bg-soft);
  border-color: var(--az-color-border-default);
}
:root[data-theme="dark"] .feedback.correct {
  background: rgba(170, 206, 56, 0.18);
}
:root[data-theme="dark"] .feedback.incorrect {
  background: rgba(235, 109, 85, 0.18);
}
:root[data-theme="dark"] .choice.correct {
  background: rgba(170, 206, 56, 0.16);
}
:root[data-theme="dark"] .choice.incorrect {
  background: rgba(235, 109, 85, 0.16);
}
:root[data-theme="dark"] .wb-toolbar input[type="search"]::placeholder {
  color: #6E665A;
}
:root[data-theme="dark"] .kbd {
  background: var(--az-color-bg-soft);
  color: var(--az-color-text-body);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--az-font-family-sans);
  font-size: 14px;
  line-height: 1.55;
  background: var(--az-color-bg-page);
  color: var(--az-color-text-body);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 16px 16px;
}

/* ヘッダー */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 10px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--az-color-border-default);
}
.brand {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  color: var(--az-color-text-primary);
  line-height: 1.3;
  white-space: nowrap;
}
.brand em {
  font-style: normal;
  color: var(--az-color-text-subtle);
  font-weight: 400;
  font-size: 11px;
  margin-left: 6px;
}
.app-actions { display: inline-flex; gap: 4px; align-items: center; }
.link-btn {
  display: inline-flex;
  align-items: center;
  height: 28px;
  background: transparent;
  border: 0;
  color: var(--az-color-text-subtle);
  font-family: inherit;
  font-size: 12px;
  padding: 0 8px;
  cursor: pointer;
  font-weight: 500;
  white-space: nowrap;
  border-radius: 6px;
  line-height: 1;
}
.link-btn:hover { color: var(--az-color-action-primary); background: var(--az-color-bg-soft); }
.link-btn.active { color: var(--az-color-text-primary); font-weight: 700; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 6px;
  color: var(--az-color-text-subtle);
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
  flex-shrink: 0;
}
.icon-btn:hover { color: var(--az-color-action-primary); background: var(--az-color-bg-soft); }
.icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--az-color-focus-ring); }
.theme-icon { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
.theme-icon svg { display: block; }

/* ユーザー名ボタン（ヘッダー内） */
.user-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 10px;
  background: transparent;
  border: 1px solid var(--az-color-border-default);
  border-radius: 14px;
  color: var(--az-color-text-body);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.user-btn:hover { background: var(--az-color-bg-soft); border-color: var(--az-color-border-strong); color: var(--az-color-text-primary); }
.user-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--az-color-focus-ring); }

/* モーダル */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 20, 20, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
:root[data-theme="dark"] .modal-backdrop { background: rgba(0, 0, 0, 0.6); }
.modal {
  background: var(--az-color-bg-surface);
  border: 1px solid var(--az-color-border-default);
  border-radius: 16px;
  padding: 24px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
}
.modal-title {
  margin: 0 0 8px;
  font-size: 18px;
  font-weight: 700;
  color: var(--az-color-text-primary);
}
.modal-desc {
  margin: 0 0 16px;
  font-size: 13px;
  color: var(--az-color-text-body);
  line-height: 1.6;
}
.modal-input {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  border: 1px solid var(--az-color-border-default);
  border-radius: 8px;
  background: var(--az-color-bg-surface);
  color: var(--az-color-text-primary);
  font-family: inherit;
  font-size: 16px;
  margin-bottom: 18px;
}
.modal-input:focus {
  outline: none;
  border-color: var(--az-color-action-primary);
  box-shadow: 0 0 0 3px var(--az-color-focus-ring);
}
.modal-input::placeholder { color: var(--az-color-warm-gray-400); }
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.modal-actions .btn { min-height: 40px; padding: 0 18px; }
.modal-actions .btn[hidden] { display: none; }

/* 発音ボタン（TTS） */
.speak-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  padding: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--az-radius-full);
  color: var(--az-color-text-subtle);
  cursor: pointer;
  vertical-align: middle;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
}
.speak-btn:hover { color: var(--az-color-action-primary); background: var(--az-color-bg-soft); }
.speak-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--az-color-focus-ring); }
.speak-btn svg { display: block; }
.speak-btn-lg { width: 32px; height: 32px; }
.speak-btn-lg svg { width: 18px; height: 18px; }
.headword-row { display: inline-flex; align-items: center; gap: 10px; }

/* ブロック */
.block {
  background: var(--az-color-bg-surface);
  border: 1px solid var(--az-color-border-default);
  border-radius: var(--az-radius-md);
  padding: 12px 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  margin-bottom: 10px;
}

.section-title {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--az-color-text-subtle);
  letter-spacing: 0.04em;
}
.muted { color: var(--az-color-text-subtle); font-size: 12px; margin: 0; }

/* CTA */
.cta {
  background: var(--az-color-bg-azraku);
  border: 1px solid var(--az-color-border-default);
  border-radius: var(--az-radius-lg);
  padding: 14px 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.cta-info { flex: 1 1 auto; min-width: 0; }
.cta-eyebrow {
  font-size: 11px;
  color: var(--az-color-text-subtle);
  margin: 0;
  letter-spacing: 0.04em;
  font-weight: 500;
}
.cta-summary {
  margin: 1px 0 0;
  font-size: 16px;
  font-weight: 700;
  color: var(--az-color-text-primary);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cta-summary .sep { color: var(--az-color-text-subtle); font-weight: 400; margin: 0 6px; }
.cta-summary .tk-mistake { color: var(--az-color-action-primary); }

/* 苦手復習 CTA: コーラルのアウトラインで注意喚起 */
.review-cta {
  background: rgba(235, 109, 85, 0.06);
  border: 1px solid var(--az-color-action-primary);
  border-radius: var(--az-radius-md);
  padding: 12px 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.review-cta .cta-info { flex: 1 1 auto; min-width: 0; }
.review-cta .cta-eyebrow { color: var(--az-color-action-primary); }

/* 結果画面の補足メッセージ */
.result-note {
  text-align: center;
  font-size: 12px;
  color: var(--az-color-text-subtle);
  margin: 6px 0 0;
}

/* ボタン */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  padding: 0 16px;
  border: 1px solid var(--az-color-action-primary);
  border-radius: var(--az-radius-sm);
  background: var(--az-color-bg-surface);
  color: var(--az-color-action-primary);
  font-family: var(--az-font-family-sans);
  font-size: 14px;
  font-weight: 700;
  line-height: 1;

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n, exclude) {
  const pool = arr.filter(item => !exclude.includes(item));
  return shuffleArray(pool).slice(0, n);
}

function getCategorySource(catId) {
  if (catId === "all") {
    return [
      ...DATA.prereq.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.basic.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.advanced.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.abbr.map(x => ({ ...x, _kind: "abbr" })),
      ...DATA.acronym.map(x => ({ ...x, _kind: "acronym" })),
    ];
  }
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat) return [];
  return DATA[cat.source].map(x => ({ ...x, _kind: cat.type }));
}

// items: クイズ対象の語のリスト
// fullPool: 同一の_kindの全語（誤答抽出用）
function buildQuestion(item, fullPool) {
  const kind = item._kind;
  let prompt, answer, distractorPool;

  if (kind === "meaning") {
    prompt = "次の単語の意味として最も適切なものは？";
    answer = item.meaning;
    distractorPool = fullPool
      .filter(x => x._kind === "meaning" && x.meaning !== item.meaning)
      .map(x => x.meaning);
  } else if (kind === "abbr") {
    prompt = "次の略語の元の英単語として最も適切なものは？";
    answer = item.full;
    distractorPool = fullPool
      .filter(x => x._kind === "abbr" && x.full !== item.full)
      .map(x => x.full);
  } else if (kind === "acronym") {
    prompt = "次の頭字語の正式名称として最も適切なものは？";
    answer = item.full;
    distractorPool = fullPool
      .filter(x => x._kind === "acronym" && x.full !== item.full)
      .map(x => x.full);
  }

  const uniquePool = Array.from(new Set(distractorPool));
  const distractors = pickRandom(uniquePool, 3, [answer]);
  while (distractors.length < 3) {
    distractors.push("（候補不足）");
  }
  const choices = shuffleArray([answer, ...distractors]);
  const correctIndex = choices.indexOf(answer);

  return {
    word: item.word,
    prompt,
    choices,
    correctIndex,
    answer,
    kind,
  };
}

// ============================================================
// IndexedDB ラッパー（外部ライブラリ不使用）
// ============================================================
function openDB() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") {
      reject(new Error("IndexedDB is unavailable"));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "key" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGet(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
    req.onerror = () => reject(req.error);
  }));
}

function idbSet(key, value) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).put({ key, value });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function idbDelete(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function idbClear() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

// 旧 localStorage 形式が残っている場合の一度きりの引き継ぎ
async function migrateFromLocalStorage() {
  try {
    const raw = localStorage.getItem(LEGACY_LS_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object") {
      if (parsed.theme) await idbSet("theme", parsed.theme);
      if (Array.isArray(parsed.history)) await idbSet("history", parsed.history);
    }
    localStorage.removeItem(LEGACY_LS_KEY);
  } catch (e) {
    console.warn("Legacy migration skipped:", e);
  }
}

async function loadAllFromIDB() {
  try {
    const lastActivityAt = await idbGet("lastActivityAt");
    // 2週間経過していたらユーザー名以外を破棄
    if (typeof lastActivityAt === "number" && Date.now() - lastActivityAt > IDB_TTL_MS) {
      console.info("[MustDevEigo] data older than 14 days; auto-clearing (userName preserved)");
      const preservedUserName = await idbGet("userName");
      try {
        await idbDelete("theme");
        await idbDelete("history");
        await idbDelete("selection");
        await idbDelete("wordStats");
        await idbDelete("lastActivityAt");
      } catch (e) {}
      dataCache.theme = null;
      dataCache.history = [];
      dataCache.lastSelection = null;
      dataCache.wordStats = {};
      dataCache.userName = (typeof preservedUserName === "string" && preservedUserName.trim()) ? preservedUserName : null;
      dataCache.lastActivityAt = null;
      return;
    }
    const theme = await idbGet("theme");
    const history = await idbGet("history");
    const selection = await idbGet("selection");
    const wordStats = await idbGet("wordStats");
    const userName = await idbGet("userName");
    dataCache.theme = theme || null;
    dataCache.history = Array.isArray(history) ? history : [];
    dataCache.lastSelection = (selection && typeof selection === "object") ? selection : null;
    dataCache.wordStats = (wordStats && typeof wordStats === "object" && !Array.isArray(wordStats)) ? wordStats : {};
    dataCache.userName = (typeof userName === "string" && userName.trim()) ? userName : null;
    dataCache.lastActivityAt = (typeof lastActivityAt === "number") ? lastActivityAt : null;
  } catch (e) {
    console.warn("IndexedDB load failed; running without persistence:", e);
    dataCache.theme = null;
    dataCache.history = [];
    dataCache.lastSelection = null;
    dataCache.wordStats = {};
    dataCache.userName = null;
    dataCache.lastActivityAt = null;
  }
}

// ============================================================
function statKey(word, kind) {
  return (kind || "meaning") + ":" + word;
}
function recordAnswerStat(word, kind, isCorrect) {
  const key = statKey(word, kind);
  const stats = dataCache.wordStats || (dataCache.wordStats = {});
  const cur = stats[key] || { wrong: 0, right: 0, lastResult: null };
  if (isCorrect) {
    cur.right++;
    cur.lastResult = "correct";
  } else {
    cur.wrong++;
    cur.lastResult = "incorrect";
  }
  cur.lastTs = Date.now();
  stats[key] = cur;
  // fire-and-forget
  persistWordStats();
}
// 「直近で間違えた、または過去に間違えたことがあって今は正解している語の中でも継続フォロー中」
// シンプル版: lastResult === "incorrect" の語を「苦手」として扱う
function getMistakeItems() {
  const stats = dataCache.wordStats || {};
  const all = getCategorySource("all");
  return all.filter(item => {
    const key = statKey(item.word, item._kind);
    const s = stats[key];
    return s && s.lastResult === "incorrect";
  });
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "style" && typeof v === "object") {
        for (const s in v) e.style[s] = v[s];
      } else if (k === "dataset") {
        for (const d in v) e.dataset[d] = v[d];
      } else if (v === true) e.setAttribute(k, "");
      else if (v === false || v == null) { /* skip */ }
      else e.setAttribute(k, v);
    }
  }
  appendChildren(e, children);
  return e;
}
function appendChildren(parent, children) {
  if (children == null) return;
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null || c === false) return;
    if (typeof c === "string" || typeof c === "number") {
      parent.appendChild(document.createTextNode(String(c)));
    } else parent.appendChild(c);
  });
}

// 日付の整形 (例: 2026-05-01)
function fmtDate(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// ============================================================
// HTML エクスポート（印刷・閲覧・共有が容易な形式）
// ============================================================
function htmlEscape(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: (mime || "text/plain") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtFileStamp(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
}
function kindLabel(kind) {
  if (kind === "abbr") return "略語";
  if (kind === "acronym") return "頭字語";
  return "意味";
}

function renderWordbookList() {
  const listEl = document.getElementById("wb-list");
  const sumEl = document.getElementById("wb-summary");
  if (!listEl || !sumEl) return;
  listEl.innerHTML = "";

  const source = getCategorySource(wbState.catId);
  // 表示用の (word, displayMeaning) を作る
  const rows = source.map(item => {
    let display;
    if (item._kind === "abbr") display = item.full + "（の略）";
    else if (item._kind === "acronym") display = item.full;
    else display = item.meaning;
    return { word: item.word, display };
  });

  // 検索フィルタ
  const q = wbState.search.trim().toLowerCase();
  const filtered = q ? rows.filter(r =>
    r.word.toLowerCase().includes(q) || r.display.toLowerCase().includes(q)
  ) : rows;

  // 単語アルファベット順にソート
  filtered.sort((a, b) => a.word.localeCompare(b.word));

  sumEl.innerHTML = "";
  sumEl.appendChild(document.createTextNode("表示中: "));
  sumEl.appendChild(el("strong", null, String(filtered.length)));
  sumEl.appendChild(document.createTextNode(" / 全 "));
  sumEl.appendChild(el("strong", null, String(rows.length)));
  sumEl.appendChild(document.createTextNode(" 語"));

  if (filtered.length === 0) {
    listEl.appendChild(el("div", { class: "wb-empty" }, "該当する単語が見つかりません。"));
    return;
  }

  filtered.forEach(r => {
    listEl.appendChild(el("div", { class: "wb-row" }, [
      el("div", { class: "wb-word" }, [
        el("span", { class: "headword-row" }, [
          el("span", null, r.word),
          makeSpeakButton(r.word),
        ]),
      ]),
      el("div", { class: "wb-meaning" }, r.display),
    ]));
  });
}

// ============================================================
// 演習開始
// ============================================================
function startQuiz(override) {
  const sel = override || getLastSelection();
  const source = getCategorySource(sel.catId);
  if (source.length === 0) {
    alert("出題できる語がありません。");
    return;
  }
  const ordered = sel.shuffle ? shuffleArray(source) : source.slice();
  const limit = sel.count === "all" ? ordered.length : Math.min(parseInt(sel.count, 10), ordered.length);
  const items = ordered.slice(0, limit);

  state.questions = items.map(item => buildQuestion(item, source));
  state.currentIdx = 0;
  state.correctCount = 0;
  state.answers = [];
  state.awaitingNext = false;
  state.selectedCategory = sel.catId;
  state.mistakeMode = false;
  saveLastSelection({ catId: sel.catId, count: sel.count, shuffle: sel.shuffle });

  showScreen("quiz");
  renderQuestion();
}

// 苦手だけを出題する（誤答リストから抽出）
function startMistakeQuiz() {
  const mistakes = getMistakeItems();
  if (mistakes.length === 0) {
    alert("苦手として記録された単語はありません。");
    return;
  }
  const allSource = getCategorySource("all");
  const ordered = shuffleArray(mistakes);
  state.questions = ordered.map(item => buildQuestion(item, allSource));
  state.currentIdx = 0;
  state.correctCount = 0;
  state.answers = [];
  state.awaitingNext = false;
  state.selectedCategory = "mistake";
  state.mistakeMode = true;

  showScreen("quiz");
  renderQuestion();
}

// ============================================================
// 出題
// ============================================================
function renderQuestion() {
  const q = state.questions[state.currentIdx];
  const root = document.getElementById("quiz-content");
  root.innerHTML = "";
  state.awaitingNext = false;

  const pct = (state.currentIdx / state.questions.length) * 100;
  const card = el("div", { class: "block" }, [
    el("div", { class: "quiz-progress" }, [
      el("div", { class: "fill", style: { width: pct + "%" } }),
    ]),
    el("div", { class: "quiz-meta" }, [
      el("span", null, `第 ${state.currentIdx + 1} 問 / 全 ${state.questions.length} 問`),
      el("span", { class: "score" }, `正解 ${state.correctCount} / ${state.answers.length}`),
    ]),
    el("div", { class: "headword" }, [
      el("span", { class: "headword-row" }, [
        el("span", null, q.word),
        makeSpeakButton(q.word, { size: "lg" }),
      ]),
    ]),
    el("p", { class: "headword-prompt" }, q.prompt),
    (() => {
      const choices = el("div", { class: "choices" });
      q.choices.forEach((c, i) => {
        const btn = el("button", { class: "choice", type: "button", dataset: { idx: String(i) } }, [
          el("span", { class: "choice-num" }, String(i + 1)),
          el("span", { class: "choice-text" }, c),
        ]);
        btn.addEventListener("click", () => handleChoice(i));
        choices.appendChild(btn);
      });
      return choices;
    })(),
    el("div", { class: "feedback", id: "feedback" }),
    el("div", { class: "quiz-actions" }, [
      (() => {
        const b = el("button", { class: "btn", id: "quit-btn", type: "button" }, "中断");
        b.addEventListener("click", () => {
          if (state.answers.length === 0 || confirm("演習を中断してホームに戻りますか？")) {
            showScreen("home");
          }
        });
        return b;
      })(),
      (() => {
        const b = el("button", { class: "btn btn-primary", id: "next-btn", type: "button", disabled: true }, "次の問へ →");
        b.addEventListener("click", goNext);
        return b;
      })(),
    ]),
    el("p", { class: "kb-hint" }, [
      el("span", { class: "kbd" }, "1"),
      "〜",
      el("span", { class: "kbd" }, "4"),
      "で選択 / ",
      el("span", { class: "kbd" }, "Enter"),
      "で次へ",
    ]),
  ]);
  root.appendChild(card);
}

// ============================================================
// 解答処理
// ============================================================
function handleChoice(idx) {
  if (state.awaitingNext) return;
  const q = state.questions[state.currentIdx];
  const isCorrect = idx === q.correctIndex;
  if (isCorrect) state.correctCount++;
  state.answers.push({ word: q.word, picked: idx, correct: q.correctIndex, isCorrect, answer: q.answer, choices: q.choices, kind: q.kind });
  state.awaitingNext = true;
  // 単語別の正誤を記録（苦手復習で利用）
  recordAnswerStat(q.word, q.kind, isCorrect);

  document.querySelectorAll("#quiz-content .choice").forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correctIndex) btn.classList.add("correct");
    else if (i === idx) btn.classList.add("incorrect");
  });

  const fb = document.getElementById("feedback");
  if (fb) {
    fb.innerHTML = "";
    fb.classList.add("show", isCorrect ? "correct" : "incorrect");
    fb.appendChild(el("strong", null, isCorrect ? "正解" : "不正解"));
    fb.appendChild(document.createTextNode("  "));
    fb.appendChild(document.createTextNode(q.word + " ＝ " + q.answer));
  }

  const meta = document.querySelector("#quiz-content .quiz-meta .score");
  if (meta) meta.textContent = `正解 ${state.correctCount} / ${state.answers.length}`;

  const nextBtn = document.getElementById("next-btn");
  if (nextBtn) { nextBtn.disabled = false; nextBtn.focus(); }
}

// ============================================================
// 次へ / 終了
// ============================================================
function goNext() {
  if (!state.awaitingNext) return;
  state.currentIdx++;
  if (state.currentIdx >= state.questions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

async function finishQuiz() {
  const total = state.answers.length;
  const correct = state.correctCount;
  const rate = total > 0 ? Math.round(correct / total * 100) : 0;
  const isMistake = state.mistakeMode === true;
  const cat = isMistake
    ? { id: "mistake", label: "苦手復習", desc: "" }
    : getCategoryById(state.selectedCategory);

  await recordHistorySession({
    timestamp: Date.now(),
    categoryId: cat.id,
    categoryLabel: cat.label,
    total,
    correct,
  });

  // 苦手復習モードでの「克服した語」をカウント
  let resolved = 0;
  if (isMistake) {
    state.answers.forEach(a => { if (a.isCorrect) resolved++; });
  }

  lastFinishedInfo = { total, correct, rate, cat, isMistake, resolved };
  renderResult();
}

function renderResult() {
  const root = document.getElementById("result-content");
  root.innerHTML = "";
  const info = lastFinishedInfo;

  const summary = el("div", { class: "block" }, [
    el("p", { class: "result-headline" }, info.cat.label + " の結果"),
    el("p", { class: "result-rate" }, info.rate + "%"),
    el("p", { class: "result-correct" }, `${info.correct} / ${info.total} 問 正解`),
    info.isMistake ? el("p", { class: "result-note" }, info.resolved + " 語を克服 · 残った苦手は次回も出題されます") : null,
  ]);
  root.appendChild(summary);

  const reviewCard = el("div", { class: "block" }, [
    el("p", { class: "section-title" }, "振り返り"),
  ]);
  const list = el("div", { class: "review-list" });
  state.answers.forEach(a => {
    list.appendChild(el("div", { class: "review-row" }, [
      el("span", { class: "review-mark " + (a.isCorrect ? "ok" : "ng") }, a.isCorrect ? "○" : "×"),
      el("span", { class: "review-body" }, [
        el("span", { class: "review-headword" }, a.word),
        el("span", { class: "review-meaning" }, "＝ " + a.answer),
        a.isCorrect ? null : el("span", { class: "review-picked" }, a.choices[a.picked] || "—"),
      ]),
    ]));
  });
  reviewCard.appendChild(list);
  root.appendChild(reviewCard);

  const actions = el("div", { class: "result-actions" }, [
    (() => {
      const b = el("button", { class: "btn", type: "button" }, "← ホームに戻る");
      b.addEventListener("click", () => showScreen("home"));
      return b;
    })(),
    (() => {
      const isMistake = info.isMistake;
      const b = el("button", { class: "btn btn-primary", type: "button" }, isMistake ? "苦手をもう一度 →" : "もう一度 →");
      b.addEventListener("click", () => isMistake ? startMistakeQuiz() : startQuiz());
      return b;
    })(),
  ]);
  root.appendChild(actions);

  // 補助リンク
  const subActions = el("div", { class: "sub-actions" }, [
    (() => {
      const b = el("button", { class: "btn-link", type: "button" }, "結果をHTMLで保存");
      b.addEventListener("click", exportSessionHTML);
      return b;
    })(),
    (() => {
      const b = el("button", { class: "btn-link", type: "button" }, "単語帳で確認");
      b.addEventListener("click", () => {
        wbState.catId = state.selectedCategory;
        wbState.search = "";
        showScreen("wordbook");
      });
      return b;
    })(),
  ]);
  root.appendChild(subActions);

  showScreen("result");
}

// ============================================================
// テーマ
// ============================================================
// サン / ムーンの SVG アイコン。クリックで切り替わる先を視覚化する:
// - 現在 light → 月アイコン（クリックで dark に切り替え）
// - 現在 dark  → 太陽アイコン（クリックで light に切り替え）
const SUN_ICON_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>';

// 音声読み上げ（Web Speech API）
const SPEAKER_ICON_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';

const ttsAvailable = typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";

// 利用可能な英語音声から最も自然なものを選ぶ。
// 音声は OS / ブラウザ依存で品質に大きく差があり、espeak のような合成は非自然なため、
// より自然な Google / Apple / Microsoft の声を優先して選択する。
let selectedVoice = null;

function pickBestVoice() {
  if (!ttsAvailable) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  if (!voices.length) return null;

  // 優先順（上から順に最初に見つかったものを採用）
  const preferences = [
    v => v.name === "Google US English",
    v => v.name === "Google UK English Female",
    v => v.name === "Google UK English Male",
    v => /^Google /.test(v.name) && /^en/i.test(v.lang),
    v => v.name === "Samantha" && /^en/i.test(v.lang),
    v => v.name === "Alex" && /^en/i.test(v.lang),
    v => v.name === "Daniel" && /^en/i.test(v.lang),
    v => v.name === "Karen" && /^en/i.test(v.lang),
    v => /Microsoft.*(Aria|Jenny|Guy|Davis|Tony|Nancy)/i.test(v.name) && /^en/i.test(v.lang),
    v => /Microsoft.*(Zira|David|Mark|Hazel)/i.test(v.name) && /^en/i.test(v.lang),
    v => /^en-US/i.test(v.lang) && v.localService === false,   // クラウド合成（高品質寄り）
    v => /^en/i.test(v.lang) && v.localService === false,
    v => /^en-US/i.test(v.lang),
    v => /^en-GB/i.test(v.lang),
    v => /^en/i.test(v.lang),
  ];

  for (const pred of preferences) {
    const match = voices.find(pred);
    if (match) return match;
  }
  return null;
}

function refreshSelectedVoice() {
  selectedVoice = pickBestVoice();
  if (selectedVoice) {
    console.info("[MustDevEigo] TTS voice:", selectedVoice.name, "(" + selectedVoice.lang + ")");
  }
}

// 音声リストは非同期で読み込まれることがあるため、voiceschanged で再選択する
if (ttsAvailable) {
  refreshSelectedVoice();
  if ("onvoiceschanged" in window.speechSynthesis) {
    window.speechSynthesis.addEventListener("voiceschanged", refreshSelectedVoice);
  }
}

function speakWord(word) {
  if (!ttsAvailable || !word) return;
  try {
    window.speechSynthesis.cancel();
    if (!selectedVoice) refreshSelectedVoice();
    const u = new SpeechSynthesisUtterance(word);
    if (selectedVoice) {
      u.voice = selectedVoice;
      u.lang = selectedVoice.lang;
    } else {
      u.lang = "en-US";
    }
    u.rate = 0.95;
    u.pitch = 1.0;
    u.volume = 1.0;
    window.speechSynthesis.speak(u);
  } catch (e) {
    console.warn("speak failed:", e);
  }
}

// 発音ボタンを生成（TTS未対応環境では null を返す）
function makeSpeakButton(word, opts) {
  if (!ttsAvailable) return null;
  opts = opts || {};
  const btn = el("button", {
    class: "speak-btn" + (opts.size === "lg" ? " speak-btn-lg" : ""),
    type: "button",
    title: "発音を聞く",
    "aria-label": word + " の発音を聞く",
  });
  btn.innerHTML = SPEAKER_ICON_SVG;
  btn.addEventListener("click", (ev) => {
    ev.stopPropagation();
    speakWord(word);
  });
  return btn;
}
const MOON_ICON_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

function applyThemeUI(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const icon = document.getElementById("theme-icon");
  if (icon) icon.innerHTML = theme === "dark" ? SUN_ICON_SVG : MOON_ICON_SVG;
  const btn = document.getElementById("theme-toggle");
  if (btn) {
    const next = theme === "dark" ? "ライトモード" : "ダークモード";
    btn.setAttribute("title", next + "に切り替え");
    btn.setAttribute("aria-label", next + "に切り替え");
  }
}

function applyTheme(theme) {
  applyThemeUI(theme);
  dataCache.theme = theme;
  idbSet("theme", theme).catch(e => console.warn("Failed to persist theme:", e));
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(current === "dark" ? "light" : "dark");
}

// ============================================================
// 初期化
// ============================================================
// ============================================================
// ユーザー名モーダル
// ============================================================
function refreshUserBtn() {
  const btn = document.getElementById("user-btn");
  const nameEl = document.getElementById("user-btn-name");
  if (!btn || !nameEl) return;
  if (dataCache.userName) {
    btn.classList.remove("hidden");
    nameEl.textContent = dataCache.userName + " さん";
  } else {
    btn.classList.add("hidden");
    nameEl.textContent = "";
  }
}

// 初回時の強制入力モード or 編集モードでモーダルを開く
function openUserModal(opts) {
  const required = !!(opts && opts.required);
  const modal = document.getElementById("user-modal");
  const input = document.getElementById("user-name-input");
  const cancelBtn = document.getElementById("user-modal-cancel");
  const title = document.getElementById("user-modal-title");
  const desc = document.getElementById("user-modal-desc");
  if (!modal || !input) return;
  input.value = dataCache.userName || "";
  if (required) {
    title.textContent = "ようこそ";
    desc.innerHTML = "演習結果の出力に使うお名前を教えてください。<br>後から変更できます。";
    cancelBtn.hidden = true;
  } else {
    title.textContent = "お名前の変更";
    desc.innerHTML = "演習結果の出力で使うお名前を変更します。";
    cancelBtn.hidden = false;
  }
  modal.classList.remove("hidden");
  setTimeout(() => input.focus(), 30);
}
function closeUserModal() {
  const modal = document.getElementById("user-modal");
  if (modal) modal.classList.add("hidden");
}

async function init() {
  // デフォルトはライト固定。OS設定は採用せず、利用者が切替を保存した場合のみその設定を適用する。
  applyThemeUI("light");

  await migrateFromLocalStorage();
  await loadAllFromIDB();

  applyThemeUI(dataCache.theme || "light");

  showScreen("home");
  refreshUserBtn();

  // 初回または2週間経過でリセットされた場合 → 強制でユーザー名入力モーダル
  if (!dataCache.userName) {
    openUserModal({ required: true });
  }

  document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  document.getElementById("nav-home").addEventListener("click", () => showScreen("home"));
  document.getElementById("nav-wordbook").addEventListener("click", () => showScreen("wordbook"));

  // ユーザー名ボタン → 編集モーダル
  document.getElementById("user-btn").addEventListener("click", () => openUserModal({ required: false }));

  // モーダル: 保存
  document.getElementById("user-modal-save").addEventListener("click", async () => {
    const input = document.getElementById("user-name-input");
    const value = (input && input.value || "").trim();
    if (!value) {
      input.focus();
      return;
    }
    await saveUserName(value);
    refreshUserBtn();
    closeUserModal();
  });
  // モーダル: キャンセル
  document.getElementById("user-modal-cancel").addEventListener("click", () => {
    if (!dataCache.userName) return; // 初回はキャンセル不可
    closeUserModal();
  });
  // モーダル: Enterで保存
  document.getElementById("user-name-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("user-modal-save").click();
    } else if (e.key === "Escape") {
      if (dataCache.userName) closeUserModal();
    }
  });

  document.addEventListener("keydown", (e) => {
    const quizVisible = !document.getElementById("screen-quiz").classList.contains("hidden");
    if (!quizVisible) return;
    if (e.key >= "1" && e.key <= "4") {
      const idx = parseInt(e.key, 10) - 1;
      if (state.awaitingNext) return;
      const btns = document.querySelectorAll("#quiz-content .choice");
      if (btns[idx]) btns[idx].click();
    } else if (e.key === "Enter" && state.awaitingNext) {
      e.preventDefault();
      goNext();
    }
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
