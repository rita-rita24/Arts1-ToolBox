function renderWordbookList() {
  const listEl = document.getElementById("wb-list");
  const sumEl = document.getElementById("wb-summary");
  if (!listEl || !sumEl) return;
  listEl.innerHTML = "";

  const source = getCategorySource(wbState.catId);
  // 表示用の (word, displayMeaning) を作る。元 item は解説ペイン用に保持。
  const rows = source.map(item => {
    let display;
    if (item._kind === "abbr") display = item.full + "（の略）";
    else if (item._kind === "acronym") display = item.full;
    else display = item.meaning;
    return { word: item.word, display, item };
  });

  // 検索フィルタ
  const q = wbState.search.trim().toLowerCase();
  const filtered = q ? rows.filter(r =>
    r.word.toLowerCase().includes(q) || r.display.toLowerCase().includes(q)
  ) : rows;

  // 単語アルファベット順にソート
  filtered.sort((a, b) => a.word.localeCompare(b.word));

  const explainAll = source.filter(item => hasExplanation(item)).length;

  sumEl.innerHTML = "";
  sumEl.appendChild(document.createTextNode("表示中: "));
  sumEl.appendChild(el("strong", null, String(filtered.length)));
  sumEl.appendChild(document.createTextNode(" / 全 "));
  sumEl.appendChild(el("strong", null, String(rows.length)));
  sumEl.appendChild(document.createTextNode(" 語"));
  if (explainAll > 0) {
    sumEl.appendChild(document.createTextNode("　・　解説あり "));
    sumEl.appendChild(el("strong", null, String(explainAll)));
    sumEl.appendChild(document.createTextNode(" 語"));
  }

  if (filtered.length === 0) {
    listEl.appendChild(el("div", { class: "wb-empty" }, "該当する単語が見つかりません。"));
    return;
  }

  filtered.forEach(r => {
    const row = document.createElement("details");
    row.className = "wb-row";
    const summary = document.createElement("summary");
    summary.appendChild(el("div", { class: "wb-word" }, [
      el("span", { class: "headword-row" }, [
        el("span", null, r.word),
        makeSpeakButton(r.word),
      ]),
    ]));
    summary.appendChild(el("div", { class: "wb-meaning" }, r.display));
    if (hasExplanation(r.item)) {
      summary.appendChild(el("span", { class: "wb-explain-mark" }, "解説"));
    } else {
      summary.appendChild(el("span", null, ""));
    }
    row.appendChild(summary);

    const detail = el("div", { class: "wb-row-detail" });
    // 開いた時に遅延描画
    row.addEventListener("toggle", () => {
      if (!row.open || detail.hasChildNodes()) return;
      const pane = renderExplanation(r.item, { compact: true });
      if (pane) detail.appendChild(pane);
      else detail.appendChild(el("p", { class: "wb-row-detail-empty" }, "この語の解説は順次追加予定です。"));
    });
    row.appendChild(detail);
    listEl.appendChild(row);
  });
}

// ============================================================
// 演習開始
// ============================================================
function startQuiz(override) {
  const sel = override || getLastSelection();
  const source = getCategorySource(sel.catId);
  if (source.length === 0) {
    showNotice("この分野には出題できる語がありません。別の分野を選んでください。", "出題できません");
    return;
  }
  const ordered = sel.shuffle ? shuffleArray(source) : source.slice();
  const limit = sel.count === "all" ? ordered.length : Math.min(parseInt(sel.count, 10), ordered.length);
  const items = ordered.slice(0, limit);

  state.questions = items.map(item => buildQuestion(item, source));
  state.currentIdx = 0;
  state.correctCount = 0;
  state.answers = [];
  state.awaitingNext = false;
  state.selectedCategory = sel.catId;
  state.mistakeMode = false;
  state.confusableMode = false;
  saveLastSelection({ catId: sel.catId, count: sel.count, shuffle: sel.shuffle });

  showScreen("quiz");
  renderQuestion();
}

// 類語識別モード：confusables を Union-Find でグループ化
function buildConfusableGroups() {
  const parent = {};
  function find(w) {
    if (parent[w] === undefined) { parent[w] = w; return w; }
    if (parent[w] === w) return w;
    parent[w] = find(parent[w]);
    return parent[w];
  }
  function union(a, b) {
    const ra = find(a), rb = find(b);
    if (ra !== rb) parent[ra] = rb;
  }
  const all = getCategorySource("all");
  all.forEach(item => {
    if (Array.isArray(item.confusables)) {
      item.confusables.forEach(c => {
        if (c && c.word) union(item.word, c.word);
      });
    }
  });
  const groupsMap = {};
  Object.keys(parent).forEach(w => {
    const r = find(w);
    if (!groupsMap[r]) groupsMap[r] = [];
    groupsMap[r].push(w);
  });
  return Object.values(groupsMap).filter(g => g.length >= 2);
}

function buildConfusableQuestion(targetWord, group) {
  const found = findWordItem(targetWord);
  if (!found || !found.item || typeof found.item.useCase !== "string") return null;
  const useCase = found.item.useCase.trim();
  if (!useCase) return null;
  const others = group.filter(w => w !== targetWord);
  let distractors = shuffleArray(others).slice(0, 3);
  if (distractors.length < 3) {
    // 類語が足りない場合はカテゴリ全体からランダムに補完（重複と正解は除外）
    const pool = getCategorySource("all").map(x => x.word);
    while (distractors.length < 3) {
      const candidate = pool[Math.floor(Math.random() * pool.length)];
      if (candidate !== targetWord && !distractors.includes(candidate)) distractors.push(candidate);
    }
  }
  const choices = shuffleArray([targetWord].concat(distractors));
  return {
    word: targetWord,
    prompt: useCase,
    choices,
    correctIndex: choices.indexOf(targetWord),
    answer: targetWord,
    kind: "confusable",
    _source: found.item,
  };
}

// 類語識別モードで出題開始（useCase を持つ語のみ対象）
function startConfusableQuiz() {
  const groups = buildConfusableGroups();
  if (groups.length === 0) {
    showNotice("類語データを持つ語がまだありません。\n解説（Wave 1）が拡充されると利用できるようになります。", "類語識別モード");
    return;
  }
  const candidates = [];
  groups.forEach(group => {
    group.forEach(w => {
      const found = findWordItem(w);
      if (found && found.item && typeof found.item.useCase === "string" && found.item.useCase.trim()) {
        candidates.push({ targetWord: w, group });
      }
    });
  });
  if (candidates.length === 0) {
    showNotice("useCase 付きの語が必要です。Wave 1 シードを拡充するとモードが有効になります。", "類語識別モード");
    return;
  }
  const ordered = shuffleArray(candidates).slice(0, Math.min(10, candidates.length));
  const questions = ordered.map(c => buildConfusableQuestion(c.targetWord, c.group)).filter(Boolean);
  if (questions.length === 0) {
    showNotice("出題できる類語問題がありません。", "類語識別モード");
    return;
  }
  state.questions = questions;
  state.currentIdx = 0;
  state.correctCount = 0;
  state.answers = [];
  state.awaitingNext = false;
  state.selectedCategory = "confusable";
  state.mistakeMode = false;
  state.confusableMode = true;
  showScreen("quiz");
  renderQuestion();
}

// 苦手だけを出題する（誤答リストから抽出）
function startMistakeQuiz() {
  const mistakes = getMistakeItems();
  if (mistakes.length === 0) {
    showNotice("苦手として記録された単語はまだありません。演習で間違えた語が苦手リストに追加されます。", "苦手はまだありません");
    return;
  }
  const allSource = getCategorySource("all");
  const ordered = shuffleArray(mistakes);
  state.questions = ordered.map(item => buildQuestion(item, allSource));
  state.currentIdx = 0;
  state.correctCount = 0;
  state.answers = [];
  state.awaitingNext = false;
  state.selectedCategory = "mistake";
  state.mistakeMode = true;
  state.confusableMode = false;

  showScreen("quiz");
  renderQuestion();
}

// ============================================================
// 出題
// ============================================================
function renderQuestion() {
  const q = state.questions[state.currentIdx];
  const root = document.getElementById("quiz-content");
  root.innerHTML = "";
  state.awaitingNext = false;

  const isConfusable = q.kind === "confusable";

  const pct = (state.currentIdx / state.questions.length) * 100;
  const card = el("div", { class: "block" }, [
    el("div", { class: "quiz-progress" }, [
      el("div", { class: "fill", style: { width: pct + "%" } }),
    ]),
    el("div", { class: "quiz-meta" }, [
      el("span", null, `第 ${state.currentIdx + 1} 問 / 全 ${state.questions.length} 問`),
      el("span", { class: "score" }, `正解 ${state.correctCount} / ${state.answers.length}`),
    ]),
    isConfusable
      ? el("div", { class: "headword headword-confusable" }, [
          el("span", { class: "confusable-badge" }, "類語識別"),
        ])
      : el("div", { class: "headword" }, [
          el("span", { class: "headword-row" }, [
            el("span", null, q.word),
            makeSpeakButton(q.word, { size: "lg" }),
          ]),
        ]),
    isConfusable
      ? el("p", { class: "headword-prompt" }, "次の文脈で適切な語は？")
      : el("p", { class: "headword-prompt" }, q.prompt),
    isConfusable ? el("p", { class: "confusable-context" }, q.prompt) : null,
    (() => {
      const choices = el("div", { class: "choices" });
      q.choices.forEach((c, i) => {
        const btn = el("button", { class: "choice", type: "button", dataset: { idx: String(i) } }, [
          el("span", { class: "choice-num" }, String(i + 1)),
          el("span", { class: "choice-text" }, c),
        ]);
        btn.addEventListener("click", () => handleChoice(i));
        choices.appendChild(btn);
      });
      return choices;
    })(),
    el("div", { class: "feedback", id: "feedback" }),
    el("div", { class: "quiz-actions" }, [
      (() => {
        const b = el("button", { class: "btn", id: "quit-btn", type: "button" }, "中断");
        b.addEventListener("click", () => {
          if (state.answers.length === 0 || confirm("演習を中断してホームに戻りますか？")) {
            showScreen("home");
          }
        });
        return b;
      })(),
      (() => {
        const b = el("button", { class: "btn btn-primary", id: "next-btn", type: "button", disabled: true }, "次の問へ →");
        b.addEventListener("click", goNext);
        return b;
      })(),
    ]),
    el("p", { class: "kb-hint" }, [
      el("span", { class: "kbd" }, "1"),
      "〜",
      el("span", { class: "kbd" }, "4"),
      "で選択 / ",
      el("span", { class: "kbd" }, "5"),
      "で発音 / ",
      el("span", { class: "kbd" }, "Enter"),
      "で次へ",
    ]),
  ]);
  root.appendChild(card);
}

// ============================================================
// 解答処理
// ============================================================
function handleChoice(idx) {
  if (state.awaitingNext) return;
  const q = state.questions[state.currentIdx];
  const isCorrect = idx === q.correctIndex;
  if (isCorrect) state.correctCount++;
  state.answers.push({ word: q.word, picked: idx, correct: q.correctIndex, isCorrect, answer: q.answer, choices: q.choices, kind: q.kind });
  state.awaitingNext = true;
  // 単語別の正誤を記録（苦手復習で利用）
  recordAnswerStat(q.word, q.kind, isCorrect);

  document.querySelectorAll("#quiz-content .choice").forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correctIndex) btn.classList.add("correct");
    else if (i === idx) btn.classList.add("incorrect");
  });

  const fb = document.getElementById("feedback");
  if (fb) {
    fb.innerHTML = "";
    fb.classList.add("show", isCorrect ? "correct" : "incorrect");
    fb.appendChild(el("strong", null, isCorrect ? "正解" : "不正解"));
    fb.appendChild(document.createTextNode("  "));
    fb.appendChild(document.createTextNode(q.word + " ＝ " + q.answer));
  }

  // v2: 解説ペインの差し込み（解説データを持たない語ではスキップされる）
  if (fb && fb.parentNode) {
    const old = fb.parentNode.querySelector(".explain-pane");
    if (old) old.remove();
    const explain = renderExplanation(q._source);
    if (explain) fb.parentNode.insertBefore(explain, fb.nextSibling);
  }

  const meta = document.querySelector("#quiz-content .quiz-meta .score");
  if (meta) meta.textContent = `正解 ${state.correctCount} / ${state.answers.length}`;

  const nextBtn = document.getElementById("next-btn");
  if (nextBtn) { nextBtn.disabled = false; nextBtn.focus(); }
}

// ============================================================
// 次へ / 終了
// ============================================================
function goNext() {
  if (!state.awaitingNext) return;
  state.currentIdx++;
  if (state.currentIdx >= state.questions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

async function finishQuiz() {
  const total = state.answers.length;
  const correct = state.correctCount;
  const rate = total > 0 ? Math.round(correct / total * 100) : 0;
  const isMistake = state.mistakeMode === true;
  const isConfusable = state.confusableMode === true;
  let cat;
  if (isMistake)        cat = { id: "mistake",    label: "苦手復習",   desc: "" };
  else if (isConfusable) cat = { id: "confusable", label: "類語識別", desc: "" };
  else                   cat = getCategoryById(state.selectedCategory);

  await recordHistorySession({
    timestamp: Date.now(),
    categoryId: cat.id,
    categoryLabel: cat.label,
    total,
    correct,
  });

  // 苦手復習モードでの「克服した語」をカウント
  let resolved = 0;
  if (isMistake) {
    state.answers.forEach(a => { if (a.isCorrect) resolved++; });
  }

  lastFinishedInfo = { total, correct, rate, cat, isMistake, isConfusable, resolved };
  renderResult();
}

function renderResult() {
  const root = document.getElementById("result-content");
  root.innerHTML = "";
  const info = lastFinishedInfo;

  const summary = el("div", { class: "block" }, [
    el("p", { class: "result-headline" }, info.cat.label + " の結果"),
    el("p", { class: "result-rate" }, info.rate + "%"),
    el("p", { class: "result-correct" }, `${info.correct} / ${info.total} 問 正解`),
    info.isMistake ? el("p", { class: "result-note" }, info.resolved + " 語を克服 · 残った苦手は次回も出題されます") : null,
  ]);
  root.appendChild(summary);

  const reviewCard = el("div", { class: "block" }, [
    el("p", { class: "section-title" }, "振り返り"),
  ]);
  const list = el("div", { class: "review-list" });
  state.answers.forEach(a => {
    const found = findWordItem(a.word);
    const sourceItem = found ? found.item : null;
    const explainBtn = sourceItem && hasExplanation(sourceItem)
      ? (() => {
          const b = el("button", { class: "review-explain-btn", type: "button" }, "解説");
          b.addEventListener("click", () => openExplainModal(sourceItem));
          return b;
        })()
      : null;
    list.appendChild(el("div", { class: "review-row" }, [
      el("span", { class: "review-mark " + (a.isCorrect ? "ok" : "ng") }, a.isCorrect ? "○" : "×"),
      el("span", { class: "review-body" }, [
        el("span", { class: "review-headword" }, a.word),
        el("span", { class: "review-meaning" }, "＝ " + a.answer),
        a.isCorrect ? null : el("span", { class: "review-picked" }, a.choices[a.picked] || "—"),
        explainBtn,
      ]),
    ]));
  });
  reviewCard.appendChild(list);
  root.appendChild(reviewCard);

  const actions = el("div", { class: "result-actions" }, [
    (() => {
      const b = el("button", { class: "btn", type: "button" }, "← ホームに戻る");
      b.addEventListener("click", () => showScreen("home"));
      return b;
    })(),
    (() => {
      const isMistake = info.isMistake;
      const isConfusable = info.isConfusable;
      const label = isMistake ? "苦手をもう一度 →" : (isConfusable ? "類語識別をもう一度 →" : "もう一度 →");
      const b = el("button", { class: "btn btn-primary", type: "button" }, label);
      b.addEventListener("click", () => {
        if (isMistake) startMistakeQuiz();
        else if (isConfusable) startConfusableQuiz();
        else startQuiz();
      });
      return b;
    })(),
  ]);
  root.appendChild(actions);

  // 補助リンク
  const subActions = el("div", { class: "sub-actions" }, [
    (() => {
      const b = el("button", { class: "btn-link", type: "button" }, "結果をHTMLで保存");
      b.addEventListener("click", exportSessionHTML);
      return b;
    })(),
    (() => {
      const b = el("button", { class: "btn-link", type: "button" }, "単語帳で確認");
      b.addEventListener("click", () => {
        wbState.catId = state.selectedCategory;
        wbState.search = "";
        showScreen("wordbook");
      });
      return b;
    })(),
  ]);
  root.appendChild(subActions);

  showScreen("result");
}

// ============================================================
// テーマ
// ============================================================
// サン / ムーンの SVG アイコン。クリックで切り替わる先を視覚化する:
// - 現在 light → 月アイコン（クリックで dark に切り替え）
// - 現在 dark  → 太陽アイコン（クリックで light に切り替え）
const SUN_ICON_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>';

// 音声読み上げ（Web Speech API）
const SPEAKER_ICON_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';

const ttsAvailable = typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";

// 利用可能な英語音声から最も自然なものを選ぶ。
// 音声は OS / ブラウザ依存で品質に大きく差があり、espeak のような合成は非自然なため、
// より自然な Google / Apple / Microsoft の声を優先して選択する。
let selectedVoice = null;

function pickBestVoice() {
  if (!ttsAvailable) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  if (!voices.length) return null;

  // 優先順（上から順に最初に見つかったものを採用）
  const preferences = [
    v => v.name === "Google US English",
    v => v.name === "Google UK English Female",
    v => v.name === "Google UK English Male",
    v => /^Google /.test(v.name) && /^en/i.test(v.lang),
    v => v.name === "Samantha" && /^en/i.test(v.lang),
    v => v.name === "Alex" && /^en/i.test(v.lang),
    v => v.name === "Daniel" && /^en/i.test(v.lang),
    v => v.name === "Karen" && /^en/i.test(v.lang),
    v => /Microsoft.*(Aria|Jenny|Guy|Davis|Tony|Nancy)/i.test(v.name) && /^en/i.test(v.lang),
    v => /Microsoft.*(Zira|David|Mark|Hazel)/i.test(v.name) && /^en/i.test(v.lang),
    v => /^en-US/i.test(v.lang) && v.localService === false,   // クラウド合成（高品質寄り）
    v => /^en/i.test(v.lang) && v.localService === false,
    v => /^en-US/i.test(v.lang),
    v => /^en-GB/i.test(v.lang),
    v => /^en/i.test(v.lang),
  ];

  for (const pred of preferences) {
    const match = voices.find(pred);
    if (match) return match;
  }
  return null;
}

function refreshSelectedVoice() {
  selectedVoice = pickBestVoice();
  if (selectedVoice) {
    console.info("[MustDevEigo] TTS voice:", selectedVoice.name, "(" + selectedVoice.lang + ")");
  }
}

// 音声リストは非同期で読み込まれることがあるため、voiceschanged で再選択する
if (ttsAvailable) {
  refreshSelectedVoice();
  if ("onvoiceschanged" in window.speechSynthesis) {
    window.speechSynthesis.addEventListener("voiceschanged", refreshSelectedVoice);
  }
}

function speakWord(word) {
  if (!ttsAvailable || !word) return;
  try {
    window.speechSynthesis.cancel();
    if (!selectedVoice) refreshSelectedVoice();
    const u = new SpeechSynthesisUtterance(word);
    if (selectedVoice) {
      u.voice = selectedVoice;
      u.lang = selectedVoice.lang;
    } else {
      u.lang = "en-US";
    }
    u.rate = 0.95;
    u.pitch = 1.0;
    u.volume = 1.0;
    window.speechSynthesis.speak(u);
  } catch (e) {
    console.warn("speak failed:", e);
  }
}

// 発音ボタンを生成（TTS未対応環境では null を返す）
function makeSpeakButton(word, opts) {
  if (!ttsAvailable) return null;
  opts = opts || {};
  const btn = el("button", {
    class: "speak-btn" + (opts.size === "lg" ? " speak-btn-lg" : ""),
    type: "button",
    title: "発音を聞く",
    "aria-label": word + " の発音を聞く",
  });
  btn.innerHTML = SPEAKER_ICON_SVG;
  btn.addEventListener("click", (ev) => {
    ev.stopPropagation();
    speakWord(word);
  });
  return btn;
}
const MOON_ICON_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

function applyThemeUI(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const icon = document.getElementById("theme-icon");
  if (icon) icon.innerHTML = theme === "dark" ? SUN_ICON_SVG : MOON_ICON_SVG;
  const btn = document.getElementById("theme-toggle");
  if (btn) {
    const next = theme === "dark" ? "ライトモード" : "ダークモード";
    btn.setAttribute("title", next + "に切り替え");
    btn.setAttribute("aria-label", next + "に切り替え");
  }
}

function applyTheme(theme) {
  applyThemeUI(theme);
  dataCache.theme = theme;
  idbSet("theme", theme).catch(e => console.warn("Failed to persist theme:", e));
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(current === "dark" ? "light" : "dark");
}

// ============================================================
// 初期化
// ============================================================
// ============================================================
// ユーザー名モーダル
// ============================================================
function refreshUserBtn() {
  const btn = document.getElementById("user-btn");
  const nameEl = document.getElementById("user-btn-name");
  if (!btn || !nameEl) return;
  if (dataCache.userName) {
    btn.classList.remove("hidden");
    nameEl.textContent = dataCache.userName + " さん";
  } else {
    btn.classList.add("hidden");
    nameEl.textContent = "";
  }
}

// 初回時の強制入力モード or 編集モードでモーダルを開く
function openUserModal(opts) {
  const required = !!(opts && opts.required);
  const modal = document.getElementById("user-modal");
  const input = document.getElementById("user-name-input");
  const cancelBtn = document.getElementById("user-modal-cancel");
  const title = document.getElementById("user-modal-title");
  const desc = document.getElementById("user-modal-desc");
  if (!modal || !input) return;
  input.value = dataCache.userName || "";
  if (required) {
    title.textContent = "ようこそ";
    desc.innerHTML = "演習結果の出力に使うお名前を教えてください。<br>後から変更できます。";
    cancelBtn.hidden = true;
  } else {
    title.textContent = "お名前の変更";
    desc.innerHTML = "演習結果の出力で使うお名前を変更します。";
    cancelBtn.hidden = false;
  }
  modal.classList.remove("hidden");
  setTimeout(() => input.focus(), 30);
}
function closeUserModal() {
  const modal = document.getElementById("user-modal");
  if (modal) modal.classList.add("hidden");
}

// 共通通知モーダル（alert() の代替）
function showNotice(body, title) {
  const modal = document.getElementById("notice-modal");
  const t = document.getElementById("notice-modal-title");
  const b = document.getElementById("notice-modal-body");
  if (!modal || !b) { console.warn("notice modal missing"); return; }
  t.textContent = title || "お知らせ";
  b.textContent = body || "";
  modal.classList.remove("hidden");
  setTimeout(() => {
    const ok = document.getElementById("notice-modal-ok");
    if (ok) ok.focus();
  }, 30);
}
function closeNotice() {
  const modal = document.getElementById("notice-modal");
  if (modal) modal.classList.add("hidden");
}

async function init() {
  // デフォルトはライト固定。OS設定は採用せず、利用者が切替を保存した場合のみその設定を適用する。
  applyThemeUI("light");

  await migrateFromLocalStorage();
  await loadAllFromIDB();

  applyThemeUI(dataCache.theme || "light");

  showScreen("home");
  refreshUserBtn();

  // 初回または2週間経過でリセットされた場合 → 強制でユーザー名入力モーダル
  if (!dataCache.userName) {
    openUserModal({ required: true });
  }

  document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  document.getElementById("nav-home").addEventListener("click", () => showScreen("home"));
  document.getElementById("nav-wordbook").addEventListener("click", () => showScreen("wordbook"));

  // ユーザー名ボタン → 編集モーダル
  document.getElementById("user-btn").addEventListener("click", () => openUserModal({ required: false }));

  // モーダル: 保存
  document.getElementById("user-modal-save").addEventListener("click", async () => {
    const input = document.getElementById("user-name-input");
    const value = (input && input.value || "").trim();
    if (!value) {
      input.focus();
      return;
    }
    await saveUserName(value);
    refreshUserBtn();
    closeUserModal();
  });
  // モーダル: キャンセル
  document.getElementById("user-modal-cancel").addEventListener("click", () => {
    if (!dataCache.userName) return; // 初回はキャンセル不可
    closeUserModal();
  });
  // モーダル: Enterで保存
  document.getElementById("user-name-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("user-modal-save").click();
    } else if (e.key === "Escape") {
      if (dataCache.userName) closeUserModal();
    }
  });

  // 通知モーダル: OK / Esc / 背景クリックで閉じる
  document.getElementById("notice-modal-ok").addEventListener("click", closeNotice);
  document.getElementById("notice-modal").addEventListener("click", (e) => {
    if (e.target.id === "notice-modal") closeNotice();
  });
  document.addEventListener("keydown", (e) => {
    const noticeOpen = !document.getElementById("notice-modal").classList.contains("hidden");
    if (noticeOpen && (e.key === "Escape" || e.key === "Enter")) {
      e.preventDefault();
      closeNotice();
    }
  });

  // 解説モーダル: 閉じる / Esc / 背景クリックで閉じる
  document.getElementById("explain-modal-close").addEventListener("click", closeExplainModal);
  document.getElementById("explain-modal").addEventListener("click", (e) => {
    if (e.target.id === "explain-modal") closeExplainModal();
  });
  document.addEventListener("keydown", (e) => {
    const open = !document.getElementById("explain-modal").classList.contains("hidden");
    if (open && e.key === "Escape") {
      e.preventDefault();
      closeExplainModal();
    }
  });

  document.addEventListener("keydown", (e) => {
    const quizVisible = !document.getElementById("screen-quiz").classList.contains("hidden");
    if (!quizVisible) return;
    if (e.key >= "1" && e.key <= "4") {
      const idx = parseInt(e.key, 10) - 1;
      if (state.awaitingNext) return;
      const btns = document.querySelectorAll("#quiz-content .choice");
      if (btns[idx]) btns[idx].click();
    } else if (e.key === "5") {
      // 出題中の単語を発音（類語識別モードは答えを伏せるため発音不可）
      const q = state.questions[state.currentIdx];
      if (q && q.word && q.kind !== "confusable") speakWord(q.word);
    } else if (e.key === "Enter" && state.awaitingNext) {
      e.preventDefault();
      goNext();
    }
  });
}

// ============================================================
// データ検証 (v2)
// 起動時に整合性チェックして DevTools コンソールへ警告を出す。
// 主な検査:
//  - confusables[].word が DATA に存在するか（双方向リンク切れ防止）
//  - useCase が 80 字以内か
//  - codeExample.code が 30 行以内か
//  - confusables の件数が 3 以下か
// ============================================================
function validateDataset() {
  const issues = [];
  const allWords = new Set();
  const cats = ["prereq", "basic", "advanced", "abbr", "acronym"];
  cats.forEach(cat => {
    if (Array.isArray(DATA[cat])) DATA[cat].forEach(item => allWords.add(item.word));
  });

  function check(item) {
    if (typeof item.useCase === "string" && item.useCase.length > 80) {
      issues.push(item.word + ": useCase が 80 字超 (" + item.useCase.length + ")");
    }
    if (item.codeExample && typeof item.codeExample.code === "string") {
      const lines = item.codeExample.code.split("\n").length;
      if (lines > 30) {
        issues.push(item.word + ": codeExample.code が 30 行超 (" + lines + ")");
      }
    }
    if (Array.isArray(item.confusables)) {
      if (item.confusables.length > 3) {
        issues.push(item.word + ": confusables が 3 件超 (" + item.confusables.length + ")");
      }
      item.confusables.forEach(c => {
        if (!c || typeof c.word !== "string") return;
        if (!allWords.has(c.word)) {
          issues.push(item.word + " → " + c.word + ": confusable 参照先が DATA に存在しない");
        }
        if (typeof c.diff === "string" && c.diff.length > 40) {
          issues.push(item.word + " → " + c.word + ": diff が 40 字超 (" + c.diff.length + ")");
        }
      });
    }
  }

  cats.forEach(cat => {
    if (Array.isArray(DATA[cat])) DATA[cat].forEach(check);
  });

  return issues;
}

function logValidationResults() {
  try {
    const issues = validateDataset();
    if (issues.length > 0) {
      console.warn("[MustDevEigo] dataset validation found " + issues.length + " issue(s):");
      issues.forEach(msg => console.warn("  ・ " + msg));
    } else {
      console.info("[MustDevEigo] dataset validation: OK");
    }
  } catch (e) {
    console.warn("[MustDevEigo] validateDataset failed:", e);
  }
}

// DevTools 確認用に名前空間を公開
root.MustDevEigo = {
  version: "2.0.0",
  Data: { DATA, CATEGORIES, getCategorySource, findWordItem, hasExplanation, validateDataset },
  Quiz: { state, startQuiz, startMistakeQuiz, buildQuestion },
  Storage: { dataCache, openDB, idbGet, idbSet, idbDelete, idbClear, loadAllFromIDB },
  UI: { showScreen, renderHome, renderWordbook, renderQuestion },
  Explain: { renderExplanation, renderCodeExample, renderConfusables, openExplainModal, highlightCode, showToast },
  App: { init },
};

document.addEventListener("DOMContentLoaded", () => {
  init();
  // 検証はメインスレッドを邪魔しないよう次フレームで
  setTimeout(logValidationResults, 0);
});

})(window);
