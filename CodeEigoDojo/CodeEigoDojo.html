<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeEigoDojo — A Vocabulary for Engineers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Spectral+SC:wght@500;600&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeEigoDojo — エンジニア必須英単語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="light"] {
  --bg: #f7f7f8;
  --bg-card: #ffffff;
  --bg-soft: #f1f1f3;
  --bg-soft-2: #e5e7eb;
  --text: #111827;
  --text-sub: #4b5563;
  --text-mute: #9ca3af;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --accent: #4f46e5;
  --accent-h: #4338ca;
  --accent-soft: #eef2ff;
  --accent-text: #312e81;
  --success: #16a34a;
  --success-bg: #dcfce7;
  --success-text: #14532d;
  --danger: #dc2626;
  --danger-bg: #fee2e2;
  --danger-text: #7f1d1d;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.02);
}
:root[data-theme="dark"] {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-soft: #1e293b;
  --bg-soft-2: #334155;
  --text: #f1f5f9;
  --text-sub: #cbd5e1;
  --text-mute: #94a3b8;
  --border: #334155;
  --border-strong: #475569;
  --accent: #818cf8;
  --accent-h: #a5b4fc;
  --accent-soft: #1e1b4b;
  --accent-text: #c7d2fe;
  --success: #4ade80;
  --success-bg: #14532d;
  --success-text: #bbf7d0;
  --danger: #f87171;
  --danger-bg: #4a1f1c;
  --danger-text: #fca5a5;
  --shadow: 0 1px 2px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.7;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "palt";
}

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 16px 64px;
}

/* ヘッダー */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 4px 20px;
}
.brand {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.01em;
}
.brand em {
  font-style: normal;
  color: var(--text-mute);
  font-weight: 500;
  font-size: 12px;
  margin-left: 8px;
}
.app-actions { display: inline-flex; gap: 4px; }
.link-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-sub);
  font-family: inherit;
  font-size: 13px;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.link-btn:hover { background: var(--bg-soft); color: var(--text); }
.link-btn.active { background: var(--accent-soft); color: var(--accent-text); }

/* カード */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card-flat { box-shadow: none; }

.section-title {
  margin: 0 0 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sub);
  letter-spacing: 0.02em;
}
.muted { color: var(--text-mute); font-size: 13px; margin: 0; }

/* CTA */
.cta-card {
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.cta-info { flex: 1; min-width: 220px; }
.cta-eyebrow {
  font-size: 12px;
  color: var(--accent-text);
  margin: 0 0 6px;
  letter-spacing: 0.04em;
  font-weight: 700;
}
.cta-summary {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.cta-summary .sep {
  color: var(--text-mute);
  font-weight: 500;
  margin: 0 8px;
}

/* ボタン */
.btn {
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn:hover { background: var(--bg-soft); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-h); border-color: var(--accent-h); color: #fff; }
.btn-large {
  padding: 12px 26px;
  font-size: 15px;
  border-radius: 10px;
}
.btn-link {
  background: transparent;
  border: 0;
  color: var(--accent);
  font-size: 13px;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
}
.btn-link:hover { background: var(--accent-soft); }
.btn-link:disabled { color: var(--text-mute); cursor: not-allowed; opacity: 0.5; }

/* カテゴリーリスト（ホーム） */
.cat-list { display: grid; gap: 0; }
.cat-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--border);
  align-items: baseline;
  cursor: pointer;
  transition: background 0.12s;
}
.cat-row:first-child { border-top: 0; }
.cat-row:hover { background: var(--bg-soft); }
.cat-row.selected { background: var(--accent-soft); }
.cat-row .cat-name { font-weight: 700; font-size: 15px; padding-left: 6px; }
.cat-row .cat-name .desc { color: var(--text-mute); font-size: 12px; font-weight: 500; margin-left: 8px; }
.cat-row .cat-count {
  color: var(--text-sub);
  font-size: 13px;
  font-variant-numeric: tabular-nums lining-nums;
  white-space: nowrap;
  padding-right: 6px;
}
.cat-row .cat-mark {
  display: inline-block;
  width: 18px;
  text-align: center;
  color: var(--accent);
  font-weight: 700;
}

/* オプション行 */
.options-row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.options-row label { font-size: 13px; color: var(--text-sub); display: inline-flex; align-items: center; gap: 6px; }
.options-row select {
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 4px 8px;
  font-family: inherit;
  font-size: 13px;
}
.options-row input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

/* 履歴 */
.history-list { margin: 0; }
.history-row {
  display: grid;
  grid-template-columns: 88px 1fr auto;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--border);
  align-items: baseline;
  font-size: 13px;
}
.history-row:first-child { border-top: 0; }
.history-date { color: var(--text-mute); font-variant-numeric: tabular-nums lining-nums; }
.history-cat { color: var(--text); font-weight: 500; }
.history-stat {
  color: var(--accent);
  font-weight: 700;
  font-variant-numeric: tabular-nums lining-nums;
  white-space: nowrap;
}
.history-empty { color: var(--text-mute); font-size: 13px; padding: 6px 0; }

.data-actions { margin-top: 10px; display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }

.foot-link {
  text-align: center;
  margin: 14px 0 0;
}

/* 出題画面 */
.quiz-progress {
  height: 4px;
  background: var(--bg-soft-2);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 12px;
}
.quiz-progress > .fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width 0.3s;
}
.quiz-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 13px;
  color: var(--text-mute);
  margin-bottom: 18px;
  font-variant-numeric: tabular-nums lining-nums;
}
.quiz-meta .score { color: var(--text-sub); font-weight: 500; }
.headword {
  text-align: center;
  font-size: 44px;
  font-weight: 700;
  margin: 18px 0 4px;
  letter-spacing: -0.005em;
  word-break: break-word;
  line-height: 1.15;
}
.headword-prompt {
  text-align: center;
  color: var(--text-sub);
  font-size: 14px;
  margin: 0 0 22px;
}

.choices { display: grid; grid-template-columns: 1fr; gap: 10px; }
.choice {
  display: grid;
  grid-template-columns: 32px 1fr;
  gap: 12px;
  align-items: center;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  font-family: inherit;
  font-size: 16px;
  color: var(--text);
  text-align: left;
  transition: background 0.15s, border-color 0.15s;
}
.choice:hover:not(:disabled) { background: var(--bg-soft); border-color: var(--accent); }
.choice:disabled { cursor: not-allowed; }
.choice-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--bg-soft-2);
  color: var(--text-sub);
  font-weight: 700;
  font-size: 13px;
  font-variant-numeric: tabular-nums lining-nums;
}
.choice.correct {
  background: var(--success-bg);
  border-color: var(--success);
}
.choice.correct .choice-num { background: var(--success); color: #fff; }
.choice.incorrect {
  background: var(--danger-bg);
  border-color: var(--danger);
}
.choice.incorrect .choice-num { background: var(--danger); color: #fff; }

.feedback {
  display: none;
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 14px;
}
.feedback.show { display: block; }
.feedback.correct { background: var(--success-bg); color: var(--success-text); }
.feedback.incorrect { background: var(--danger-bg); color: var(--danger-text); }
.feedback strong { font-weight: 700; }

.quiz-actions {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.kb-hint {
  text-align: center;
  font-size: 11px;
  color: var(--text-mute);
  margin-top: 12px;
  letter-spacing: 0.04em;
}
.kbd {
  display: inline-block;
  padding: 1px 6px;
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  background: var(--bg-soft);
  border-radius: 4px;
  font-size: 11px;
  font-family: inherit;
  font-weight: 500;
  color: var(--text-sub);
  margin: 0 2px;
}

/* 結果画面 */
.result-headline {
  text-align: center;
  font-size: 16px;
  font-weight: 500;
  color: var(--text-sub);
  margin: 4px 0 4px;
}
.result-rate {
  text-align: center;
  font-size: 56px;
  font-weight: 700;
  color: var(--accent);
  margin: 4px 0 0;
  font-variant-numeric: tabular-nums lining-nums;
  line-height: 1;
}
.result-correct {
  text-align: center;
  font-size: 14px;
  color: var(--text-sub);
  margin: 8px 0 4px;
  font-variant-numeric: tabular-nums lining-nums;
}
.review-list { margin: 6px 0 0; }
.review-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--border);
  font-size: 14px;
  align-items: baseline;
}
.review-row:first-child { border-top: 0; }
.review-mark { font-weight: 700; text-align: center; }
.review-mark.ok { color: var(--success); }
.review-mark.ng { color: var(--danger); }
.review-headword { font-weight: 700; margin-right: 8px; }
.review-meaning { color: var(--text-sub); }
.review-picked {
  display: block;
  margin-top: 2px;
  font-size: 12px;
  color: var(--text-mute);
}
.review-picked::before { content: "選んだ: "; }

.result-actions { display: flex; gap: 10px; justify-content: space-between; margin-top: 18px; flex-wrap: wrap; }

/* 単語帳 */
.wb-toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.wb-toolbar select,
.wb-toolbar input[type="search"] {
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  padding: 8px 10px;
  font-family: inherit;
  font-size: 14px;
}
.wb-toolbar input[type="search"] { flex: 1; min-width: 180px; }
.wb-toolbar select { font-size: 13px; }

.wb-summary {
  font-size: 13px;
  color: var(--text-mute);
  margin: 4px 0 12px;
}
.wb-summary strong { color: var(--text); font-weight: 700; }

.wb-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
}
.wb-row {
  display: grid;
  grid-template-columns: minmax(120px, 200px) 1fr;
  gap: 16px;
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  align-items: baseline;
}
.wb-row:first-child { border-top: 0; }
.wb-row .wb-word {
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  word-break: break-word;
  font-variant-numeric: tabular-nums lining-nums;
}
.wb-row .wb-meaning {
  color: var(--text-sub);
  font-size: 14px;
}
.wb-empty {
  text-align: center;
  color: var(--text-mute);
  font-size: 13px;
  padding: 24px;
}

.wb-actions {
  display: flex;
  gap: 10px;
  justify-content: space-between;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

/* フッター */
.app-footer {
  text-align: center;
  font-size: 11px;
  color: var(--text-mute);
  margin-top: 28px;
  letter-spacing: 0.04em;
}
.app-footer p { margin: 0; }

.hidden { display: none !important; }

@media (max-width: 540px) {
  .headword { font-size: 36px; }
  .result-rate { font-size: 48px; }
  .wb-row { grid-template-columns: 1fr; gap: 4px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1 class="brand">CodeEigoDojo<em>エンジニア必須英単語の演習</em></h1>
    <div class="app-actions">
      <button class="link-btn" id="nav-home" type="button">演習</button>
      <button class="link-btn" id="nav-wordbook" type="button">単語帳</button>
      <button class="link-btn" id="theme-toggle" type="button"><span id="theme-label">明るい</span></button>
    </div>
  </header>

  <main>
    <section id="screen-home" class="screen">
      <div id="home-content"></div>
    </section>
    <section id="screen-wordbook" class="screen hidden">
      <div id="wordbook-content"></div>
    </section>
    <section id="screen-quiz" class="screen hidden">
      <div id="quiz-content"></div>
    </section>
    <section id="screen-result" class="screen hidden">
      <div id="result-content"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>CodeEigoDojo · データはお使いの端末の中だけに保存されます</p>
  </footer>
</div>

<script>
// ============================================================
// データセット
// ----------------------------------------------------------
// 設計方針:
// - meaning は漢字・ひらがな中心で記述し、純カタカナのみの語は不採用
// - abbr / acronym は英語の正式名称を答えとして出題
// ============================================================

const DATA = {};

// 前提（入門）
DATA.prereq = [
  { word: "action", meaning: "操作・動作" },
  { word: "activity", meaning: "活動" },
  { word: "add", meaning: "追加する" },
  { word: "address", meaning: "住所・宛先" },
  { word: "agree", meaning: "同意する" },
  { word: "area", meaning: "領域" },
  { word: "below", meaning: "下記に" },
  { word: "body", meaning: "本体・本文" },
  { word: "break", meaning: "中断する" },
  { word: "build", meaning: "構築する" },
  { word: "call", meaning: "呼び出す" },
  { word: "change", meaning: "変更する" },
  { word: "check", meaning: "確認する" },
  { word: "child", meaning: "子（要素）" },
  { word: "choose", meaning: "選択する" },
  { word: "clean", meaning: "きれいにする" },
  { word: "close", meaning: "閉じる" },
  { word: "compare", meaning: "比較する" },
  { word: "complete", meaning: "完了する" },
  { word: "correct", meaning: "正確な・訂正する" },
  { word: "create", meaning: "作成する" },
  { word: "describe", meaning: "説明する" },
  { word: "description", meaning: "説明" },
  { word: "detail", meaning: "詳細" },
  { word: "event", meaning: "出来事・契機" },
  { word: "example", meaning: "例" },
  { word: "extra", meaning: "余分な・追加の" },
  { word: "false", meaning: "誤りの・偽の" },
  { word: "final", meaning: "最終の" },
  { word: "find", meaning: "検索する・見つける" },
  { word: "finish", meaning: "終了する" },
  { word: "follow", meaning: "従う" },
  { word: "free", meaning: "空きの・無料の" },
  { word: "get", meaning: "取得する" },
  { word: "health", meaning: "正常性" },
  { word: "improve", meaning: "改善する" },
  { word: "include", meaning: "含む" },
  { word: "information", meaning: "情報" },
  { word: "introduce", meaning: "導入する" },
  { word: "join", meaning: "結合する" },
  { word: "language", meaning: "言語" },
  { word: "later", meaning: "後で" },
  { word: "line", meaning: "行・線" },
  { word: "list", meaning: "一覧・一覧表示する" },
  { word: "make", meaning: "作成する" },
  { word: "match", meaning: "一致する" },
  { word: "model", meaning: "型・模型" },
  { word: "move", meaning: "移動する" },
  { word: "name", meaning: "名前" },
  { word: "next", meaning: "次の" },
  { word: "number", meaning: "数" },
  { word: "object", meaning: "対象・物体" },
  { word: "open", meaning: "開く" },
  { word: "parent", meaning: "親（要素）" },
  { word: "play", meaning: "再生する" },
  { word: "post", meaning: "書き込む・投稿" },
  { word: "prepare", meaning: "準備する" },
  { word: "problem", meaning: "問題" },
  { word: "product", meaning: "製品" },
  { word: "read", meaning: "読み取る" },
  { word: "return", meaning: "戻す・返す" },
  { word: "rule", meaning: "規則" },
  { word: "run", meaning: "実行する" },
  { word: "section", meaning: "部分・節" },
  { word: "see", meaning: "参照する・見る" },
  { word: "send", meaning: "送信する" },
  { word: "set", meaning: "設定する" },
  { word: "show", meaning: "表示する" },
  { word: "size", meaning: "大きさ" },
  { word: "space", meaning: "空白・領域" },
  { word: "start", meaning: "開始する" },
  { word: "statement", meaning: "文・命令文" },
  { word: "stop", meaning: "停止する" },
  { word: "traffic", meaning: "通信量" },
  { word: "tree", meaning: "木構造" },
  { word: "true", meaning: "正しい・真の" },
  { word: "use", meaning: "使う・使用" },
  { word: "useful", meaning: "便利な" },
  { word: "visit", meaning: "訪問する" },
  { word: "wait", meaning: "待機する" },
  { word: "write", meaning: "書き込む" },
  { word: "you", meaning: "あなた・利用者" },
  { word: "your", meaning: "あなたの・利用者の" },
];

// ベーシック
DATA.basic = [
  { word: "accept", meaning: "受諾する・受け入れる" },

// ============================================================
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n, exclude) {
  const pool = arr.filter(item => !exclude.includes(item));
  return shuffleArray(pool).slice(0, n);
}

function getCategorySource(catId) {
  if (catId === "all") {
    return [
      ...DATA.prereq.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.basic.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.advanced.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.abbr.map(x => ({ ...x, _kind: "abbr" })),
      ...DATA.acronym.map(x => ({ ...x, _kind: "acronym" })),
    ];
  }
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat) return [];
  return DATA[cat.source].map(x => ({ ...x, _kind: cat.type }));
}

// 出題生成
// ============================================================
// items: クイズ対象の語のリスト
// fullPool: 同一の_kindの全語（誤答抽出用）
function buildQuestion(item, fullPool) {
  const kind = item._kind;
  let prompt, answer, distractorPool;

  if (kind === "meaning") {
    prompt = "次の単語の意味として最も適切なものは？";
    answer = item.meaning;
    distractorPool = fullPool
      .filter(x => x._kind === "meaning" && x.meaning !== item.meaning)
      .map(x => x.meaning);
  } else if (kind === "abbr") {
    prompt = "次の略語の元の英単語として最も適切なものは？";
    answer = item.full;
    distractorPool = fullPool
      .filter(x => x._kind === "abbr" && x.full !== item.full)
      .map(x => x.full);
  } else if (kind === "acronym") {
    prompt = "次の頭字語の正式名称として最も適切なものは？";
    answer = item.full;
    distractorPool = fullPool
      .filter(x => x._kind === "acronym" && x.full !== item.full)
      .map(x => x.full);
  }

  const uniquePool = Array.from(new Set(distractorPool));
  const distractors = pickRandom(uniquePool, 3, [answer]);
  while (distractors.length < 3) {
    distractors.push("（候補不足）");
  }
  const choices = shuffleArray([answer, ...distractors]);
  const correctIndex = choices.indexOf(answer);

  return {
    word: item.word,
    prompt,
    choices,
    correctIndex,
    answer,
    kind,
  };
}

// ============================================================
// IndexedDB ラッパー（外部ライブラリ不使用）
// ============================================================
function openDB() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") {
      reject(new Error("IndexedDB is unavailable"));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "key" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGet(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
    req.onerror = () => reject(req.error);
  }));
}

function idbSet(key, value) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).put({ key, value });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function idbDelete(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function idbClear() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

// 旧 localStorage 形式が残っている場合の一度きりの引き継ぎ
async function migrateFromLocalStorage() {
  try {
    const raw = localStorage.getItem(LEGACY_LS_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object") {
      if (parsed.theme) await idbSet("theme", parsed.theme);
      if (Array.isArray(parsed.history)) await idbSet("history", parsed.history);
    }
    localStorage.removeItem(LEGACY_LS_KEY);
  } catch (e) {
    console.warn("Legacy migration skipped:", e);
  }
}

async function loadAllFromIDB() {
  try {
    const theme = await idbGet("theme");
    const history = await idbGet("history");
    const selection = await idbGet("selection");
    dataCache.theme = theme || null;
    dataCache.history = Array.isArray(history) ? history : [];
    dataCache.lastSelection = (selection && typeof selection === "object") ? selection : null;
  } catch (e) {
    console.warn("IndexedDB load failed; running without persistence:", e);
    dataCache.theme = null;
    dataCache.history = [];
    dataCache.lastSelection = null;
  }
}

async function recordHistorySession(session) {
  dataCache.history.unshift(session);
  if (dataCache.history.length > 30) dataCache.history.length = 30;
  try {
    await idbSet("history", dataCache.history);
  } catch (e) {
    console.warn("Failed to persist history:", e);
  }
}

async function clearHistoryData() {
  dataCache.history = [];
  try {
    await idbDelete("history");
  } catch (e) {
    console.warn("Failed to clear history:", e);
  }
}

async function clearAllData() {
  dataCache.theme = null;
  dataCache.history = [];
  try {
    await idbClear();
  } catch (e) {
    console.warn("Failed to clear all data:", e);
  }
}

// DOM ヘルパー
// ============================================================
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "style" && typeof v === "object") {
        for (const s in v) e.style[s] = v[s];
      } else if (k === "dataset") {
        for (const d in v) e.dataset[d] = v[d];
      } else if (v === true) e.setAttribute(k, "");
      else if (v === false || v == null) { /* skip */ }
      else e.setAttribute(k, v);
    }
  }
  appendChildren(e, children);
  return e;
}
function appendChildren(parent, children) {
  if (children == null) return;
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null || c === false) return;
    if (typeof c === "string" || typeof c === "number") {
      parent.appendChild(document.createTextNode(String(c)));
    } else parent.appendChild(c);
  });
}

// 日付の整形 (例: 2026-05-01)
function fmtDate(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

      const rate = Math.round(s.correct / s.total * 100);
      list.appendChild(el("div", { class: "history-row" }, [
        el("span", { class: "history-date" }, fmtDate(s.timestamp)),
        el("span", { class: "history-cat" }, s.categoryLabel),
        el("span", { class: "history-stat" }, `${s.correct}/${s.total} · ${rate}%`),
      ]));
    });
    histCard.appendChild(list);
  }

  // 削除アクション
  const delHistory = el("button", { class: "btn-link", type: "button" }, "履歴を削除");
  delHistory.disabled = !dataCache.history.length;
  delHistory.addEventListener("click", async () => {
    if (!dataCache.history.length) return;
    if (!confirm("学習履歴をすべて削除します。よろしいですか？")) return;
    await clearHistoryData();
    renderHome();
  });
  const delAll = el("button", { class: "btn-link", type: "button" }, "すべての保存データを削除");
  delAll.disabled = !(dataCache.history.length || dataCache.theme || dataCache.lastSelection);
  delAll.addEventListener("click", async () => {
    if (!confirm("テーマ・履歴・直近の選択を含む保存データをすべて削除します。よろしいですか？")) return;
    await clearAllData();
    dataCache.lastSelection = null;
    const sys = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    applyThemeUI(sys);
    renderHome();
  });
  histCard.appendChild(el("div", { class: "data-actions" }, [delHistory, delAll]));
  root.appendChild(histCard);

  // 単語帳への導線
  const goWb = el("button", { class: "btn-link", type: "button" }, "単語帳で一覧を見る →");
  goWb.addEventListener("click", () => showScreen("wordbook"));
  root.appendChild(el("div", { class: "foot-link" }, [goWb]));
}

// ============================================================
// 単語帳（副画面）
// ============================================================
function renderWordbook() {
  const root = document.getElementById("wordbook-content");
  root.innerHTML = "";

  // ツールバー: カテゴリー + 検索
  const catSelect = el("select", { id: "wb-cat" }, [
    el("option", { value: "all" }, "全分野"),
    ...CATEGORIES.filter(c => c.id !== "all").map(c => el("option", { value: c.id }, c.label)),
  ]);
  catSelect.value = wbState.catId;
  catSelect.addEventListener("change", () => {
    wbState.catId = catSelect.value;
    renderWordbookList();
  });
  const search = el("input", {
    type: "search",
    id: "wb-search",
    placeholder: "英単語または意味で検索",
    value: wbState.search,
  });
  search.addEventListener("input", () => {
    wbState.search = search.value;
    renderWordbookList();
  });

  const card = el("div", { class: "card" }, [
    el("div", { class: "wb-toolbar" }, [
      el("label", { style: { fontSize: "13px", color: "var(--text-sub)" } }, ["分野: ", catSelect]),
      search,
    ]),
    el("p", { class: "wb-summary", id: "wb-summary" }, ""),
    el("div", { class: "wb-list", id: "wb-list" }),
    el("div", { class: "wb-actions" }, [
      (() => {
        const b = el("button", { class: "btn", type: "button" }, "← 演習に戻る");
        b.addEventListener("click", () => showScreen("home"));
        return b;
      })(),
      (() => {
        const b = el("button", { class: "btn btn-primary", type: "button" }, "この分野で演習する →");
        b.addEventListener("click", () => {
          const sel = getLastSelection();
          const targetId = wbState.catId === "all" ? "all" : wbState.catId;
          saveLastSelection({ catId: targetId, count: sel.count, shuffle: sel.shuffle });
          startQuiz({ catId: targetId, count: sel.count, shuffle: sel.shuffle });
        });
        return b;
      })(),
    ]),
  ]);
  root.appendChild(card);

  renderWordbookList();
}

function renderWordbookList() {
  const listEl = document.getElementById("wb-list");
  const sumEl = document.getElementById("wb-summary");
  if (!listEl || !sumEl) return;
  listEl.innerHTML = "";

  const source = getCategorySource(wbState.catId);
  // 表示用の (word, displayMeaning) を作る
  const rows = source.map(item => {
    let display;
    if (item._kind === "abbr") display = item.full + "（の略）";
    else if (item._kind === "acronym") display = item.full;
    else display = item.meaning;
    return { word: item.word, display };
  });

  // 検索フィルタ
  const q = wbState.search.trim().toLowerCase();
  const filtered = q ? rows.filter(r =>
    r.word.toLowerCase().includes(q) || r.display.toLowerCase().includes(q)
  ) : rows;

  // 単語アルファベット順にソート
  filtered.sort((a, b) => a.word.localeCompare(b.word));

  sumEl.innerHTML = "";
  sumEl.appendChild(document.createTextNode("表示中: "));
  sumEl.appendChild(el("strong", null, String(filtered.length)));
  sumEl.appendChild(document.createTextNode(" / 全 "));
  sumEl.appendChild(el("strong", null, String(rows.length)));
  sumEl.appendChild(document.createTextNode(" 語"));

  if (filtered.length === 0) {
    listEl.appendChild(el("div", { class: "wb-empty" }, "該当する単語が見つかりません。"));
    return;
  }

  filtered.forEach(r => {
    listEl.appendChild(el("div", { class: "wb-row" }, [
      el("div", { class: "wb-word" }, r.word),
      el("div", { class: "wb-meaning" }, r.display),
    ]));
  });
}

// ============================================================
// 演習開始
// ============================================================
function startQuiz(override) {
  const sel = override || getLastSelection();
  const source = getCategorySource(sel.catId);
  if (source.length === 0) {
    alert("出題できる語がありません。");
    return;
  }
  const ordered = sel.shuffle ? shuffleArray(source) : source.slice();
  const limit = sel.count === "all" ? ordered.length : Math.min(parseInt(sel.count, 10), ordered.length);
  const items = ordered.slice(0, limit);

  state.questions = items.map(item => buildQuestion(item, source));
  state.currentIdx = 0;
  state.correctCount = 0;
  state.answers = [];
  state.awaitingNext = false;
  state.selectedCategory = sel.catId;
  saveLastSelection({ catId: sel.catId, count: sel.count, shuffle: sel.shuffle });

  showScreen("quiz");
  renderQuestion();
}

// ============================================================
// 出題
// ============================================================
function renderQuestion() {
  const q = state.questions[state.currentIdx];
  const root = document.getElementById("quiz-content");
  root.innerHTML = "";

  const pct = (state.currentIdx / state.questions.length) * 100;
  const card = el("div", { class: "card" }, [
    el("div", { class: "quiz-progress" }, [
      el("div", { class: "fill", style: { width: pct + "%" } }),
    ]),
    el("div", { class: "quiz-meta" }, [
      el("span", null, `第 ${state.currentIdx + 1} 問 / 全 ${state.questions.length} 問`),
      el("span", { class: "score" }, `正解 ${state.correctCount} / ${state.answers.length}`),
    ]),
    el("div", { class: "headword" }, q.word),
    el("p", { class: "headword-prompt" }, q.prompt),
    (() => {
      const choices = el("div", { class: "choices" });
      q.choices.forEach((c, i) => {
        const btn = el("button", { class: "choice", type: "button", dataset: { idx: String(i) } }, [
          el("span", { class: "choice-num" }, String(i + 1)),
          el("span", { class: "choice-text" }, c),
        ]);
        btn.addEventListener("click", () => handleChoice(i));
        choices.appendChild(btn);
      });
      return choices;
    })(),
    el("div", { class: "feedback", id: "feedback" }),
    el("div", { class: "quiz-actions" }, [
      (() => {
        const b = el("button", { class: "btn", id: "quit-btn", type: "button" }, "中断");
        b.addEventListener("click", () => {
          if (state.answers.length === 0 || confirm("演習を中断してホームに戻りますか？")) {
            showScreen("home");
          }
        });
        return b;
      })(),
      (() => {
        const b = el("button", { class: "btn btn-primary", id: "next-btn", type: "button", disabled: true }, "次の問へ →");
        b.addEventListener("click", goNext);
        return b;
      })(),
    ]),
    el("p", { class: "kb-hint" }, [
      el("span", { class: "kbd" }, "1"),
      "〜",
      el("span", { class: "kbd" }, "4"),
      "で選択 / ",
      el("span", { class: "kbd" }, "Enter"),
      "で次へ",
    ]),
  ]);
  root.appendChild(card);
}

// ============================================================
// 解答処理
// ============================================================
function handleChoice(idx) {
  if (state.awaitingNext) return;
  const q = state.questions[state.currentIdx];
  const isCorrect = idx === q.correctIndex;
  if (isCorrect) state.correctCount++;
  state.answers.push({ word: q.word, picked: idx, correct: q.correctIndex, isCorrect, answer: q.answer, choices: q.choices });
  state.awaitingNext = true;

  document.querySelectorAll("#quiz-content .choice").forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correctIndex) btn.classList.add("correct");
    else if (i === idx) btn.classList.add("incorrect");
  });

  const fb = document.getElementById("feedback");
  if (fb) {
    fb.innerHTML = "";
    fb.classList.add("show", isCorrect ? "correct" : "incorrect");
    fb.appendChild(el("strong", null, isCorrect ? "正解" : "不正解"));
    fb.appendChild(document.createTextNode("  "));
    fb.appendChild(document.createTextNode(q.word + " ＝ " + q.answer));
  }

  const meta = document.querySelector("#quiz-content .quiz-meta .score");
  if (meta) meta.textContent = `正解 ${state.correctCount} / ${state.answers.length}`;

  const nextBtn = document.getElementById("next-btn");
  if (nextBtn) { nextBtn.disabled = false; nextBtn.focus(); }
}

// ============================================================
// 次へ / 終了
// ============================================================
function goNext() {
  if (!state.awaitingNext) return;
  state.currentIdx++;
  if (state.currentIdx >= state.questions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

async function finishQuiz() {
  const total = state.answers.length;
  const correct = state.correctCount;
  const rate = total > 0 ? Math.round(correct / total * 100) : 0;
  const cat = getCategoryById(state.selectedCategory);

  await recordHistorySession({
    timestamp: Date.now(),
    categoryId: state.selectedCategory,
    categoryLabel: cat.label,
    total,
    correct,
  });

  lastFinishedInfo = { total, correct, rate, cat };
  renderResult();
}

function renderResult() {
  const root = document.getElementById("result-content");
  root.innerHTML = "";
  const info = lastFinishedInfo;

  const summary = el("div", { class: "card" }, [
    el("p", { class: "result-headline" }, info.cat.label + " の結果"),
    el("p", { class: "result-rate" }, info.rate + "%"),
    el("p", { class: "result-correct" }, `${info.correct} / ${info.total} 問 正解`),
  ]);
  root.appendChild(summary);

  const reviewCard = el("div", { class: "card" }, [
    el("p", { class: "section-title" }, "振り返り"),
  ]);
  const list = el("div", { class: "review-list" });
  state.answers.forEach(a => {
    list.appendChild(el("div", { class: "review-row" }, [
      el("span", { class: "review-mark " + (a.isCorrect ? "ok" : "ng") }, a.isCorrect ? "○" : "×"),
      el("span", null, [
        el("span", { class: "review-headword" }, a.word),
        el("span", { class: "review-meaning" }, "＝ " + a.answer),
        a.isCorrect ? null : el("span", { class: "review-picked" }, a.choices[a.picked] || "—"),
      ]),
      el("span", null),
    ]));
  });
  reviewCard.appendChild(list);
  root.appendChild(reviewCard);

  const actions = el("div", { class: "result-actions" }, [
    (() => {
      const b = el("button", { class: "btn", type: "button" }, "← ホームに戻る");
      b.addEventListener("click", () => showScreen("home"));
      return b;
    })(),
    (() => {
      const b = el("button", { class: "btn", type: "button" }, "単語帳で確認");
      b.addEventListener("click", () => {
        wbState.catId = state.selectedCategory;
        wbState.search = "";
        showScreen("wordbook");
      });
      return b;
    })(),
    (() => {
      const b = el("button", { class: "btn btn-primary", type: "button" }, "もう一度 →");
      b.addEventListener("click", () => startQuiz());
      return b;
    })(),
  ]);
  root.appendChild(actions);

  showScreen("result");
}

// ============================================================
// テーマ
// ============================================================
function applyThemeUI(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const lab = document.getElementById("theme-label");
  if (lab) lab.textContent = theme === "dark" ? "暗い" : "明るい";
}

function applyTheme(theme) {
  applyThemeUI(theme);
  dataCache.theme = theme;
  idbSet("theme", theme).catch(e => console.warn("Failed to persist theme:", e));
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(current === "dark" ? "light" : "dark");
}

// ============================================================
// 初期化
// ============================================================
async function init() {
  const sysTheme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  applyThemeUI(sysTheme);

  await migrateFromLocalStorage();
  await loadAllFromIDB();

  applyThemeUI(dataCache.theme || sysTheme);

  showScreen("home");

  document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  document.getElementById("nav-home").addEventListener("click", () => showScreen("home"));
  document.getElementById("nav-wordbook").addEventListener("click", () => showScreen("wordbook"));

  document.addEventListener("keydown", (e) => {
    const quizVisible = !document.getElementById("screen-quiz").classList.contains("hidden");
    if (!quizVisible) return;
    if (e.key >= "1" && e.key <= "4") {
      const idx = parseInt(e.key, 10) - 1;
      if (state.awaitingNext) return;
      const btns = document.querySelectorAll("#quiz-content .choice");
      if (btns[idx]) btns[idx].click();
    } else if (e.key === "Enter" && state.awaitingNext) {
      e.preventDefault();
      goNext();
    }
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
