<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeEigoDojo — engineer-english.dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="dark"] {
  /* VSCode Default Dark+ inspired */
  --bg-primary: #1e1e1e;
  --bg-secondary: #252526;
  --bg-tertiary: #2d2d30;
  --bg-hover: #2a2d2e;
  --bg-active: #37373d;
  --text-primary: #d4d4d4;
  --text-secondary: #b4b4b4;
  --text-muted: #6a6a6a;
  --border: #3e3e42;
  --border-soft: #2d2d30;
  --accent: #007acc;
  --accent-strong: #1f9cf0;

  --syntax-comment: #6a9955;
  --syntax-string: #ce9178;
  --syntax-keyword: #c586c0;
  --syntax-type: #4ec9b0;
  --syntax-number: #b5cea8;
  --syntax-function: #dcdcaa;
  --syntax-variable: #9cdcfe;
  --syntax-tag: #569cd6;
  --syntax-operator: #d4d4d4;

  --success: #4ec9b0;
  --success-bg: #16291f;
  --danger: #f48771;
  --danger-bg: #3a1f1f;
  --warning: #cca700;
}
:root[data-theme="light"] {
  /* GitHub Light inspired */
  --bg-primary: #ffffff;
  --bg-secondary: #f6f8fa;
  --bg-tertiary: #eaeef2;
  --bg-hover: #f0f3f6;
  --bg-active: #ddf4ff;
  --text-primary: #1f2328;
  --text-secondary: #424950;
  --text-muted: #6e7781;
  --border: #d0d7de;
  --border-soft: #e1e6eb;
  --accent: #0969da;
  --accent-strong: #0550ae;

  --syntax-comment: #6a737d;
  --syntax-string: #032f62;
  --syntax-keyword: #cf222e;
  --syntax-type: #953800;
  --syntax-number: #0550ae;
  --syntax-function: #8250df;
  --syntax-variable: #24292f;
  --syntax-tag: #116329;
  --syntax-operator: #24292f;

  --success: #1a7f37;
  --success-bg: #dafbe1;
  --danger: #cf222e;
  --danger-bg: #ffebe9;
  --warning: #9a6700;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  font-size: 13px;
  line-height: 1.65;
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* タイトルバー */
.titlebar {
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border);
  height: 34px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 12px;
  font-size: 12px;
  user-select: none;
  flex-shrink: 0;
}
.window-dots { display: inline-flex; gap: 6px; }
.window-dot { width: 11px; height: 11px; border-radius: 50%; background: #555; }
.window-dot.r { background: #ff5f57; }
.window-dot.y { background: #febc2e; }
.window-dot.g { background: #28c840; }
.title-text {
  flex: 1;
  text-align: center;
  color: var(--text-secondary);
  font-size: 12px;
  letter-spacing: 0.02em;
}
.title-actions { display: inline-flex; gap: 2px; }
.ghost-btn {
  background: transparent;
  border: 1px solid transparent;
  padding: 3px 10px;
  cursor: pointer;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.04em;
  border-radius: 3px;
  transition: background 0.12s, color 0.12s;
}
.ghost-btn:hover { background: var(--bg-active); color: var(--text-primary); }

/* タブバー */
.tabbar {
  display: flex;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
}
.tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  border-right: 1px solid var(--border);
  font-size: 12px;
  cursor: pointer;
  position: relative;
  background: var(--bg-secondary);
  color: var(--text-muted);
  white-space: nowrap;
}
.tab.active {
  background: var(--bg-primary);
  color: var(--text-primary);
}
.tab.active::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: var(--accent);
}
.tab .file-icon {
  display: inline-block;
  width: 14px; text-align: center;
  font-size: 11px;
}
.tab .file-icon.md { color: #6796e6; }
.tab .file-icon.quiz { color: var(--syntax-keyword); }
.tab .file-icon.log { color: var(--syntax-string); }
.tab .file-icon.session { color: var(--syntax-function); }

/* メイン編集領域 */
main {
  flex: 1;
  background: var(--bg-primary);
  overflow-y: auto;
  padding: 0;
}
.screen {
  padding: 24px 0;
}
.hidden { display: none !important; }

/* コードリスティング */
.code-block {
  counter-reset: codeline;
  font-family: inherit;
}
.code-line {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 0;
  position: relative;
  padding: 0;
  min-height: 22px;
}
.code-line::before {
  counter-increment: codeline;
  content: counter(codeline);
  text-align: right;
  padding-right: 18px;
  color: var(--text-muted);
  user-select: none;
  font-size: 12px;
  opacity: 0.7;
  border-right: 1px solid var(--border-soft);
}
.code-line > .code-content {
  padding: 0 18px;
  word-break: break-word;
  overflow-wrap: break-word;
}

.code-line.blank::before { opacity: 0.4; }
.code-line.blank > .code-content { min-height: 1em; }
.code-line.indent > .code-content { padding-left: 36px; }
.code-line.indent2 > .code-content { padding-left: 54px; }
.code-line.section-divider {
  margin: 8px 0;
}

.code-line.interactive { cursor: pointer; transition: background 0.1s; }
.code-line.interactive:hover { background: var(--bg-hover); }
.code-line.interactive:hover::before { color: var(--accent); }

.code-line.selected > .code-content { color: var(--accent-strong); }
.code-line.selected::before {
  background: var(--accent);
  color: var(--bg-primary);
  font-weight: 600;
  border-right-color: var(--accent);
}

.code-line.choice-correct {
  background: var(--success-bg);
}
.code-line.choice-correct::before {
  background: var(--success);
  color: var(--bg-primary);
  border-right-color: var(--success);
}
.code-line.choice-incorrect {
  background: var(--danger-bg);
}
.code-line.choice-incorrect::before {
  background: var(--danger);
  color: var(--bg-primary);
  border-right-color: var(--danger);
}

/* シンタックスハイライト用クラス */
.tk-comment { color: var(--syntax-comment); font-style: italic; }
.tk-string { color: var(--syntax-string); }
.tk-keyword { color: var(--syntax-keyword); }
.tk-type { color: var(--syntax-type); }
.tk-number { color: var(--syntax-number); }
.tk-function { color: var(--syntax-function); }
.tk-variable { color: var(--syntax-variable); }
.tk-tag { color: var(--syntax-tag); }
.tk-operator { color: var(--syntax-operator); }
.tk-bullet { color: var(--text-muted); }
.tk-meta { color: var(--text-muted); font-size: 12px; }

/* 強調フィードバック行 */
.code-line.feedback-line { padding: 4px 0; }
.code-line.feedback-line.correct .code-content { color: var(--success); }
.code-line.feedback-line.incorrect .code-content { color: var(--danger); }

/* インラインコントロール（select / checkbox / button） */
.code-line .inline-control {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
select.cli-select {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-family: inherit;
  font-size: 12px;
  padding: 2px 8px;
}
input[type="checkbox"].cli-check {
  accent-color: var(--accent);
}

/* ボタン: ターミナルコマンド風 */
.cmd-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 12px;
  padding: 4px 12px;
  cursor: pointer;
  border-radius: 3px;
  letter-spacing: 0.04em;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.cmd-btn:hover { background: var(--bg-active); border-color: var(--accent); }
.cmd-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.cmd-btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.cmd-btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.cmd-btn-danger:hover { border-color: var(--danger); color: var(--danger); }

/* 単語の大表示（Hero） */
.hero-word {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 30px;
  font-weight: 600;
  color: var(--syntax-string);
  letter-spacing: 0.01em;
}
.hero-word::before { content: '"'; color: var(--syntax-string); opacity: 0.6; }
.hero-word::after { content: '"'; color: var(--syntax-string); opacity: 0.6; }

/* ステータスバー */
.statusbar {
  background: var(--accent);
  color: #fff;
  height: 24px;
  display: flex;
  align-items: center;
  padding: 0 0 0 0;
  font-size: 11px;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.statusbar.danger { background: var(--danger); }
.statusbar.success { background: var(--success); color: var(--bg-primary); }
.status-segment {
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-right: 1px solid rgba(255,255,255,0.18);
}
.statusbar.success .status-segment { border-right-color: rgba(0,0,0,0.18); }
.status-segment:last-child { border-right: none; }
.status-spacer { flex: 1; }
.status-segment .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(255,255,255,0.85);
  display: inline-block;
}

/* 進捗バー（タブ下のごく細い線として） */
.progress-strip {
  height: 2px;
  background: var(--bg-secondary);
  position: relative;
  flex-shrink: 0;
}
.progress-strip > .fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.3s;
}

/* レビュー / 履歴 リスト */
.review-list { max-height: none; overflow: visible; }
.review-row {
  display: grid;
  grid-template-columns: 56px 28px 1fr auto;
  gap: 0;
  padding: 2px 0;
  align-items: baseline;
}
.review-row::before {
  counter-increment: codeline;
  content: counter(codeline);
  text-align: right;
  padding-right: 18px;
  color: var(--text-muted);
  font-size: 12px;
  opacity: 0.7;
  border-right: 1px solid var(--border-soft);
}
.review-mark { text-align: center; padding: 0 6px; font-weight: 700; }
.review-mark.ok { color: var(--success); }
.review-mark.ng { color: var(--danger); }
.review-word-cell { padding-left: 12px; }
.review-meta-cell { padding: 0 18px; color: var(--text-muted); font-size: 12px; text-align: right; white-space: nowrap; }

/* アクション行 */
.action-row {
  display: grid;
  grid-template-columns: 56px 1fr;
  margin-top: 8px;
}
.action-row > .actions {
  padding: 8px 18px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  border-top: 1px dashed var(--border-soft);
}
.action-row::before {
  content: "";
  border-right: 1px solid var(--border-soft);
}

/* キーボードヒント */
.kbd {
  display: inline-block;
  padding: 1px 6px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 3px;
  font-family: inherit;
  font-size: 11px;
  color: var(--text-secondary);
}

/* 結果サマリーボックス */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin: 4px 0;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
}
.summary-cell {
  padding: 14px 8px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.summary-cell:last-child { border-right: none; }
.summary-value {
  font-family: inherit;
  font-size: 24px;
  font-weight: 600;
  color: var(--syntax-number);
  line-height: 1;
}
.summary-label {
  margin-top: 6px;
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* レスポンシブ調整 */
@media (max-width: 600px) {
  .code-line { grid-template-columns: 36px 1fr; }
  .code-line::before { padding-right: 10px; font-size: 11px; }
  .code-line > .code-content { padding: 0 10px; }
  .review-row { grid-template-columns: 36px 24px 1fr auto; }
  .review-row::before { padding-right: 10px; }
  .review-meta-cell { padding: 0 10px; }
  .hero-word { font-size: 22px; }
}
</style>

</head>
<body>
<div class="titlebar">
  <span class="window-dots">
    <span class="window-dot r"></span>
    <span class="window-dot y"></span>
    <span class="window-dot g"></span>
  </span>
  <span class="title-text" id="title-text">CodeEigoDojo — engineer-english.dojo</span>
  <div class="title-actions">

    <button class="ghost-btn" id="home-btn" title="ホームへ" aria-label="ホームへ">home</button>

</div>

<div class="tabbar" id="tabbar">
  <div class="tab active" id="active-tab">
    <span class="file-icon md" id="tab-file-icon">▢</span>

</div>

<main>

  <section id="screen-quiz" class="screen hidden">
    <div class="code-block" id="quiz-code"></div>
  </section>

  <section id="screen-result" class="screen hidden">
    <div class="code-block" id="result-code"></div>
  </section>
</main>

<div class="statusbar" id="statusbar">

  <span class="status-segment" id="status-progress">0 / 0</span>

</div>

// ============================================================
// ユーティリティー
// ============================================================
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n, exclude) {
  const pool = arr.filter(item => !exclude.includes(item));
  return shuffleArray(pool).slice(0, n);
}

function getCategorySource(catId) {
  if (catId === "all") {
    return [
      ...DATA.prereq.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.basic.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.advanced.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.abbr.map(x => ({ ...x, _kind: "abbr" })),
      ...DATA.acronym.map(x => ({ ...x, _kind: "acronym" })),
    ];
  }
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat) return [];
  return DATA[cat.source].map(x => ({ ...x, _kind: cat.type }));
}

// ============================================================
// items: クイズ対象の語のリスト
// fullPool: 同一の_kindの全語（誤答抽出用）
function buildQuestion(item, fullPool) {
  const kind = item._kind;
  let prompt, answer, distractorPool;

  if (kind === "meaning") {
    prompt = "次の単語の意味として最も適切なものは？";
    answer = item.meaning;
    distractorPool = fullPool
      .filter(x => x._kind === "meaning" && x.meaning !== item.meaning)
      .map(x => x.meaning);
  } else if (kind === "abbr") {
    prompt = "次の略語の元の英単語として最も適切なものは？";
    answer = item.full;
    distractorPool = fullPool
      .filter(x => x._kind === "abbr" && x.full !== item.full)
      .map(x => x.full);
  } else if (kind === "acronym") {
    prompt = "次の頭字語の正式名称として最も適切なものは？";
    answer = item.full;
    distractorPool = fullPool
      .filter(x => x._kind === "acronym" && x.full !== item.full)
      .map(x => x.full);
  }

  const uniquePool = Array.from(new Set(distractorPool));
  const distractors = pickRandom(uniquePool, 3, [answer]);
  while (distractors.length < 3) {
    distractors.push("（候補不足）");
  }
  const choices = shuffleArray([answer, ...distractors]);
  const correctIndex = choices.indexOf(answer);

  return {
    word: item.word,
    prompt,
    choices,
    correctIndex,
    answer,
    kind,
  };
}

// ============================================================
// IndexedDB ラッパー（外部ライブラリ不使用）
// ============================================================
function openDB() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") {
      reject(new Error("IndexedDB is unavailable"));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "key" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGet(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
    req.onerror = () => reject(req.error);
  }));
}

function idbSet(key, value) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).put({ key, value });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function idbDelete(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function idbClear() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

// 旧 localStorage 形式が残っている場合の一度きりの引き継ぎ
async function migrateFromLocalStorage() {
  try {
    const raw = localStorage.getItem(LEGACY_LS_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object") {
      if (parsed.theme) await idbSet("theme", parsed.theme);
      if (Array.isArray(parsed.history)) await idbSet("history", parsed.history);
    }
    localStorage.removeItem(LEGACY_LS_KEY);
  } catch (e) {
    console.warn("Legacy migration skipped:", e);
  }
}

async function loadAllFromIDB() {
  try {
    const theme = await idbGet("theme");
    const history = await idbGet("history");
    dataCache.theme = theme || null;
    dataCache.history = Array.isArray(history) ? history : [];
  } catch (e) {
    console.warn("IndexedDB load failed; running without persistence:", e);
    dataCache.theme = null;
    dataCache.history = [];
  }
}

async function recordHistorySession(session) {
  dataCache.history.unshift(session);
  if (dataCache.history.length > 30) dataCache.history.length = 30;
  try {
    await idbSet("history", dataCache.history);
  } catch (e) {
    console.warn("Failed to persist history:", e);
  }
}

async function clearHistoryData() {
  dataCache.history = [];
  try {
    await idbDelete("history");
  } catch (e) {
    console.warn("Failed to clear history:", e);
  }
}

async function clearAllData() {
  dataCache.theme = null;
  dataCache.history = [];
  try {
    await idbClear();
  } catch (e) {
    console.warn("Failed to clear all data:", e);
  }
}

// DOM ヘルパー
// ============================================================
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "style" && typeof attrs[k] === "object") {
        for (const s in attrs[k]) e.style[s] = attrs[k][s];
      } else if (k === "dataset") {
        for (const d in attrs[k]) e.dataset[d] = attrs[k][d];
      } else if (attrs[k] === true) {
        e.setAttribute(k, "");
      } else if (attrs[k] === false || attrs[k] == null) {
        // skip
      } else {
        e.setAttribute(k, attrs[k]);
      }
    }
  }
  appendChildren(e, children);
  return e;
}
function appendChildren(parent, children) {
  if (children == null) return;
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null || c === false) return;
    if (typeof c === "string" || typeof c === "number") {
      parent.appendChild(document.createTextNode(String(c)));
    } else {
      parent.appendChild(c);
    }
  });
}
function tk(kind, text) {
  const s = document.createElement("span");
  s.className = "tk-" + kind;
  s.textContent = text;
  return s;
}
function comment(text) { return tk("comment", "// " + text); }
function codeLine(content, opts) {
  opts = opts || {};
  const line = document.createElement("div");
  line.className = "code-line" + (opts.cls ? " " + opts.cls : "");
  if (opts.id) line.id = opts.id;
  if (opts.dataset) for (const k in opts.dataset) line.dataset[k] = opts.dataset[k];
  if (opts.onClick) {
    line.classList.add("interactive");
    line.addEventListener("click", opts.onClick);
  }
  const c = document.createElement("div");
  c.className = "code-content";
  appendChildren(c, content);
  line.appendChild(c);
  return line;
}
function blankLine() { return codeLine([], { cls: "blank" }); }

    tk("variable", "questionCount"),

    shuffleCheck,
    tk("keyword", "true"),
  ]);

    tk("variable", "shuffle      "),
    tk("operator", "  =  "),
    shuffleLabel,
  ]));

  // 実行ボタン
  root.appendChild(blankLine());

  runBtn.addEventListener("click", startQuiz);

    tk("function", "$ "),
    runBtn,
  ]));

  // 履歴セクション
  root.appendChild(blankLine());
  root.appendChild(codeLine([tk("keyword", "/* "), tk("comment", "§ session history"), tk("keyword", " */")]));
  renderHistoryInto(root);
}

function renderHistoryInto(root) {
  const h = dataCache.history;
  if (!h || h.length === 0) {
    root.appendChild(codeLine([tk("comment", "// no sessions recorded yet.")]));
    root.appendChild(blankLine());
    appendDeleteActions(root);
    return;
  }
  const total = h.length;
  const avg = Math.round(h.reduce((s, x) => s + (x.correct / x.total * 100), 0) / total);
  root.appendChild(codeLine([
    tk("variable", "averageRate  "),
    tk("operator", "= "),
    tk("number", avg + "%"),
    tk("comment", "  // " + total + " sessions"),
  ]));
  root.appendChild(blankLine());
  h.slice(0, 5).forEach(s => {
    const rate = Math.round(s.correct / s.total * 100);
    const dt = new Date(s.timestamp);
    const dts = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")} ${String(dt.getHours()).padStart(2, "0")}:${String(dt.getMinutes()).padStart(2, "0")}`;
    root.appendChild(codeLine([
      tk("comment", "[" + dts + "] "),
      tk("type", s.categoryLabel),
      tk("operator", "  → "),
      tk("number", `${s.correct}/${s.total}`),
      tk("operator", "  "),
      tk("number", rate + "%"),
    ]));
  });
  root.appendChild(blankLine());
  appendDeleteActions(root);
}

function appendDeleteActions(root) {
  const delHistory = el("button", { class: "cmd-btn cmd-btn-danger" }, "✕ delete history");
  delHistory.disabled = !dataCache.history.length;
  delHistory.addEventListener("click", async () => {
    if (!dataCache.history.length) return;
    if (!confirm("Delete all session history?")) return;
    await clearHistoryData();
    renderHome();
  });
  const delAll = el("button", { class: "cmd-btn cmd-btn-danger" }, "✕ delete all data");
  delAll.disabled = !(dataCache.history.length || dataCache.theme);
  delAll.addEventListener("click", async () => {
    if (!confirm("Delete all stored data (theme + history)?")) return;
    await clearAllData();
    const sys = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    applyThemeUI(sys);
    renderHome();
  });
  root.appendChild(codeLine([tk("function", "$ "), delHistory, " ", delAll]));
}

// ============================================================
// 演習開始
// ============================================================
function startQuiz() {
  const catId = state.selectedCategory;
  const source = getCategorySource(catId);
  if (source.length === 0) {
    alert("出題できる語がありません。");
    return;
  }
  const shuffle = document.getElementById("shuffle-check").checked;
  const qcountVal = document.getElementById("qcount-select").value;
  const ordered = shuffle ? shuffleArray(source) : source.slice();
  const limit = qcountVal === "all" ? ordered.length : Math.min(parseInt(qcountVal, 10), ordered.length);
  const items = ordered.slice(0, limit);

  state.questions = items.map(item => buildQuestion(item, source));
  state.currentIdx = 0;
  state.correctCount = 0;
  state.answers = [];
  state.awaitingNext = false;

  document.getElementById("screen-home").classList.add("hidden");
  document.getElementById("screen-result").classList.add("hidden");
  document.getElementById("screen-quiz").classList.remove("hidden");
  renderQuestion();
}

// ============================================================
// 出題画面
// ============================================================
function renderQuestion() {
  const q = state.questions[state.currentIdx];
  const cat = getCurrentCategory();
  const root = document.getElementById("quiz-code");
  root.innerHTML = "";

  // タイトル
  root.appendChild(codeLine([comment(`Question ${state.currentIdx + 1} of ${state.questions.length}  ·  ${cat.label}`)]));
  root.appendChild(blankLine());

  // 単語ヒーロー
  const hero = el("span", { class: "hero-word" }, q.word);
  root.appendChild(codeLine([
    tk("keyword", "const "),
    tk("variable", "word"),
    tk("operator", " = "),
    hero,
    tk("operator", ";"),
  ]));
  root.appendChild(blankLine());

  // プロンプト
  root.appendChild(codeLine([comment(q.prompt)]));
  root.appendChild(blankLine());

  // 選択肢
  q.choices.forEach((c, i) => {
    const numTok = tk("number", `[${i + 1}]`);
    const valTok = tk("string", `"${c}"`);
    const line = codeLine([tk("operator", "  "), numTok, " ", valTok], {
      cls: "choice-row",
      dataset: { choiceIdx: String(i) },
      onClick: () => handleChoice(i),
    });
    root.appendChild(line);
  });

  // フィードバック行（プレースホルダー）
  const fb = blankLine();
  fb.id = "quiz-feedback-line";
  root.appendChild(fb);

  // 操作行
  root.appendChild(blankLine());
  const quitBtn = el("button", { class: "cmd-btn", id: "quit-btn" }, "✕ quit");
  quitBtn.addEventListener("click", () => {
    if (state.answers.length === 0 || confirm("Quit current session?")) {
      showScreen("home");
    }
  });
  const nextBtn = el("button", { class: "cmd-btn cmd-btn-primary", id: "next-btn" }, "▶ next");
  nextBtn.disabled = true;
  nextBtn.addEventListener("click", goNext);
  root.appendChild(codeLine([tk("function", "$ "), quitBtn, " ", nextBtn]));

  // ヒント
  root.appendChild(blankLine());
  root.appendChild(codeLine([
    tk("comment", "// hint: "),
    el("span", { class: "kbd" }, "1"),
    " ~ ",
    el("span", { class: "kbd" }, "4"),
    " select  ·  ",
    el("span", { class: "kbd" }, "Enter"),
    " next",
  ]));

  // タブ / ステータス / 進捗
  setTab(cat.id + ".quiz", "quiz");
  setStatus("PRACTICE", {
    cat: cat.id + ".quiz",
    progress: `Q ${state.currentIdx + 1}/${state.questions.length}  ·  ✓ ${state.correctCount}/${state.answers.length}`,
    color: null,
  });
  setProgress((state.currentIdx / state.questions.length) * 100);
}

// ============================================================
// 解答処理
// ============================================================
function handleChoice(idx) {
  if (state.awaitingNext) return;
  const q = state.questions[state.currentIdx];
  const isCorrect = idx === q.correctIndex;
  if (isCorrect) state.correctCount++;
  state.answers.push({ word: q.word, picked: idx, correct: q.correctIndex, isCorrect, answer: q.answer, choices: q.choices });
  state.awaitingNext = true;

  const root = document.getElementById("quiz-code");
  root.querySelectorAll(".choice-row").forEach((row, i) => {
    row.classList.remove("interactive");
    row.style.cursor = "default";
    if (i === q.correctIndex) row.classList.add("choice-correct");
    else if (i === idx) row.classList.add("choice-incorrect");
  });

  const fb = document.getElementById("quiz-feedback-line");
  if (fb) {
    fb.classList.remove("blank");
    fb.classList.add("feedback-line", isCorrect ? "correct" : "incorrect");
    const cc = fb.querySelector(".code-content");
    cc.innerHTML = "";
    cc.appendChild(tk("comment", isCorrect ? "// ✓ correct  " : "// ✗ incorrect  "));
    cc.appendChild(document.createTextNode(`${q.word} = ${q.answer}`));
  }

  const nextBtn = document.getElementById("next-btn");
  if (nextBtn) { nextBtn.disabled = false; nextBtn.focus(); }

  setStatus(isCorrect ? "CORRECT" : "INCORRECT", {
    cat: getCurrentCategory().id + ".quiz",
    progress: `Q ${state.currentIdx + 1}/${state.questions.length}  ·  ✓ ${state.correctCount}/${state.answers.length}`,
    color: isCorrect ? "success" : "danger",
  });
}

// ============================================================
// 次へ / 終了
// ============================================================
function goNext() {
  if (!state.awaitingNext) return;
  state.currentIdx++;
  if (state.currentIdx >= state.questions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz() {
  const total = state.answers.length;
  const correct = state.correctCount;
  const rate = total > 0 ? Math.round(correct / total * 100) : 0;
  const cat = getCurrentCategory();

  const root = document.getElementById("result-code");
  root.innerHTML = "";
  root.appendChild(codeLine([comment(`session.log  ·  ${cat.label}`)]));
  root.appendChild(blankLine());

  const summaryGrid = el("div", { class: "summary-grid" }, [
    el("div", { class: "summary-cell" }, [
      el("div", { class: "summary-value" }, String(correct)),
      el("div", { class: "summary-label" }, "correct"),
    ]),
    el("div", { class: "summary-cell" }, [
      el("div", { class: "summary-value" }, String(total)),
      el("div", { class: "summary-label" }, "total"),
    ]),
    el("div", { class: "summary-cell" }, [
      el("div", { class: "summary-value" }, rate + "%"),
      el("div", { class: "summary-label" }, "accuracy"),
    ]),
  ]);
  root.appendChild(codeLine([summaryGrid]));

  root.appendChild(blankLine());
  root.appendChild(codeLine([tk("keyword", "/* "), tk("comment", "§ review"), tk("keyword", " */")]));
  root.appendChild(blankLine());

  state.answers.forEach(a => {
    const row = el("div", { class: "review-row" }, [
      el("span", { class: "review-mark " + (a.isCorrect ? "ok" : "ng") }, a.isCorrect ? "✓" : "✗"),
      el("span", { class: "review-word-cell" }, [
        tk("string", '"' + a.word + '"'),
        tk("operator", "  =  "),
        document.createTextNode(a.answer),
      ]),
      el("span", { class: "review-meta-cell" }, a.isCorrect ? "" : `picked: "${a.choices[a.picked] || "—"}"`),
    ]);
    root.appendChild(row);
  });

  // アクション
  root.appendChild(blankLine());
  const back = el("button", { class: "cmd-btn", id: "back-home-btn" }, "← back");
  back.addEventListener("click", () => showScreen("home"));
  const retry = el("button", { class: "cmd-btn cmd-btn-primary", id: "retry-btn" }, "▶ run again");
  retry.addEventListener("click", startQuiz);
  root.appendChild(codeLine([tk("function", "$ "), back, " ", retry]));

  // 履歴保存（fire-and-forget）
  recordHistorySession({
    timestamp: Date.now(),
    categoryId: state.selectedCategory,
    categoryLabel: cat.label,
    total,
    correct,
  });

  setProgress(100);
  setTab("session.log", "log");
  setStatus("DONE", {
    cat: cat.id + ".dojo",
    progress: `${correct}/${total}  ${rate}%`,
    color: rate >= 80 ? "success" : (rate < 50 ? "danger" : null),
  });
  document.getElementById("screen-quiz").classList.add("hidden");
  document.getElementById("screen-home").classList.add("hidden");
  document.getElementById("screen-result").classList.remove("hidden");
}

// ============================================================
// テーマ
// ============================================================
function applyThemeUI(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  // ボタンには現在のテーマ名を表示
  document.getElementById("theme-icon").textContent = theme;
}

function applyTheme(theme) {
  applyThemeUI(theme);
  dataCache.theme = theme;
  idbSet("theme", theme).catch(e => console.warn("Failed to persist theme:", e));
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  applyTheme(current === "dark" ? "light" : "dark");
}

// ============================================================
// 初期化
// ============================================================
async function init() {
  // ちらつき抑制のためOS設定を初期適用
  const sysTheme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  applyThemeUI(sysTheme);

  await migrateFromLocalStorage();
  await loadAllFromIDB();

  applyThemeUI(dataCache.theme || sysTheme);

  showScreen("home");

  document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  document.getElementById("home-btn").addEventListener("click", () => showScreen("home"));

  // キーボード（クイズ画面のみ）
  document.addEventListener("keydown", (e) => {
    const quizVisible = !document.getElementById("screen-quiz").classList.contains("hidden");
    if (!quizVisible) return;
    if (e.key >= "1" && e.key <= "4") {
      const idx = parseInt(e.key, 10) - 1;
      if (state.awaitingNext) return;
      const rows = document.querySelectorAll("#quiz-code .choice-row");
      if (rows[idx]) rows[idx].click();
    } else if (e.key === "Enter" && state.awaitingNext) {
      e.preventDefault();
      goNext();
    }
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
