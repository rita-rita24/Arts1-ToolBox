<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeEigoDojo — A Vocabulary for Engineers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Spectral+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="light"] {
  --bg-page: #f5ecd5;
  --bg-card: #fdf8e7;
  --bg-tertiary: #ebe0c0;
  --text-primary: #1a1410;
  --text-secondary: #463a2c;
  --text-muted: #8a7e63;
  --border: #b8a576;
  --border-soft: #ddcfa6;
  --accent: #67302a;
  --accent-strong: #4d2320;
  --gold: #a17d3a;
  --success: #4a6b3a;
  --success-bg: #eaf0d4;
  --danger: #8a1f15;
  --danger-bg: #f3dac7;
}
:root[data-theme="dark"] {
  --bg-page: #1a1814;
  --bg-card: #21201d;
  --bg-tertiary: #2c2924;
  --text-primary: #f3ead6;
  --text-secondary: #c9bda3;
  --text-muted: #8a7e6a;
  --border: #4a3f33;
  --border-soft: #3a322a;
  --accent: #d8523c;
  --accent-strong: #ec6e57;
  --gold: #d8b260;
  --success: #9ec38a;
  --success-bg: #2a341f;
  --danger: #e16554;
  --danger-bg: #3a201c;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "EB Garamond", "Charter", "Iowan Old Style", Georgia, "Times New Roman", serif;
  font-size: 17px;
  line-height: 1.7;
  background: var(--bg-page);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "kern", "liga", "onum";
  min-height: 100vh;
  padding: 18px 8px 40px;
}

.page {
  max-width: 720px;
  margin: 0 auto;
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 36px 56px 48px;
  position: relative;
}
[data-theme="light"] .page {
  box-shadow: 0 1px 0 var(--border-soft), 0 0 0 6px var(--bg-page), 0 0 0 7px var(--border-soft);
}

@media (max-width: 600px) {
  body { padding: 8px 0; }
  .page { padding: 22px 22px 32px; border-left: none; border-right: none; }
  [data-theme="light"] .page { box-shadow: none; }
}

/* トップバー（控えめなテキストリンク） */
.topbar {
  display: flex;
  justify-content: flex-end;
  font-size: 12px;
  font-style: italic;
  color: var(--text-muted);
  margin-bottom: 18px;
  letter-spacing: 0.04em;
}
.topbar-actions { display: inline-flex; align-items: baseline; gap: 10px; }
.link-btn {
  background: transparent;
  border: none;
  padding: 0;
  color: var(--text-muted);
  font: inherit;
  font-style: italic;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: transparent;
  text-underline-offset: 3px;
  transition: color 0.15s, text-decoration-color 0.15s;
}
.link-btn:hover { color: var(--accent); text-decoration-color: var(--accent); }
.link-divider { color: var(--border); }

/* マストヘッド */
.masthead { text-align: center; margin: 6px 0 24px; }
.masthead-title {
  font-family: "Spectral SC", "EB Garamond", Georgia, serif;
  font-weight: 600;
  font-size: 36px;
  letter-spacing: 0.06em;
  margin: 0 0 6px;
  color: var(--accent);
}
.masthead-sub {
  font-style: italic;
  font-size: 15px;
  color: var(--text-secondary);
  margin: 0;
  letter-spacing: 0.02em;
}

/* 装飾的な罫線 */
.rule-double {
  border: 0;
  height: 4px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin: 22px auto;
}
.rule-thin {
  border: 0;
  border-top: 1px solid var(--border-soft);
  margin: 22px 0;
}
.rule-ornate {
  border: 0;
  border-top: 1px solid var(--border-soft);
  margin: 28px 0;
  text-align: center;
  position: relative;
  height: 1px;
}
.rule-ornate::after {
  content: "❦";
  position: absolute;
  top: -13px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-card);
  padding: 0 14px;
  color: var(--gold);
  font-size: 18px;
}

/* ランニングヘッダー（ページ番号風） */
.running-header {
  display: flex;
  justify-content: space-between;
  font-style: italic;
  font-size: 13px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-soft);
  padding-bottom: 6px;
  margin-bottom: 26px;
  letter-spacing: 0.04em;
  font-variant: small-caps;
}
.running-header em { font-style: italic; font-variant: normal; }

/* セクション見出し */
.section-heading {
  font-family: "Spectral SC", "EB Garamond", Georgia, serif;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 0.1em;
  margin: 28px 0 14px;
  color: var(--accent);
}

/* イントロ段落 */
.intro {
  margin: 0 0 18px;
  color: var(--text-secondary);
  font-size: 16px;
  line-height: 1.7;
}
.intro em { color: var(--accent); }

/* セクション一覧（カテゴリー） */
.section-list {
  border-top: 1px solid var(--border-soft);
  margin: 4px 0 8px;
}
.section-item {
  display: grid;
  grid-template-columns: 50px 1fr auto;
  gap: 14px;
  padding: 8px 6px;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
  transition: background 0.15s;
  align-items: baseline;
  position: relative;
  font-size: 17px;
}
.section-item:hover { background: var(--bg-tertiary); }
.section-item.selected { background: var(--bg-tertiary); }
.section-item.selected::before {
  content: "▶";
  position: absolute;
  left: -16px;
  top: 12px;
  color: var(--accent);
  font-size: 11px;
}
.section-roman {
  font-style: italic;
  text-align: right;
  color: var(--text-muted);
  padding-right: 4px;
  font-size: 15px;
  font-variant-numeric: oldstyle-nums;
}
.section-name {
  color: var(--text-primary);
}
.section-name strong { font-weight: 600; }
.section-name .pos {
  font-style: italic;
  color: var(--text-muted);
  margin-right: 8px;
  font-size: 14px;
}
.section-name .gloss {
  font-style: italic;
  color: var(--text-muted);
  margin-left: 6px;
  font-size: 14px;
}
.section-count {
  font-style: italic;
  color: var(--text-muted);
  font-size: 13px;
  font-variant-numeric: oldstyle-nums tabular-nums;
  white-space: nowrap;
}

/* オプション行 */
.options { margin: 18px 0; }
.option-row {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 4px 0;
  font-size: 15px;
}
.option-row > .option-label {
  font-style: italic;
  color: var(--text-secondary);
  width: 170px;
  text-align: right;
  font-size: 15px;
}
select.dict-select {
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--border);
  font-family: inherit;
  font-size: 16px;
  color: var(--text-primary);
  padding: 2px 4px;
  font-style: italic;
}
input.dict-check {
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
  vertical-align: middle;
}
.option-row em { font-style: italic; color: var(--text-muted); margin-left: 6px; font-size: 14px; }

/* ボタン */
.actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.actions.center { justify-content: center; }
.btn {
  background: transparent;
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 8px 22px;
  font-family: inherit;
  font-size: 15px;
  font-style: italic;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  letter-spacing: 0.02em;
}
.btn:hover { background: var(--text-primary); color: var(--bg-card); border-color: var(--text-primary); }
.btn-primary {
  background: var(--accent);
  color: #fdf8e7;
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: #fdf8e7; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn:disabled:hover { background: transparent; color: var(--text-primary); border-color: var(--border); }
.btn-link {
  border: 0;
  padding: 4px 10px;
  font-size: 13px;
  color: var(--accent);
  background: transparent;
  text-decoration: underline;
  text-decoration-color: transparent;
  text-underline-offset: 3px;
}
.btn-link:hover { background: transparent; color: var(--accent-strong); text-decoration-color: var(--accent-strong); }
.btn-link:disabled { color: var(--text-muted); }

.primary-action {
  text-align: center;
  margin: 28px 0 8px;
}
.primary-action .btn { padding: 10px 32px; font-size: 16px; }

/* 見出し語（クイズ画面） */
.headword {
  text-align: center;
  margin: 30px 0 4px;
}
.headword-title {
  font-family: "EB Garamond", Georgia, serif;
  font-size: 56px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.005em;
  color: var(--text-primary);
  line-height: 1.05;
  font-variant-ligatures: common-ligatures;
}
.headword-pron {
  font-style: italic;
  color: var(--text-muted);
  font-size: 15px;
  margin-top: 6px;
}
.headword-prompt {
  text-align: center;
  font-style: italic;
  color: var(--text-secondary);
  font-size: 15px;
  margin: 6px 0 22px;
  letter-spacing: 0.02em;
}

/* 定義（選択肢） */
.entries {
  margin: 14px 0 22px;
  border-top: 1px solid var(--border-soft);
}
.entry {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 12px;
  padding: 10px 8px;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
  transition: background 0.15s;
  font-size: 18px;
  line-height: 1.5;
  align-items: baseline;
}
.entry:hover:not(.disabled) { background: var(--bg-tertiary); }
.entry.disabled { cursor: default; }
.entry-num {
  font-style: italic;
  color: var(--text-muted);
  text-align: right;
  font-size: 16px;
  font-variant-numeric: oldstyle-nums;
}
.entry-text { color: var(--text-primary); }
.entry.correct { background: var(--success-bg); }
.entry.correct .entry-num {
  color: var(--success);
  font-style: normal;
  font-weight: 600;
}
.entry.incorrect { background: var(--danger-bg); }
.entry.incorrect .entry-num {
  color: var(--danger);
  font-style: normal;
  font-weight: 600;
}

/* フィードバック */
.feedback {
  display: none;
  text-align: center;
  font-style: italic;
  font-size: 15px;
  padding: 12px 16px;
  margin: 6px 0 18px;
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
  color: var(--text-secondary);
}
.feedback.show { display: block; }
.feedback.correct { color: var(--success); }
.feedback.incorrect { color: var(--danger); }
.feedback strong { font-style: normal; font-weight: 600; }

/* フットノート */
.footnote {
  text-align: center;
  font-style: italic;
  color: var(--text-muted);
  font-size: 12px;
  margin-top: 14px;
  letter-spacing: 0.04em;
}

.kbd {
  font-family: "EB Garamond", Georgia, serif;
  font-style: normal;
  display: inline-block;
  padding: 0 6px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-soft);
  border-radius: 2px;
  font-size: 12px;
  font-variant-numeric: lining-nums;
  color: var(--text-secondary);
}

/* 結果 / レビュー */
.summary {
  text-align: center;
  margin: 18px 0 24px;
}
.summary-line {
  font-size: 22px;
  margin: 8px 0;
}
.summary-line .num {
  font-weight: 600;
  color: var(--accent);
  font-variant-numeric: lining-nums;
}
.summary-line .sep {
  color: var(--text-muted);
  margin: 0 10px;
  font-style: italic;
  font-weight: 400;
}
.summary-rate {
  font-size: 38px;
  font-weight: 700;
  color: var(--accent);
  margin: 14px 0 4px;
  font-variant-numeric: lining-nums;
}
.summary-cat {
  font-style: italic;
  color: var(--text-muted);
  margin: 0;
  font-size: 14px;
}

.review-list { margin: 0; }
.review-row {
  display: grid;
  grid-template-columns: 24px 1fr;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-soft);
  gap: 10px;
  align-items: baseline;
}
.review-row:last-child { border-bottom: none; }
.review-mark {
  text-align: center;
  font-weight: 600;
  font-style: normal;
}
.review-mark.ok { color: var(--success); }
.review-mark.ng { color: var(--danger); }
.review-headword {
  font-weight: 600;
  margin-right: 10px;
  letter-spacing: 0.005em;
}
.review-meaning {
  color: var(--text-secondary);
  font-style: italic;
}
.review-picked {
  display: block;
  margin-top: 2px;
  margin-left: 6px;
  font-style: italic;
  color: var(--text-muted);
  font-size: 13px;
}
.review-picked::before { content: "└ chose: "; opacity: 0.7; }

/* 履歴ブロック */
.history-summary {
  font-style: italic;
  color: var(--text-secondary);
  margin: 6px 0 16px;
  font-size: 15px;
}
.history-summary .num {
  font-style: normal;
  font-weight: 600;
  color: var(--accent);
}
.history-list {
  border-top: 1px solid var(--border-soft);
  margin-bottom: 10px;
}
.history-row {
  display: grid;
  grid-template-columns: 130px 1fr auto;
  gap: 12px;
  padding: 6px 4px;
  border-bottom: 1px solid var(--border-soft);
  font-size: 14px;
  font-style: italic;
  color: var(--text-secondary);
  align-items: baseline;
}
.history-date { color: var(--text-muted); font-variant-numeric: oldstyle-nums tabular-nums; font-style: normal; font-size: 13px; }
.history-cat { color: var(--text-primary); }
.history-stat { color: var(--accent); font-style: normal; font-weight: 600; font-variant-numeric: oldstyle-nums tabular-nums; }

.data-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 14px;
}

/* フッター */
.page-footer {
  margin-top: 36px;
  text-align: center;
  font-style: italic;
  color: var(--text-muted);
  font-size: 12px;
  letter-spacing: 0.04em;
}
.page-footer p { margin: 0; }

.hidden { display: none !important; }
.italic { font-style: italic; }
.smallcaps { font-variant: small-caps; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="topbar-actions">
      <button class="link-btn" id="home-btn">front page</button>
      <span class="link-divider">·</span>
      <button class="link-btn" id="theme-toggle"><span id="theme-label">light edition</span></button>
    </div>
  </div>

  <header class="masthead">
    <h1 class="masthead-title">CodeEigoDojo</h1>
    <p class="masthead-sub">an engineer&rsquo;s english &middot; a vocabulary in practice</p>
    <hr class="rule-double">
  </header>

  <main>
    <section id="screen-home" class="screen">
      <div id="home-content"></div>
    </section>
    <section id="screen-quiz" class="screen hidden">
      <div id="quiz-content"></div>
    </section>
    <section id="screen-result" class="screen hidden">
      <div id="result-content"></div>
    </section>
  </main>

  <footer class="page-footer">
    <hr class="rule-thin">
    <p>compiled from working vocabularies of software engineering &middot; stored locally only &middot; no external transmission</p>
  </footer>
</div>

<script>
// ============================================================
// データセット
// ----------------------------------------------------------
// 設計方針:
// - meaning は漢字・ひらがな中心で記述し、純カタカナのみの語は不採用
// - abbr / acronym は英語の正式名称を答えとして出題
// ============================================================

const DATA = {};

// 前提（入門）
DATA.prereq = [
  { word: "action", meaning: "操作・動作" },
  { word: "activity", meaning: "活動" },
  { word: "add", meaning: "追加する" },

  { word: "agree", meaning: "同意する" },
  { word: "area", meaning: "領域" },
  { word: "below", meaning: "下記に" },

  { word: "build", meaning: "構築する" },
  { word: "call", meaning: "呼び出す" },
  { word: "change", meaning: "変更する" },
  { word: "check", meaning: "確認する" },
  { word: "child", meaning: "子（要素）" },
  { word: "choose", meaning: "選択する" },
  { word: "clean", meaning: "きれいにする" },
  { word: "close", meaning: "閉じる" },
  { word: "compare", meaning: "比較する" },
  { word: "complete", meaning: "完了する" },
  { word: "correct", meaning: "正確な・訂正する" },
  { word: "create", meaning: "作成する" },
  { word: "describe", meaning: "説明する" },
  { word: "description", meaning: "説明" },
  { word: "detail", meaning: "詳細" },
  { word: "event", meaning: "出来事・契機" },
  { word: "example", meaning: "例" },
  { word: "extra", meaning: "余分な・追加の" },
  { word: "false", meaning: "誤りの・偽の" },
  { word: "final", meaning: "最終の" },
  { word: "find", meaning: "検索する・見つける" },
  { word: "finish", meaning: "終了する" },
  { word: "follow", meaning: "従う" },
  { word: "free", meaning: "空きの・無料の" },
  { word: "get", meaning: "取得する" },
  { word: "health", meaning: "正常性" },
  { word: "improve", meaning: "改善する" },
  { word: "include", meaning: "含む" },

  { word: "number", meaning: "数" },
  { word: "object", meaning: "対象・物体" },
  { word: "open", meaning: "開く" },
  { word: "parent", meaning: "親（要素）" },
  { word: "play", meaning: "再生する" },
  { word: "post", meaning: "書き込む・投稿" },
  { word: "prepare", meaning: "準備する" },
  { word: "problem", meaning: "問題" },
  { word: "product", meaning: "製品" },
  { word: "read", meaning: "読み取る" },
  { word: "return", meaning: "戻す・返す" },
  { word: "rule", meaning: "規則" },
  { word: "run", meaning: "実行する" },
  { word: "section", meaning: "部分・節" },
  { word: "see", meaning: "参照する・見る" },
  { word: "send", meaning: "送信する" },

  { word: "statement", meaning: "文・命令文" },

  { word: "you", meaning: "あなた・利用者" },

];

// ベーシック
DATA.basic = [
  { word: "accept", meaning: "受諾する・受け入れる" },
  { word: "access", meaning: "利用する・入手する" },
  { word: "account", meaning: "口座・利用権" },
  { word: "allow", meaning: "可能にする・許可する" },
  { word: "alternative", meaning: "代替の" },
  { word: "apply", meaning: "適用する" },
  { word: "argument", meaning: "引数・実引数" },
  { word: "array", meaning: "配列" },

// ============================================================
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n, exclude) {
  const pool = arr.filter(item => !exclude.includes(item));
  return shuffleArray(pool).slice(0, n);
}

function getCategorySource(catId) {
  if (catId === "all") {
    return [
      ...DATA.prereq.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.basic.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.advanced.map(x => ({ ...x, _kind: "meaning" })),
      ...DATA.abbr.map(x => ({ ...x, _kind: "abbr" })),
      ...DATA.acronym.map(x => ({ ...x, _kind: "acronym" })),
    ];
  }
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat) return [];
  return DATA[cat.source].map(x => ({ ...x, _kind: cat.type }));
}

// 出題生成
// ============================================================
// items: クイズ対象の語のリスト
// fullPool: 同一の_kindの全語（誤答抽出用）
function buildQuestion(item, fullPool) {
  const kind = item._kind;
  let prompt, answer, distractorPool;

  if (kind === "meaning") {
    prompt = "次の単語の意味として最も適切なものは？";
    answer = item.meaning;
    distractorPool = fullPool
      .filter(x => x._kind === "meaning" && x.meaning !== item.meaning)
      .map(x => x.meaning);
  } else if (kind === "abbr") {
    prompt = "次の略語の元の英単語として最も適切なものは？";
    answer = item.full;
    distractorPool = fullPool
      .filter(x => x._kind === "abbr" && x.full !== item.full)
      .map(x => x.full);
  } else if (kind === "acronym") {
    prompt = "次の頭字語の正式名称として最も適切なものは？";
    answer = item.full;
    distractorPool = fullPool
      .filter(x => x._kind === "acronym" && x.full !== item.full)
      .map(x => x.full);
  }

  const uniquePool = Array.from(new Set(distractorPool));
  const distractors = pickRandom(uniquePool, 3, [answer]);
  while (distractors.length < 3) {
    distractors.push("（候補不足）");
  }
  const choices = shuffleArray([answer, ...distractors]);
  const correctIndex = choices.indexOf(answer);

  return {
    word: item.word,
    prompt,
    choices,
    correctIndex,
    answer,
    kind,
  };
}

// ============================================================
// IndexedDB ラッパー（外部ライブラリ不使用）
// ============================================================
function openDB() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") {
      reject(new Error("IndexedDB is unavailable"));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "key" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGet(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
    req.onerror = () => reject(req.error);
  }));
}

function idbSet(key, value) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).put({ key, value });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function idbDelete(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

function idbClear() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

// 旧 localStorage 形式が残っている場合の一度きりの引き継ぎ
async function migrateFromLocalStorage() {
  try {
    const raw = localStorage.getItem(LEGACY_LS_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object") {
      if (parsed.theme) await idbSet("theme", parsed.theme);
      if (Array.isArray(parsed.history)) await idbSet("history", parsed.history);
    }
    localStorage.removeItem(LEGACY_LS_KEY);
  } catch (e) {
    console.warn("Legacy migration skipped:", e);
  }
}

async function loadAllFromIDB() {
  try {
    const theme = await idbGet("theme");
    const history = await idbGet("history");
    dataCache.theme = theme || null;
    dataCache.history = Array.isArray(history) ? history : [];
  } catch (e) {
    console.warn("IndexedDB load failed; running without persistence:", e);
    dataCache.theme = null;
    dataCache.history = [];
  }
}

async function recordHistorySession(session) {
  dataCache.history.unshift(session);
  if (dataCache.history.length > 30) dataCache.history.length = 30;
  try {
    await idbSet("history", dataCache.history);
  } catch (e) {
    console.warn("Failed to persist history:", e);
  }
}

async function clearHistoryData() {
  dataCache.history = [];
  try {
    await idbDelete("history");
  } catch (e) {
    console.warn("Failed to clear history:", e);
  }
}

async function clearAllData() {
  dataCache.theme = null;
  dataCache.history = [];
  try {
    await idbClear();
  } catch (e) {
    console.warn("Failed to clear all data:", e);
  }
}

// DOM ヘルパー
// ============================================================
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "style" && typeof v === "object") {
        for (const s in v) e.style[s] = v[s];
      } else if (k === "dataset") {
        for (const d in v) e.dataset[d] = v[d];
      } else if (v === true) e.setAttribute(k, "");
      else if (v === false || v == null) { /* skip */ }
      else e.setAttribute(k, v);
    }
  }
  appendChildren(e, children);
  return e;
}
function appendChildren(parent, children) {
  if (children == null) return;
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null || c === false) return;
    if (typeof c === "string" || typeof c === "number") {
      parent.appendChild(document.createTextNode(String(c)));
    } else parent.appendChild(c);
  });
}

      el("span", { class: "history-date" }, fmtDate(s.timestamp)),
      el("span", { class: "history-cat" }, s.categoryLabel),
      el("span", { class: "history-stat" }, `${s.correct}/${s.total} · ${rate}%`),
    ]));
  });
  root.appendChild(list);
  appendDeleteActions(root);
}

function appendDeleteActions(root) {
  const delHistory = el("button", { class: "btn-link" }, "delete history");
  delHistory.disabled = !dataCache.history.length;
  delHistory.addEventListener("click", async () => {
    if (!dataCache.history.length) return;
    if (!confirm("Delete all session history?")) return;
    await clearHistoryData();
    renderHome();
  });
  const delAll = el("button", { class: "btn-link" }, "clear all data");
  delAll.disabled = !(dataCache.history.length || dataCache.theme);
  delAll.addEventListener("click", async () => {
    if (!confirm("Clear all stored data (theme + history)?")) return;
    await clearAllData();
    const sys = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    applyThemeUI(sys);
    renderHome();
  });
  root.appendChild(el("div", { class: "data-actions" }, [delHistory, delAll]));
}

// ============================================================
// 演習開始
// ============================================================
function startQuiz() {
  const catId = state.selectedCategory;
  const source = getCategorySource(catId);
  if (source.length === 0) {
    alert("No entries available for this section.");
    return;
  }
  const shuffle = document.getElementById("shuffle-check").checked;
  const qcountVal = document.getElementById("qcount-select").value;
  const ordered = shuffle ? shuffleArray(source) : source.slice();
  const limit = qcountVal === "all" ? ordered.length : Math.min(parseInt(qcountVal, 10), ordered.length);
  const items = ordered.slice(0, limit);

  state.questions = items.map(item => buildQuestion(item, source));
  state.currentIdx = 0;
  state.correctCount = 0;
  state.answers = [];
  state.awaitingNext = false;

  document.getElementById("screen-home").classList.add("hidden");
  document.getElementById("screen-result").classList.add("hidden");
  document.getElementById("screen-quiz").classList.remove("hidden");
  renderQuestion();
}

// ============================================================
// 出題
// ============================================================
function renderQuestion() {
  const q = state.questions[state.currentIdx];
  const cat = getCurrentCategory();
  const root = document.getElementById("quiz-content");
  root.innerHTML = "";

  // ランニングヘッダー
  root.appendChild(el("div", { class: "running-header" }, [
    el("span", { class: "italic" }, cat.label + " — " + categoryGloss(cat.id)),
    el("span", null, "entry " + (state.currentIdx + 1) + " of " + state.questions.length),
  ]));

  // 見出し語
  root.appendChild(el("div", { class: "headword" }, [
    el("h1", { class: "headword-title" }, q.word),
    el("p", { class: "headword-pron" }, headwordKindLabel(q.kind)),
  ]));

  // プロンプト
  root.appendChild(el("p", { class: "headword-prompt" }, q.prompt));

  // 定義リスト（選択肢）
  const entries = el("div", { class: "entries" });
  q.choices.forEach((c, i) => {
    const entry = el("div", { class: "entry", dataset: { idx: String(i) } }, [
      el("span", { class: "entry-num" }, (i + 1) + "."),
      el("span", { class: "entry-text" }, c),
    ]);
    entry.addEventListener("click", () => handleChoice(i));
    entries.appendChild(entry);
  });
  root.appendChild(entries);

  // フィードバックプレースホルダー
  const fb = el("div", { class: "feedback", id: "quiz-feedback" });
  root.appendChild(fb);

  // 操作行
  const quitBtn = el("button", { class: "btn", id: "quit-btn" }, "quit");
  quitBtn.addEventListener("click", () => {
    if (state.answers.length === 0 || confirm("Quit current session and return to the front page?")) {
      showScreen("home");
    }
  });
  const nextBtn = el("button", { class: "btn btn-primary", id: "next-btn" }, "next entry ▸");
  nextBtn.disabled = true;
  nextBtn.addEventListener("click", goNext);
  root.appendChild(el("div", { class: "actions" }, [quitBtn, nextBtn]));

  // フットノート
  root.appendChild(el("p", { class: "footnote" }, [
    "press ",
    el("span", { class: "kbd" }, "1"),
    "–",
    el("span", { class: "kbd" }, "4"),
    " to choose · ",
    el("span", { class: "kbd" }, "↵"),
    " for next entry",
  ]));
}

// 出題種別ごとの説明（IPA風ラベル相当）
function headwordKindLabel(kind) {
  if (kind === "abbr") return "abbr. — give the unabbreviated form";
  if (kind === "acronym") return "acronym — give the expanded form";
  return "give the closest meaning";
}

// ============================================================
// 解答処理
// ============================================================
function handleChoice(idx) {
  if (state.awaitingNext) return;
  const q = state.questions[state.currentIdx];
  const isCorrect = idx === q.correctIndex;
  if (isCorrect) state.correctCount++;
  state.answers.push({ word: q.word, picked: idx, correct: q.correctIndex, isCorrect, answer: q.answer, choices: q.choices });
  state.awaitingNext = true;

  document.querySelectorAll("#quiz-content .entry").forEach((entry, i) => {
    entry.classList.add("disabled");
    if (i === q.correctIndex) entry.classList.add("correct");
    else if (i === idx) entry.classList.add("incorrect");
  });

  const fb = document.getElementById("quiz-feedback");
  if (fb) {
    fb.innerHTML = "";
    fb.classList.add("show", isCorrect ? "correct" : "incorrect");
    fb.appendChild(document.createTextNode(isCorrect ? "✓ correct — " : "✗ misread — "));
    fb.appendChild(el("strong", null, q.word));
    fb.appendChild(document.createTextNode(" : " + q.answer));
  }

  const nextBtn = document.getElementById("next-btn");
  if (nextBtn) { nextBtn.disabled = false; nextBtn.focus(); }
}

// ============================================================
// 次へ / 終了
// ============================================================
function goNext() {
  if (!state.awaitingNext) return;
  state.currentIdx++;
  if (state.currentIdx >= state.questions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz() {
  const total = state.answers.length;
  const correct = state.correctCount;
  const rate = total > 0 ? Math.round(correct / total * 100) : 0;
  const cat = getCurrentCategory();

  const root = document.getElementById("result-content");
  root.innerHTML = "";

  // ランニングヘッダー
  root.appendChild(el("div", { class: "running-header" }, [
    el("span", { class: "italic" }, "session result"),
    el("span", null, cat.label),
  ]));

  root.appendChild(el("h2", { class: "section-heading" }, "Summary"));

  // サマリー
  root.appendChild(el("div", { class: "summary" }, [
    el("p", { class: "summary-line" }, [
      el("span", { class: "num" }, String(correct)),
      el("span", { class: "sep" }, "of"),
      el("span", { class: "num" }, String(total)),
      el("span", { class: "sep" }, " entries"),
    ]),
    el("div", { class: "summary-rate" }, rate + "%"),
    el("p", { class: "summary-cat" }, cat.label + " · " + categoryGloss(cat.id)),
  ]));

  // 装飾罫線
  root.appendChild(el("hr", { class: "rule-thin" }));

  root.appendChild(el("h2", { class: "section-heading" }, "Review"));

  // レビュー
  const reviewList = el("div", { class: "review-list" });
  state.answers.forEach(a => {
    const main = el("span", null, [
      el("span", { class: "review-headword" }, a.word),
      el("span", { class: "review-meaning" }, "— " + a.answer),
      a.isCorrect ? null : el("span", { class: "review-picked" }, a.choices[a.picked] || "—"),
    ]);
    reviewList.appendChild(el("div", { class: "review-row" }, [
      el("span", { class: "review-mark " + (a.isCorrect ? "ok" : "ng") }, a.isCorrect ? "✓" : "✗"),
      main,
    ]));
  });
  root.appendChild(reviewList);

  // 装飾罫線
  root.appendChild(el("hr", { class: "rule-thin" }));

  // 操作
  const back = el("button", { class: "btn", id: "back-home-btn" }, "← back to front page");
  back.addEventListener("click", () => showScreen("home"));
  const retry = el("button", { class: "btn btn-primary", id: "retry-btn" }, "run again ▸");
  retry.addEventListener("click", startQuiz);
  root.appendChild(el("div", { class: "actions" }, [back, retry]));

  // 履歴保存（fire-and-forget）
  recordHistorySession({
    timestamp: Date.now(),
    categoryId: state.selectedCategory,
    categoryLabel: cat.label,
    total,
    correct,
  });

  document.getElementById("screen-quiz").classList.add("hidden");
  document.getElementById("screen-home").classList.add("hidden");
  document.getElementById("screen-result").classList.remove("hidden");
}

// ============================================================
// テーマ
// ============================================================
function applyThemeUI(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const lab = document.getElementById("theme-label");
  if (lab) lab.textContent = theme === "dark" ? "evening edition" : "light edition";
}

function applyTheme(theme) {
  applyThemeUI(theme);
  dataCache.theme = theme;
  idbSet("theme", theme).catch(e => console.warn("Failed to persist theme:", e));
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(current === "dark" ? "light" : "dark");
}

// ============================================================
// 初期化
// ============================================================
async function init() {
  const sysTheme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  applyThemeUI(sysTheme);

  await migrateFromLocalStorage();
  await loadAllFromIDB();

  applyThemeUI(dataCache.theme || sysTheme);

  showScreen("home");

  document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  document.getElementById("home-btn").addEventListener("click", () => showScreen("home"));

  document.addEventListener("keydown", (e) => {
    const quizVisible = !document.getElementById("screen-quiz").classList.contains("hidden");
    if (!quizVisible) return;
    if (e.key >= "1" && e.key <= "4") {
      const idx = parseInt(e.key, 10) - 1;
      if (state.awaitingNext) return;
      const entries = document.querySelectorAll("#quiz-content .entry");
      if (entries[idx]) entries[idx].click();
    } else if (e.key === "Enter" && state.awaitingNext) {
      e.preventDefault();
      goNext();
    }
  });
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
