    <link

    />
    <style>
      @layer reset, base, component, utility;

      @layer reset {
        *,
        *::before,
        *::after {
          box-sizing: border-box;
        }
        * {
          margin: 0;
          padding: 0;
        }
      }

      @layer base {
        .gm:where(:not(.gm .gm)),
        .gm[data-mode='light'] {
          --gm-on-brand: oklch(1 0 0);
          --gm-text: oklch(0.286632 0.016991 255.659);
          --gm-muted: oklch(0.487553 0.026997 252.373);
          --gm-surface: oklch(1 0 0);
          --gm-background: oklch(0.972949 0.00287 264.542);
          --gm-border: oklch(0.886571 0.01103 256.699);
          --gm-input-border: oklch(0.605714 0.024945 254.473);
          --gm-success: oklch(0.436242 0.089513 157.983);
          --gm-success-bg: oklch(0.966985 0.013192 159.918);
          --gm-warning: oklch(0.462612 0.096992 76.457);
          --gm-warning-bg: oklch(0.97412 0.031623 89.136);
          --gm-error: oklch(0.483677 0.170323 26.393);
          --gm-error-bg: oklch(0.966944 0.016239 17.438);
          --gm-on-error: oklch(1 0 0);
          --gm-backdrop: oklch(0 0 0 / 0.4);
          --gm-brand: var(--gm-light-brand, oklch(0.441853 0.155688 260.321));
          --gm-brand-hover: var(--gm-light-brand-hover, oklch(0.385255 0.132787 260.359));
          --gm-brand-soft: var(--gm-light-brand-soft, oklch(0.962839 0.009107 258.336));
          --gm-focus: var(--gm-light-focus, oklch(0.441853 0.155688 260.321));
        }
        .gm[data-mode='dark'] {
          --gm-on-brand: oklch(0.211693 0.020091 258.342);
          --gm-text: oklch(0.938457 0.008003 253.855);
          --gm-muted: oklch(0.795041 0.019706 255.553);
          --gm-surface: oklch(0.253864 0.02155 257.281);
          --gm-background: oklch(0.211693 0.020091 258.342);
          --gm-border: oklch(0.416114 0.030959 255.696);
          --gm-input-border: oklch(0.674956 0.029273 255.145);
          --gm-success: oklch(0.80967 0.107596 157.04);
          --gm-success-bg: oklch(0.296026 0.038217 167.705);
          --gm-warning: oklch(0.832567 0.113907 84.145);
          --gm-warning-bg: oklch(0.298703 0.035681 83.807);
          --gm-error: oklch(0.820755 0.100577 19.45);
          --gm-error-bg: oklch(0.293569 0.038567 9.274);
          --gm-on-error: oklch(0.211693 0.020091 258.342);
          --gm-backdrop: oklch(0 0 0 / 0.65);
          --gm-brand: var(--gm-dark-brand, oklch(0.800117 0.050554 259.776));
          --gm-brand-hover: var(--gm-dark-brand-hover, oklch(0.825095 0.044102 259.18));
          --gm-brand-soft: var(--gm-dark-brand-soft, oklch(0.318743 0.04006 258.824));
          --gm-focus: var(--gm-dark-focus, oklch(0.800117 0.050554 259.776));
        }

        .gm {
          --gm-font: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
          --gm-text-size: 0.875rem;
          --gm-label-size: 0.8125rem;
          --gm-meta-size: 0.75rem;
          --gm-title-size: 1rem;
          --gm-title-line-height: 1.5rem;
          --gm-section-title-size: 0.875rem;
          --gm-section-title-line-height: 1.25rem;
          --gm-space-1: 0.25rem;
          --gm-space-2: 0.5rem;
          --gm-space-3: 0.75rem;
          --gm-space-4: 1rem;
          --gm-space-5: 1.5rem;
          --gm-radius: 0.25rem;
          --gm-control-height: 1.75rem;
          --gm-button-height: 1.875rem;
          --gm-button-padding-block: 0.125rem;
          --gm-control-padding-block: 0.125rem;
          --gm-control-padding-inline: 0.5rem;
          --gm-icon-size: 1rem;
          font-family: var(--gm-font);
          font-size: var(--gm-text-size);
          line-height: 1.65;
          color: var(--gm-text);
          background: var(--gm-background);
        }

        body {
          min-height: 100dvh;
          display: flex;
          flex-direction: column;
        }

        button,
        input,
        textarea {
          font: inherit;
          color: inherit;
        }
        button {
          cursor: pointer;
        }
        h1,
        h2 {
          text-wrap: balance;
        }
        .gm h1 {
          font-size: var(--gm-title-size);
          line-height: var(--gm-title-line-height);
        }
        .gm h2 {
          font-size: var(--gm-section-title-size);
          line-height: var(--gm-section-title-line-height);
        }

        .gm :focus-visible {
          outline: 2px solid var(--gm-focus);
          outline-offset: -2px;
        }
      }

      @layer component {
        .gm {
          .gm-panel {
            background: var(--gm-surface);
            border: 1px solid var(--gm-border);
            border-radius: var(--gm-radius);
          }

          .gm-label {
            font-size: var(--gm-label-size);
            font-weight: 600;
          }

          .gm-input,
          .gm-textarea {
            width: 100%;
            min-width: 0;
            min-height: var(--gm-control-height);
            padding: var(--gm-control-padding-block) var(--gm-control-padding-inline);
            background: var(--gm-surface);
            border: 1px solid var(--gm-input-border);
            border-radius: var(--gm-radius);
            font-size: var(--gm-text-size);
            line-height: 1.5;

            &::placeholder {
              color: var(--gm-muted);
              opacity: 1;
            }
            &[readonly] {
              background: var(--gm-background);
            }
          }

          .gm-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--gm-space-2);
            min-height: var(--gm-button-height);
            padding: var(--gm-button-padding-block) var(--gm-control-padding-inline);
            border: 1px solid var(--gm-input-border);
            border-radius: var(--gm-radius);
            background: var(--gm-surface);
            font-size: var(--gm-label-size);
            font-weight: 600;
            line-height: 1.5;
            text-align: center;

            &:hover:not(:disabled) {
              background: var(--gm-background);
            }
            &:disabled {
              cursor: not-allowed;
              opacity: 0.55;
            }
          }

          .gm-btn-primary {
            color: var(--gm-on-brand);
            background: var(--gm-brand);
            border-color: var(--gm-brand);

            &:hover:not(:disabled) {
              background: var(--gm-brand-hover);
            }
            &:focus-visible {
              outline-color: var(--gm-on-brand);
              outline-offset: -3px;
            }
          }

          .gm-icon {
            display: block;
            width: var(--gm-icon-size);
            height: var(--gm-icon-size);
            flex: none;
            fill: currentColor;
          }

          .gm-icon-btn {
            width: var(--gm-button-height);
            min-width: var(--gm-button-height);
            padding: 0;
          }
        }

        .header {
          flex: none;
          background: var(--gm-surface);
        }

        .header-content {
          padding: var(--gm-space-2) max(var(--gm-space-5), env(safe-area-inset-right)) var(--gm-space-2)
            max(var(--gm-space-5), env(safe-area-inset-left));
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: var(--gm-space-4);
        }

        .logo {
          display: flex;
          align-items: center;
          gap: var(--gm-space-2);
          font-weight: 600;

          .logo-icon {
            width: 1.25rem;
            height: 1.25rem;
            color: var(--gm-brand);
            flex: none;
          }
        }

        .header-actions {
          display: flex;
          align-items: center;
          flex: none;
        }

        .main {
          width: 100%;
          padding: var(--gm-space-4) max(var(--gm-space-5), env(safe-area-inset-right))
            max(var(--gm-space-5), env(safe-area-inset-bottom)) max(var(--gm-space-5), env(safe-area-inset-left));
          flex: 1;
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
          gap: var(--gm-space-4);
        }

        .panel {
          min-width: 0;
          min-height: 0;
        }

        .panel-input {
          padding: var(--gm-space-3);
          display: flex;
          flex-direction: column;
          gap: var(--gm-space-2);
        }

        .section-label {
          line-height: var(--gm-section-title-line-height);
        }

        .gm .gm-textarea {
          padding: var(--gm-space-2);
          font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
          resize: none;
          tab-size: 4;
        }

        #input-area {
          flex: 1;
          min-height: 17.5rem;
        }

        .panel-output {
          display: grid;
          grid-template-rows: repeat(5, minmax(7.5rem, 1fr));
          gap: var(--gm-space-2);
        }

        .output-card {
          padding: var(--gm-space-2) var(--gm-space-3);
          display: flex;
          flex-direction: column;
          gap: var(--gm-space-2);
          min-width: 0;
          min-height: 0;
        }

        .card-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: var(--gm-space-2);
        }

        .card-title {
          font-weight: 600;
          min-width: 0;
          overflow-wrap: anywhere;
        }

        .card-header-actions {
          display: flex;
          align-items: center;
          justify-content: flex-end;
          flex-wrap: wrap;
          gap: var(--gm-space-2);
          min-width: 0;
          max-width: 100%;
          margin-inline-start: auto;
        }

        .output-area {
          flex: 1;
          min-height: 3rem;
        }

        .gm .table-name-input {
          width: 15rem;
          max-width: 100%;
        }
        .gm .number-offset-input {
          width: 7.5rem;
          text-align: start;
          font-variant-numeric: tabular-nums;

          &::-webkit-inner-spin-button {
            margin-inline-start: var(--gm-space-2);
          }
        }

        .gm .copy-btn {
          flex: none;
          max-width: 100%;

          &.copied {
            color: var(--gm-success);
            background: var(--gm-success-bg);
            border-color: var(--gm-success);

            &:focus-visible {
              outline-color: var(--gm-success);
              outline-offset: -2px;
            }
          }
        }

        .copy-label {
          min-width: 0;
          overflow-wrap: anywhere;
        }

        .switch {
          position: relative;
          cursor: pointer;

          input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            opacity: 0;
            cursor: pointer;
          }

          &:has(input:focus-visible) {
            outline: 2px solid var(--gm-focus);
            outline-offset: -2px;
          }
          input:checked ~ .gm-mode-light,
          input:not(:checked) ~ .gm-mode-dark {
            display: none;
          }
        }

        @media (max-width: 61.25rem) {
          .main {
            grid-template-columns: minmax(0, 1fr);
          }
          .panel-output {
            grid-template-rows: none;
          }
          .gm .output-area {
            min-height: 8.5rem;
          }
        }

        @media (max-width: 40rem) {
          .header-content,
          .main {
            padding-inline: max(var(--gm-space-3), env(safe-area-inset-left))
              max(var(--gm-space-3), env(safe-area-inset-right));
          }

          .main {
            gap: var(--gm-space-3);
          }
          .output-card {
            padding: var(--gm-space-2);
          }
          .card-header:has(.card-header-actions) {
            align-items: flex-start;
            flex-direction: column;
          }
          .card-header-actions {
            width: 100%;
            margin-inline-start: 0;
          }
          .gm .table-name-input,
          .gm .number-offset-input {
            flex: 1;
            width: 0;
            min-width: 5rem;
          }
        }

        @media (any-pointer: coarse) {
          .gm {
            --gm-control-height: 2.75rem;
            --gm-button-height: 2.75rem;
            --gm-button-padding-block: 0.5rem;
            --gm-control-padding-block: 0.5rem;
            --gm-icon-size: 1.25rem;
          }

          .gm .gm-input,
          .gm .gm-textarea {
            font-size: 1rem;
          }
        }

        @media (forced-colors: active) {
          .gm :focus-visible,
          .gm .gm-btn-primary:focus-visible,
          .gm .copy-btn.copied:focus-visible,
          .switch:has(input:focus-visible) {
            outline-color: Highlight;
          }
          .gm .gm-btn,
          .gm .gm-input,
          .gm .gm-textarea {
            border-color: ButtonText;
          }
          .gm .gm-btn:disabled {
            color: GrayText;
            border-color: GrayText;
            opacity: 1;
          }
        }
      }

      @layer utility {
        .sr-only {
          position: absolute;
          width: 1px;
          height: 1px;
          margin: -1px;
          padding: 0;
          overflow: hidden;
          border: 0;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
        }
      }
    </style>
  </head>

    <main class="main" id="app-main">

                >

    <script>
      const STORAGE_KEY = 'textChanger_settings';
      const COPY_RESET_MS = 2000;
      const SAVE_DELAY_MS = 500;
      const MAX_SAVE_WAIT_MS = 2000;
      const PG_IDENTIFIER_MAX_BYTES = 63;
      const UTF8_ENCODER = new TextEncoder();
      const SETTINGS_FIELDS = ['input', 'pgTableName', 'numberOffset', 'theme'];
      const PG_TABLE_NAME_PLACEHOLDER = '???';
      const DEFAULT_PG_TABLE_INPUT = '';
      const DEFAULT_NUMBER_OFFSET_INPUT = '';
      const LIGHT_THEME = 'light';
      const DARK_THEME = 'dark';
      const DEFAULT_THEME = LIGHT_THEME;
      const qs = (sel, root = document) => root.querySelector(sel);
      const qsa = (sel, root = document) => [...root.querySelectorAll(sel)];

      const COPY_ICON_PATHS = {
        content_copy:
          'M360-240q-29.7 0-50.85-21.15Q288-282.3 288-312v-480q0-29.7 21.15-50.85Q330.3-864 360-864h384q29.7 0 50.85 21.15Q816-821.7 816-792v480q0 29.7-21.15 50.85Q773.7-240 744-240H360Zm0-72h384v-480H360v480ZM216-96q-29.7 0-50.85-21.15Q144-138.3 144-168v-552h72v552h456v72H216Zm144-216v-480 480Z',
        check: 'M389-267 195-460l51-52 143 143 325-324 51 51-376 375Z'
      };
      const COPY_TIMER_MAP = new WeakMap();
      const COPY_REQUEST_MAP = new WeakMap();
      const OUTPUT_VALUE_MAP = new Map();
      const $inputArea = qs('#input-area');
      const $lightModeToggle = qs('#lightModeToggle');
      const $pgTableNameInput = qs('#pg-table-name');
      const $numberOffsetInput = qs('#number-offset');
      const $outputA5m2 = qs('#output-a5m2');
      const $outputTsv = qs('#output-tsv');
      const $outputSqlIn = qs('#output-sql-in');
      const $outputPgSql = qs('#output-pg-sql');
      const $outputNumberAdjust = qs('#output-number-adjust');
      const $main = qs('#app-main');

      let _saveTimeout;
      let _maxSaveTimeout;
      let _lastSavedSettings = {};
      let _lastConversion = {};
      let _lastPgPreparation = {};
      let _activeCopyRequest;
      let $compositionTarget = null;

      function _getThemeFromToggle() {
        return $lightModeToggle.checked ? LIGHT_THEME : DARK_THEME;
      }

      function _getStoredTheme(theme) {
        return theme === LIGHT_THEME || theme === DARK_THEME ? theme : DEFAULT_THEME;
      }

      function _applyTheme(theme) {
        const _theme = _getStoredTheme(theme);
        document.documentElement.setAttribute('data-theme', _theme);
        document.documentElement.style.colorScheme = _theme;
        document.body.dataset.mode = _theme;
        $lightModeToggle.checked = _theme === LIGHT_THEME;
      }

      function _getLines(text) {
        return text
          .split(/\r\n|[\r\n]/)
          .map((line) => line.trim())
          .filter((line) => line.length > 0);
      }

      function _convertA5m2(lines) {
        if (lines.length === 0 || lines.some((value) => /[,\r\n]/.test(value) || !_isValidSqlText(value))) return '';
        return `--*Captions ${lines.join(',')}`;
      }

      function _convertTsv(lines) {
        if (lines.length === 0) return '';
        return lines.map((value) => (/["\t\r\n]/.test(value) ? `"${value.replaceAll('"', '""')}"` : value)).join('\t');
      }

      function _convertSqlIn(lines) {
        if (lines.length === 0 || lines.some((value) => !_isValidSqlText(value))) return '';
        const _quoted = lines.map((value) => `'${_escapePgStringLiteral(value)}'`).join(',');
        return `in (${_quoted});`;
      }

      function _parseTsvRecords(text, _acceptRecord = null) {
        const _text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
        const _records = [];
        let _row = [];
        let _cell = '';
        let _cellStart = 0;
        let _quoted = false;
        let _closedQuote = false;
        let _recordStarted = false;

        for (let _index = 0; _index <= _text.length; _index += 1) {
          const _char = _text[_index];
          if (_quoted) {
            if (_char === undefined) return null;
            if (_char === '"') {
              _cell += _text.slice(_cellStart, _index);
              if (_text[_index + 1] === '"') {
                _cell += '"';
                _index += 1;
              } else {
                _quoted = false;
                _closedQuote = true;
              }
              _cellStart = _index + 1;
            }
            continue;
          }

          if (_char === '\t' || _char === '\n' || _char === undefined) {
            _cell += _text.slice(_cellStart, _index);
            _row.push(_cell);
            if (_char === '\t') {
              _recordStarted = true;
            } else {
              if (_recordStarted || _cell.trim().length > 0) {
                if (_acceptRecord && !_acceptRecord(_row)) return null;
                _records.push(_row);
              }
              _row = [];
              _recordStarted = false;
            }
            _cell = '';
            _cellStart = _index + 1;
            _closedQuote = false;
          } else if (_closedQuote) {
            return null;
          } else if (_char === '"' && _index === _cellStart) {
            _quoted = true;
            _recordStarted = true;
            _cellStart = _index + 1;
          }
        }
        return _records;
      }

      function _isValidSqlText(value) {
        return !/[\0\uD800-\uDFFF]/u.test(value);
      }

      function _isValidPgIdentifier(value) {
        return (
          value.length > 0 &&
          value.length <= PG_IDENTIFIER_MAX_BYTES &&
          _isValidSqlText(value) &&
          UTF8_ENCODER.encode(value).length <= PG_IDENTIFIER_MAX_BYTES
        );
      }

      function _parseTabularInput(text) {
        if (!_isValidSqlText(text)) return { headers: [], rows: [] };
        let _headers;
        const _records = _parseTsvRecords(text, (_row) => {
          if (_headers) return _row.length === _headers.length;
          _headers = _row.map((cell) => cell.trim());
          return _headers.every((header) => _isValidPgIdentifier(header)) && new Set(_headers).size === _headers.length;
        });
        if (!_records || _records.length < 2) {
          return { headers: [], rows: [] };
        }

        return { headers: _headers, rows: _records.slice(1) };
      }

      function _escapePgIdentifier(value) {
        return String(value).replaceAll('"', '""');
      }

      function _escapePgStringLiteral(value) {
        return value.replaceAll("'", "''");
      }

      function _isPgNullToken(value) {
        const _trimmed = String(value ?? '').trim();
        return /^(?:NULL|<<\s*NULL\s*>>|<\s*NULL\s*>|«\s*NULL\s*»)$/i.test(_trimmed);
      }

      function _normalizePgWhereValue(value) {
        const _trimmed = String(value ?? '').trim();
        if (_trimmed.length === 0 || _isPgNullToken(_trimmed)) {
          return null;
        }
        return String(value);
      }

      function _normalizePgInsertValue(value) {
        const _trimmed = String(value ?? '').trim();
        if (_isPgNullToken(_trimmed)) {
          return null;
        }
        if (_trimmed.length === 0) {
          return ' ';
        }
        return String(value);
      }

      function _formatPgValue(value) {
        if (value === null) {
          return 'NULL';
        }
        const _escaped = _escapePgStringLiteral(value);
        return value.includes('\\') ? `E'${_escaped.replaceAll('\\', '\\\\')}'` : `'${_escaped}'`;
      }

      function _getResolvedPgTableName(value) {
        const _tableName = String(value || '').trim();
        if (!_tableName) return PG_TABLE_NAME_PLACEHOLDER;
        const _partPattern =
          /\s*("(?:[^"\0]|""){0,63}"|[A-Za-z_\u0080-\uFFFF][A-Za-z0-9_$\u0080-\uFFFF]{0,62})\s*(\.|$)/gy;
        const _parts = [];
        let _position = 0;
        while (_position < _tableName.length) {
          const _match = _partPattern.exec(_tableName);
          if (!_match) return '';
          const _part = _match[1];
          const _name = _part.startsWith('"')
            ? _part.slice(1, -1).replaceAll('""', '"')
            : _part.replace(/[A-Z]/g, (letter) => letter.toLowerCase());
          if (!_isValidPgIdentifier(_name)) return '';
          _parts.push(`"${_escapePgIdentifier(_name)}"`);
          _position = _partPattern.lastIndex;
          if (_match[2] === '.' && (_position === _tableName.length || _parts.length === 3)) return '';
        }
        return _parts.length <= 3 ? _parts.join('.') : '';
      }

      function _preparePostgreSQLBlock(text) {
        const _table = _parseTabularInput(text);
        if (_table.headers.length === 0 || _table.rows.length === 0) {
          return null;
        }

        const _quotedColumns = _table.headers.map((column) => `"${_escapePgIdentifier(column)}"`);
        const _columnList = _quotedColumns.join(', ');
        const _rowConditions = new Set();
        const _valueRows = _table.rows.map((row) => {
          const _conditions = [];
          const _values = row.map((value, index) => {
            const _formatted = _formatPgValue(_normalizePgInsertValue(value));
            if (_normalizePgWhereValue(value) !== null) {
              _conditions.push(`${_quotedColumns[index]} = ${_formatted}`);
            }
            return _formatted;
          });
          if (_conditions.length > 0) _rowConditions.add(_conditions.join(' AND '));
          return `  (${_values.join(', ')})`;
        });

        const _whereClause =
          _rowConditions.size > 0
            ? [..._rowConditions].map((_condition) => `(${_condition})`).join('\n   OR ')
            : '1 = 0';
        return { columnList: _columnList, whereClause: _whereClause, valuesList: _valueRows.join(',\n') };
      }

      function _convertPostgreSQLBlock(text, tableName) {
        if (_lastPgPreparation.input !== text) _lastPgPreparation = { input: text };
        const _tableName = _getResolvedPgTableName(tableName);
        if (!_tableName) return '';
        if (_lastPgPreparation.parts === undefined) {
          _lastPgPreparation.parts = _preparePostgreSQLBlock(text);
        }
        const _parts = _lastPgPreparation.parts;
        if (!_parts) return '';
        const { columnList: _columnList, whereClause: _whereClause, valuesList: _valuesList } = _parts;
        const _selectStatement = `SELECT * FROM ${_tableName}\nWHERE ${_whereClause}\n;`;
        const _deleteStatement = `DELETE FROM ${_tableName}\nWHERE ${_whereClause}\n;`;

        const _insertStatement = `INSERT INTO ${_tableName} (${_columnList}) VALUES\n${_valuesList}\n;`;

        return [
          '-- SELECT文（事前チェック）',
          _selectStatement,
          '',
          '-- INSERT文',
          'BEGIN;',
          _insertStatement,
          'COMMIT;',
          '',
          '-- DELETE文',
          'BEGIN;',
          _deleteStatement,
          'COMMIT;'
        ].join('\n');
      }

      function _parseNumberOffset(value) {
        const _trimmed = String(value ?? '').trim();
        return /^[+-]?\d+$/.test(_trimmed) ? BigInt(_trimmed) : 0n;
      }

      function _convertNumberAdjustment(text, offsetValue) {
        if (!text) return '';
        const _offset = _parseNumberOffset(offsetValue);
        if (_offset === 0n) return text;
        return text.replace(/\d+/g, (match) => String(BigInt(match) + _offset));
      }

      function _setInvalidState($control, _invalid) {
        const _value = String(_invalid);
        if ($control.getAttribute('aria-invalid') !== _value) $control.setAttribute('aria-invalid', _value);
      }

      function _convertAll() {
        const _input = $inputArea.value;
        const _tableName = $pgTableNameInput.value;
        const _offset = $numberOffsetInput.value;
        if (_tableName !== _lastConversion.tableName) {
          _setInvalidState($pgTableNameInput, _getResolvedPgTableName(_tableName) === '');
        }
        _setInvalidState(
          $numberOffsetInput,
          $numberOffsetInput.validity.badInput || (_offset !== '' && !/^[+-]?\d+$/.test(_offset))
        );
        const _inputChanged = _input !== _lastConversion.input;
        const _results = [];
        if (_inputChanged) {
          const _lines = _getLines(_input);
          _results.push(
            [$outputA5m2, _convertA5m2(_lines)],
            [$outputTsv, _convertTsv(_lines)],
            [$outputSqlIn, _convertSqlIn(_lines)]
          );
        }
        if (_inputChanged || _tableName !== _lastConversion.tableName) {
          _results.push([$outputPgSql, _convertPostgreSQLBlock(_input, _tableName)]);
        }
        if (_inputChanged || _offset !== _lastConversion.offset) {
          _results.push([$outputNumberAdjust, _convertNumberAdjustment(_input, _offset)]);
        }
        _lastConversion = { input: _input, tableName: _tableName, offset: _offset };
        const _changedTargets = new Set();
        _results.forEach(([$target, _value]) => OUTPUT_VALUE_MAP.set($target, _value));
        OUTPUT_VALUE_MAP.forEach((_value, $target) => {
          if ($target.value === _value) return;
          $target.value = _value;
          _changedTargets.add($target);
        });

        qsa('.copy-btn', $main).forEach(($button) => {
          const $target = qs($button.dataset.copyTarget);
          const _disabled = !$target?.value;
          if ($button.disabled !== _disabled) $button.disabled = _disabled;
          if ($button.disabled || _changedTargets.has($target)) {
            COPY_REQUEST_MAP.delete($button);
            _resetCopyState($button);
          }
        });
      }

      function _saveSettings() {
        clearTimeout(_saveTimeout);
        clearTimeout(_maxSaveTimeout);
        _maxSaveTimeout = undefined;
        const _settings = _getCurrentSettings();
        const _changedFields = SETTINGS_FIELDS.filter((_field) => _settings[_field] !== _lastSavedSettings[_field]);
        if (_changedFields.length === 0) return;
        try {
          const _merged = _readStoredSettings();
          _changedFields.forEach((_field) => {
            _merged[_field] = _settings[_field];
          });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(_merged));
          _lastSavedSettings = _settings;
        } catch {}
      }

      function _getCurrentSettings() {
        return {
          input: $inputArea.value,
          pgTableName: $pgTableNameInput.value,
          numberOffset: $numberOffsetInput.value,
          theme: _getThemeFromToggle()
        };
      }

      function _readStoredSettings() {
        const _raw = localStorage.getItem(STORAGE_KEY);
        let _data;
        try {
          _data = JSON.parse(_raw);
        } catch {
          return {};
        }
        if (!_data || typeof _data !== 'object' || Array.isArray(_data)) return {};
        const _settings = {};
        SETTINGS_FIELDS.forEach((_field) => {
          if (typeof _data[_field] === 'string') _settings[_field] = _data[_field];
        });
        if ('theme' in _settings) _settings.theme = _getStoredTheme(_settings.theme);
        return _settings;
      }

      function _loadSettings() {
        let _theme = DEFAULT_THEME;
        let _pgTableName = DEFAULT_PG_TABLE_INPUT;
        let _numberOffset = DEFAULT_NUMBER_OFFSET_INPUT;

        try {
          const _data = _readStoredSettings();
          if (typeof _data.input === 'string') {
            $inputArea.value = _data.input;
          }
          if (typeof _data.pgTableName === 'string') {
            _pgTableName = _data.pgTableName;
          }
          if (typeof _data.numberOffset === 'string') {
            _numberOffset = _data.numberOffset;
          }

          _theme = _getStoredTheme(_data.theme);
        } catch {}

        $pgTableNameInput.value = _pgTableName;
        $numberOffsetInput.value = _numberOffset;
        _applyTheme(_theme);
        _lastSavedSettings = _getCurrentSettings();
      }

      function _autoSave() {
        clearTimeout(_saveTimeout);
        _saveTimeout = setTimeout(_saveSettings, SAVE_DELAY_MS);
        if (_maxSaveTimeout === undefined) _maxSaveTimeout = setTimeout(_saveSettings, MAX_SAVE_WAIT_MS);
      }

      function _flushPendingSettings() {
        _saveSettings();
      }

      function _restorePage() {
        $compositionTarget = null;
        _applyTheme(_getThemeFromToggle());
        _convertAll();
        _autoSave();
      }

      function _handleInput(event) {
        if (event.target === $compositionTarget && event.isComposing === false) $compositionTarget = null;
        if (event.isComposing && !$compositionTarget) $compositionTarget = event.target;
        if (!$compositionTarget && !event.isComposing) _convertAll();
        _autoSave();
      }

      function _finishComposition(event) {
        if (!$compositionTarget || event.target !== $compositionTarget) return;
        $compositionTarget = null;
        _convertAll();
        _autoSave();
      }

      function _cancelPendingCopies() {
        _activeCopyRequest = undefined;
        qsa('.copy-btn', $main).forEach(($button) => {
          COPY_REQUEST_MAP.delete($button);
          _resetCopyState($button);
        });
      }

      function _setCopyButtonLabel($button, iconText, labelText) {
        const $icon = qs('.gm-icon path', $button);
        const $label = qs('.copy-label', $button);
        if ($icon && $icon.getAttribute('d') !== COPY_ICON_PATHS[iconText])
          $icon.setAttribute('d', COPY_ICON_PATHS[iconText]);
        if ($label && $label.textContent !== labelText) $label.textContent = labelText;
      }

      function _resetCopyState($button) {
        clearTimeout(COPY_TIMER_MAP.get($button));
        COPY_TIMER_MAP.delete($button);
        if ($button.classList.contains('copied')) $button.classList.remove('copied');
        $button.removeAttribute('aria-describedby');
        _setCopyButtonLabel($button, 'content_copy', $button.dataset.defaultLabel || 'コピー');
      }

      function _showCopiedState($button) {
        if ($button.disabled) return;
        const _existingTimer = COPY_TIMER_MAP.get($button);
        if (_existingTimer) {
          clearTimeout(_existingTimer);
        }

        $button.classList.add('copied');
        _setCopyButtonLabel($button, 'check', 'コピーしました');
        $button.setAttribute('aria-describedby', qs('.copy-label', $button).id);

        const _timer = setTimeout(() => {
          _resetCopyState($button);
        }, COPY_RESET_MS);

        COPY_TIMER_MAP.set($button, _timer);
      }

      function _fallbackCopy($target, text) {
        if ($target.value !== text) return false;
        const $active = document.activeElement;
        const _activeSelection =
          typeof $active?.selectionStart === 'number'
            ? [$active.selectionStart, $active.selectionEnd, $active.selectionDirection]
            : null;
        const _activeScroll = $active ? [$active.scrollLeft, $active.scrollTop] : null;
        const _selection = [$target.selectionStart, $target.selectionEnd, $target.selectionDirection];
        const _scroll = [$target.scrollLeft, $target.scrollTop];
        const _viewport = [window.scrollX, window.scrollY];
        const _documentSelection = window.getSelection();
        const _selectionEndpoints =
          _documentSelection?.rangeCount === 1
            ? [
                _documentSelection.anchorNode,
                _documentSelection.anchorOffset,
                _documentSelection.focusNode,
                _documentSelection.focusOffset
              ]
            : null;
        const _ranges = _documentSelection
          ? Array.from({ length: _documentSelection.rangeCount }, (_, index) =>
              _documentSelection.getRangeAt(index).cloneRange()
            )
          : [];
        try {
          $target.focus({ preventScroll: true });
          $target.select();
          return document.execCommand('copy') === true;
        } catch {
          return false;
        } finally {
          $target.setSelectionRange(..._selection);
          $target.scrollLeft = _scroll[0];
          $target.scrollTop = _scroll[1];
          if ($active !== $target) {
            $target.blur();
            if ($active?.isConnected) $active.focus({ preventScroll: true });
            if (_activeSelection && $active?.isConnected) {
              $active.setSelectionRange(..._activeSelection);
              $active.scrollLeft = _activeScroll[0];
              $active.scrollTop = _activeScroll[1];
            } else if (_documentSelection) {
              _documentSelection.removeAllRanges();
              if (_selectionEndpoints && typeof _documentSelection.setBaseAndExtent === 'function') {
                _documentSelection.setBaseAndExtent(..._selectionEndpoints);
              } else {
                _ranges.forEach((_range) => _documentSelection.addRange(_range));
              }
            }
          }
          window.scrollTo(..._viewport);
        }
      }

      async function _copyResult($button) {
        _convertAll();
        _autoSave();
        if ($button.disabled) return;
        const _targetSelector = $button.dataset.copyTarget;
        if (!_targetSelector) return;

        const $target = qs(_targetSelector);
        if (!$target || !$target.value) return;

        const _text = $target.value;
        const _request = {};
        _activeCopyRequest = _request;
        COPY_REQUEST_MAP.set($button, _request);
        qsa('.copy-btn', $main).forEach(_resetCopyState);
        const _isCurrent = () => {
          if (_activeCopyRequest !== _request || COPY_REQUEST_MAP.get($button) !== _request) return false;
          _convertAll();
          _autoSave();
          return COPY_REQUEST_MAP.get($button) === _request && !$button.disabled && $target.value === _text;
        };
        let _copied = false;
        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            await navigator.clipboard.writeText(_text);
            _copied = true;
          } else if (_isCurrent()) {
            _copied = _fallbackCopy($target, _text);
          }
        } catch {
          if (_isCurrent()) _copied = _fallbackCopy($target, _text);
        } finally {
          if (_isCurrent()) {
            if (_copied) _showCopiedState($button);
          }
          if (COPY_REQUEST_MAP.get($button) === _request) COPY_REQUEST_MAP.delete($button);
          if (_activeCopyRequest === _request) _activeCopyRequest = undefined;
        }
      }

      $inputArea.addEventListener('input', _handleInput);
      $pgTableNameInput.addEventListener('input', _handleInput);
      $numberOffsetInput.addEventListener('input', _handleInput);

      $main.addEventListener('change', (event) => {
        if (event.target === $inputArea || event.target === $pgTableNameInput || event.target === $numberOffsetInput) {
          _finishComposition(event);
          _handleInput(event);
        }
      });

      $main.addEventListener('compositionstart', (event) => {
        if (event.target === $inputArea || event.target === $pgTableNameInput || event.target === $numberOffsetInput) {
          $compositionTarget = event.target;
        }
      });

      $main.addEventListener('compositionend', _finishComposition);
      $main.addEventListener('focusout', _finishComposition);

      $lightModeToggle.addEventListener('change', () => {
        _applyTheme(_getThemeFromToggle());
        _saveSettings();
      });

      window.addEventListener('pagehide', () => {
        _cancelPendingCopies();
        _flushPendingSettings();
      });
      window.addEventListener('pageshow', _restorePage);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          _cancelPendingCopies();
          _flushPendingSettings();
        } else if (document.visibilityState === 'visible') {
          _restorePage();
        }
      });

      $main.addEventListener('click', (event) => {
        const $button = event.target.closest('.copy-btn');
        if (!$button) return;
        _copyResult($button);
      });

      _loadSettings();
    </script>
  </body>
</html>
